<div class="queue-map"><div class="map-kicker">GAME MODE</div><h2>무작위 총력전 · 아수라장</h2><p>5명의 파티가 게임을 준비했습니다.</p></div>
<div class="queue-slots">${party.map((c,i)=>`<div class="qslot ${i===0?"me":""}"><div class="role">${i===0?"PARTY LEADER":"PARTY MEMBER"}</div><div class="ring"></div><div class="silhouette">◉</div><div class="qname">${c.nickname}</div><div class="qreal">${c.name}</div>${i===0?'<div class="you">YOU</div>':""}</div>`).join("")}</div>
<div class="queue-bottom"><div class="queue-status">${searching?`게임 찾는 중 · ${String(Math.floor(queueSeconds/60)).padStart(2,"0")}:${String(queueSeconds%60).padStart(2,"0")}`:"준비 완료 · 5인 파티"}</div>
${searching?`<button class="findbtn searching">게임 찾는 중...</button><button class="cancelbtn" onclick="stopQueue()">취소</button>`:`<button class="findbtn" onclick="startQueue()">게임 찾기</button>`}</div>
</div>
${found?`<div class="matchfound"><div class="mf-inner"><div class="mf-icon"><span>⚔</span></div><div class="eyebrow">ARAM · CHAOS</div><h2>게임을 찾았습니다!</h2><p>무작위 총력전 · 아수라장</p><button class="accept" onclick="acceptMatch()">수락</button><button class="decline" onclick="stopQueue()">거절</button></div></div>`:""}`;
}
app.innerHTML=header(mode==="select"?"01 / CHARACTER":mode==="method"?"02 / CALL":"03 / PARTY")+`<main>${body}</main>`;
}
function goQueue(){mode="queue";searching=false;queueSeconds=0;render()}
function startQueue(){
  if(searching)return;
  searching=true;found=false;queueSeconds=0;render();
  clearInterval(queueTimer);
  queueTimer=setInterval(()=>{
    queueSeconds++;
    if(queueSeconds>=3){searching=false;found=true;clearInterval(queueTimer);}
    render();
  },1000);
}
function stopQueue(){
  searching=false;found=false;clearInterval(queueTimer);render();
}
const champions=[
{id:"janna",name:"잔나",title:"폭풍의 분노",icon:"🌪️"},{id:"kog",name:"코그모",title:"심연의 아귀",icon:"🟢"},{id:"ksante",name:"크산테",title:"나주마의 긍지",icon:"🛡️"},{id:"thresh",name:"쓰레쉬",title:"지옥의 간수",icon:"⛓️"},{id:"jinx",name:"징크스",title:"폭파 전문가",icon:"💥"},{id:"malph",name:"말파이트",title:"거석의 파편",icon:"🪨"},{id:"lux",name:"럭스",title:"광명의 소녀",icon:"✨"},{id:"brand",name:"브랜드",title:"타오르는 복수",icon:"🔥"},{id:"garen",name:"가렌",title:"데마시아의 힘",icon:"⚔️"},{id:"sona",name:"소나",title:"현의 명인",icon:"🎵"},{id:"milio",name:"밀리오",title:"포근한 불꽃",icon:"🔥"},{id:"ashe",name:"애쉬",title:"서리 궁수",icon:"🏹"},{id:"teemo",name:"티모",title:"날쌘 정찰병",icon:"🍄"},{id:"velkoz",name:"벨코즈",title:"공허의 눈",icon:"👁️"},{id:"urgot",name:"우르곳",title:"살상 병기",icon:"⚙️"},{id:"naafiri",name:"나피리",title:"백야의 추적자",icon:"🐺"},{id:"veigar",name:"베이가",title:"악의 작은 지배자",icon:"🪄"},
{id:"ahri",name:"아리",title:"구미호",icon:"🦊"},{id:"akali",name:"아칼리",title:"섀도우 아트",icon:"🥷"},{id:"darius",name:"다리우스",title:"녹서스의 실력자",icon:"🪓"},{id:"vayne",name:"베인",title:"어둠 사냥꾼",icon:"🏹"},{id:"yuumi",name:"유미",title:"마법 고양이",icon:"🐱"},{id:"ekko",name:"에코",title:"시간의 소년",icon:"⏱️"},{id:"kennen",name:"케넨",title:"폭풍의 심장",icon:"⚡"},{id:"nami",name:"나미",title:"파도 소환사",icon:"🌊"},{id:"sett",name:"세트",title:"오른팔",icon:"👊"},{id:"ornn",name:"오른",title:"불의 대장장이",icon:"🔨"},{id:"morgana",name:"모르가나",title:"타락한 천사",icon:"🪽"},{id:"ezreal",name:"이즈리얼",title:"무모한 탐험가",icon:"🎯"},{id:"leona",name:"레오나",title:"여명의 빛",icon:"☀️"},{id:"samira",name:"사미라",title:"사막의 장미",icon:"🌹"},{id:"swain",name:"스웨인",title:"녹서스의 대장군",icon:"🦅"},{id:"rengar",name:"렝가",title:"추적하는 포식자",icon:"🐯"},{id:"tristana",name:"트리스타나",title:"요들 사수",icon:"💣"},{id:"zilean",name:"질리언",title:"시간의 수호자",icon:"⏳"},{id:"braum",name:"브라움",title:"프렐요드의 심장",icon:"🛡️"},{id:"karthus",name:"카서스",title:"죽음을 노래하는 자",icon:"💀"},{id:"caitlyn",name:"케이틀린",title:"필트오버의 보안관",icon:"🔫"},{id:"rakan",name:"라칸",title:"매혹하는 자",icon:"🪶"},{id:"xayah",name:"자야",title:"저항의 발톱",icon:"🪶"}
];
function acceptMatch(){
  found=false; searching=false; queueSeconds=0;
  const pool=shuffle(champions);
  champOptions=pool.slice(0,3);
  teamPicks=[null,null,null,null,null];
  chosenChamp=null; finalPool=[]; enemyTeam=[]; mode="champSelect"; render();
}
function pickChampion(id){
  const chosen=champOptions.find(c=>c.id===id);
  if(!chosen)return;
  chosenChamp=chosen; teamPicks[0]=chosen;
  const remaining=shuffle(champions.filter(c=>c.id!==chosen.id));
  for(let i=1;i<5;i++) teamPicks[i]=remaining[i-1];
  finalPool=remaining.slice(4,14);
  mode="finalChamp"; render();
}
function startGame(){
  if(!chosenChamp)return;
  clearInterval(loadingTimer); clearInterval(battleTimer);
  const protectedIds=new Set(teamPicks.map(c=>c.id).concat(finalPool.map(c=>c.id)));
  const enemyPool=shuffle(champions.filter(c=>!protectedIds.has(c.id)));
  const enemyNames=shuffle(["원종나기","똥카게","회주잖아","발전병","Inkubus","Eternal Alomi","축구고트메시","한국기","돼지궁뎅이","아벌"]).slice(0,5);
  enemyTeam=enemyNames.map((nick,i)=>({nick,champ:enemyPool[i]}));
  loadingSeconds=10; mode="loading"; render();
  loadingTimer=setInterval(()=>{loadingSeconds--; if(loadingSeconds<=0){clearInterval(loadingTimer); startBattle();} else render();},1000);
}
function formatBattleTime(t){const m=String(Math.floor(t/60)).padStart(2,"0"),s=String(t%60).padStart(2,"0");return `${m}:${s}`}
function unitHtml(u,side){const x=Math.max(3,Math.min(97,u.x));return `<div class="battle-token ${side} ${u.alive?"":"fallen"}" style="left:${x}%"><span>${u.icon}</span><b>${u.nick}</b><i class="token-hp"><em style="width:${Math.max(0,u.hp)}%"></em></i></div>`}
function startBattle(){
  battleState={time:0,status:"전투 진행 중",team:teamPicks.map((c,i)=>({id:"t"+i,nick:party[i].nickname,champ:c,icon:c.icon,x:12+i*2,hp:100,alive:true,atk:3.5+Math.random()*2})),enemy:enemyTeam.map((e,i)=>({id:"e"+i,nick:e.nick,champ:e.champ,icon:e.champ.icon,x:88-i*2,hp:100,alive:true,atk:3.5+Math.random()*2})),log:["전투가 시작되었습니다."]};
  mode="battle"; render(); clearInterval(battleTimer); battleTimer=setInterval(stepBattle,650);
}
function stepBattle(){
  if(mode!=="battle"||!battleState)return;
  const bs=battleState; bs.time++;
  const livingT=bs.team.filter(u=>u.alive), livingE=bs.enemy.filter(u=>u.alive);
  if(!livingT.length||!livingE.length){bs.status=livingT.length?"우리 팀 승리":"적 팀 승리"; render(); clearInterval(battleTimer); return;}
  [...livingT,...livingE].forEach(u=>{const enemies=u.id[0]==="t"?livingE:livingT;if(!enemies.length)return;const target=enemies.reduce((a,b)=>Math.abs(b.x-u.x)<Math.abs(a.x-u.x)?b:a);const dist=Math.abs(target.x-u.x);if(dist>9)u.x+=(u.id[0]==="t"?1.4:-1.4);else {target.hp-=u.atk; if(target.hp<=0){target.hp=0;target.alive=false;bs.log.push(`${u.nick}이(가) ${target.nick}을(를) 쓰러뜨렸습니다.`);}}});
  if(bs.time%8===0){bs.log.push("양 팀이 전장에서 교전 중입니다.")}
  if(bs.time>90){bs.status="전투가 길어지고 있습니다"}
  render();
}
function choose(id){me=chars.find(c=>c.id===id);render()}
function goMethod(){mode="method";render()}
function startGroup(){party=[me,...shuffle(chars.filter(c=>c.id!==me.id)).slice(0,4)];chatMembers=shuffle(party.slice(1));replies=0;mode="group";render();tickGroup()}
function tickGroup(){if(replies>=4)return;setTimeout(()=>{replies++;render();tickGroup()},900)}
function finishGroup(){mode="party";render()}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):selected.length<4?[...selected,id]:selected;render()}
function startPrivate(){party=[me,...chars.filter(c=>selected.includes(c.id))];privateTargets=party.slice(1);privateIndex=0;mode="private";render();setTimeout(()=>{privateIndex=1;render()},1100)}
function nextPrivate(){if(privateIndex<3){privateIndex++;render()}else{mode="party";render()}}
let dragSource=null;
function dragStart(e,type,index){dragSource={type,index}; if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",`${type}:${index}`)}}
function allowDrop(e){e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect="move"}
function dragEnter(e){e.preventDefault();e.currentTarget.classList.add("drag-over")}
function dragLeave(e){e.currentTarget.classList.remove("drag-over")}
function dragEnd(e){document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));dragSource=null}
function dropSwap(e,targetType,targetIndex){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove("drag-over");
  if(!dragSource)return;
  const a=dragSource;
  if(a.type===targetType && a.index===targetIndex){dragSource=null;return;}
  if(a.type==="team" && targetType==="team"){
    const t=teamPicks[a.index];teamPicks[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="pool"){
    const t=finalPool[a.index];finalPool[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="team" && targetType==="pool"){
    const t=teamPicks[a.index];teamPicks[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="team"){
    const t=finalPool[a.index];finalPool[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }
  chosenChamp=teamPicks[0];
  dragSource=null;render();
}
function reset(){clearInterval(queueTimer);clearInterval(loadingTimer);clearInterval(battleTimer);dragSource=null;mode="select";me=null;selected=[];party=[];chatMembers=[];replies=0;privateIndex=0;searching=false;queueSeconds=0;found=false;champOptions=[];teamPicks=[];chosenChamp=null;finalPool=[];render()}
render();
</script>
