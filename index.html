/* V4 layout tuning */
.grid{gap:12px;margin-bottom:18px}
.card{min-height:112px;padding:16px}
.nick{font-size:19px;margin-top:21px}
.calls{gap:14px}
.call{padding:22px;min-height:185px}
.ready{max-width:860px;margin:0 auto 20px}
.party{max-width:860px;margin:0 auto 16px}

.head{border-radius:18px 18px 0 0}
.head div{padding-left:4px}

.queue-shell{min-height:650px;width:100%}

/* Champion select / final composition */
.champ-screen{padding-bottom:12px}
.champ-top{height:70px;flex:0 0 70px}
.champ-body{grid-template-columns:320px minmax(0,1fr) 320px}
.team-side,.enemy-side{padding:24px 16px}
.player-row{height:88px;padding:10px;gap:12px}
.player-row .avatar{width:60px;height:60px;font-size:29px}
.player-row strong{font-size:14px}
.player-row small{font-size:10px}
.enemy-side{opacity:1}
.enemy-side .player-row{background:#0a171e;border-color:#243840}
.enemy-side .avatar{color:#344a52;background:#081319}
.center-select{padding:92px 38px 24px;justify-content:flex-start;position:relative}
.center-select .sub{margin-top:8px}
.champ-options{grid-template-columns:repeat(3,minmax(210px,260px));gap:18px}
.champ-card{height:340px}
.champ-art{height:248px}

/* A separate row for the 10 unused champions, below the header, never overlapping the title. */
.unused-select-row{height:64px;flex:0 0 64px;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:1px solid #1f343c;background:#061018cc}

.unused-select-mini:nth-child(-n+5){border-color:#49636d}

.final-screen{overflow:hidden}
.final-top{height:76px;flex:0 0 76px}

.unused-pool{order:2;flex:1;max-width:none}
.final-main{grid-template-columns:340px minmax(0,1fr) 300px}
.final-team{padding:24px 16px}
.final-team .player-row{height:88px}
.final-center{align-items:flex-start;padding-top:48px}
.hero-champ{display:flex;flex-direction:column;align-items:center;width:min(600px,100%);position:relative}

.hero-champ h2{margin:12px 0 3px}
.final-label{top:18px}

<script>
const chars=[
["siljeom","실점","박성진"],["3patourwan","쓰리빠뚜르완","정다운"],["molcho","몰초","김병욱"],
["joguk","조국","임도현"],["mundolmaeng","문돌맹","이동기"],["nguyen","Nguyen Ngoc Tu","이재빈"],
["dwaemesa","돼메사","조시원"],["galio","갈리오","김정운"],["dage","다케스탄 출신","황재윤"]

let mode="select", me=null, selected=[], party=[], chatMembers=[], replies=0, privateIndex=0, privateTargets=[], searching=false, queueSeconds=0, queueTimer=null, found=false, champOptions=[], teamPicks=[], chosenChamp=null, finalPool=[];

const app=document.getElementById("app");
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function header(step){return `<header class="top"><div><div class="eyebrow">AUGMENT ARENA</div><h1>증강체 칼바람 매니저</h1></div><div class="step">${step}</div></header>`}
function button(text,disabled=false,onclick=""){return `<button class="primary" ${disabled?"disabled":""} onclick="${onclick}">${text}</button>`}
function render(){
let body="";
if(mode==="select"){
 body=`<div class="section"><span>01</span><div><h2>캐릭터를 선택하세요</h2><p>선택한 캐릭터가 이번 게임의 당신입니다.</p></div></div>
 <div class="grid">${chars.map((c,i)=>`<button class="card ${me?.id===c.id?"sel":""}" onclick="choose('${c.id}')"><span class="num">0${i+1}</span><span class="nick">${c.nickname}</span><span class="real">${c.name}</span><span class="check">${me?.id===c.id?"✓":""}</span></button>`).join("")}</div>
 ${button(me?me.nickname+"으로 계속하기 →":"캐릭터를 먼저 선택하세요",!me,"goMethod()")}`;

body=`<div class="section"><span>02</span><div><h2>어떻게 호출할까요?</h2><p><b>${me.nickname}</b> · ${me.name}으로 플레이합니다.</p></div></div>

body=`<div class="phonewrap"><div class="phone"><div class="head"><button onclick="mode='method';render()">‹</button><div><strong>우리들의 단톡방</strong><small>9명</small></div><em>•••</em></div><div class="chat"><div class="date">오늘</div>
<div class="msg mine"><div class="who">${me.name}</div><div class="bubble">겜 ㄱ?</div></div>
${chatMembers.slice(0,replies).map((c,i)=>`<div class="msg"><div class="who">${c.name}</div><div class="bubble">${i===3?"ㄱㄱ":"ㄱ"}</div></div>`).join("")}
${replies<4?`<div class="typing"><i></i><i></i><i></i></div>`:`<div class="system">5명이 게임에 참가했습니다.</div>`}</div><div class="input"><span>메시지를 입력하세요</span><b>＋</b><b>➤</b></div></div>
${button(replies<4?"친구들이 대답하는 중...":"파티 확인 →",replies<4,"finishGroup()")}</div>`;
}
if(mode==="manual"){
body=`<div class="section"><span>03</span><div><h2>파티원을 선택하세요</h2><p>본인을 제외하고 <b>4명</b>을 선택하세요.</p></div><div class="counter">${selected.length} / 4</div></div>
<div class="members">${chars.filter(c=>c.id!==me.id).map(c=>`<button class="member ${selected.includes(c.id)?"sel":""}" onclick="toggle('${c.id}')"><span class="box">${selected.includes(c.id)?"✓":""}</span><span><b>${c.nickname}</b><small>${c.name}</small></span></button>`).join("")}</div>
${button("개인톡 보내기 →",selected.length!==4,"startPrivate()")}<button class="back" onclick="mode='method';render()">← 호출 방식</button>`;
}
if(mode==="private"){
const target=privateTargets[privateIndex];
body=`<div class="phonewrap"><div class="phone"><div class="head"><button>‹</button><div><strong>${target.nickname}</strong><small>${target.name}</small></div><em>•••</em></div><div class="chat"><div class="date">오늘</div>
<div class="msg mine"><div class="who">${me.name}</div><div class="bubble">겜 ㄱ?</div></div>
${privateIndex>0?`<div class="msg"><div class="who">${target.nickname}</div><div class="bubble">ㄱ</div></div>`:`<div class="typing"><i></i><i></i><i></i></div>`}
${privateIndex===3?`<div class="system">4명 모두에게서 답장이 왔습니다.</div>`:""}</div><div class="input"><span>메시지를 입력하세요</span><b>＋</b><b>➤</b></div></div>
${button(privateIndex===3?"파티 확인 →":privateIndex===0?"답장 기다리는 중...":"다음 친구 호출 →",privateIndex===0,"nextPrivate()")}</div>`;
}
if(mode==="champSelect"){
body=`<div class="champ-screen"><div class="champ-top"><div class="champ-timer">12</div><div class="title"><small>무작위 총력전 · 아수라장</small><strong>챔피언 선택</strong></div><div style="width:90px;text-align:right;color:#75878c;font-size:9px">내 차례</div></div>
<div class="unused-select-row">${champions.filter(c=>!champOptions.some(o=>o.id===c.id)).slice(0,10).map(c=>`<div class="unused-select-mini">${c.icon}</div>`).join("")}</div>
<div class="champ-body"><div class="team-side"><div class="side-title">우리 팀</div>${party.map((c,i)=>`<div class="player-row ${i===0?"you":""}"><div class="avatar">${teamPicks[i]?teamPicks[i].icon:"?"}</div><div><strong>${c.nickname}</strong><small>${teamPicks[i]?teamPicks[i].name:"선택 중..."}</small></div>${i===0?"<em>YOU</em>":""}</div>`).join("")}</div>
<div class="center-select"><div class="sub">YOUR TURN</div><h2>챔피언을 선택하세요</h2><p>무작위로 제시된 3명의 챔피언 중 하나를 선택합니다.</p><div class="champ-options">${champOptions.map(c=>`<button class="champ-card" onclick="pickChampion('${c.id}')"><div class="champ-art">${c.icon}</div><div class="cc-bottom"><strong>${c.name}</strong><small>${c.title}</small></div></button>`).join("")}</div></div>
<div class="enemy-side"><div class="side-title">상대 팀</div>${[1,2,3,4,5].map(i=>`<div class="player-row"><div class="avatar">?</div><div><strong>상대 ${i}</strong><small>선택 중...</small></div></div>`).join("")}</div></div></div>`;
}
if(mode==="finalChamp"){
body=`<div class="final-screen"><div class="final-top"><div class="picked-title"><small>무작위 총력전 · 아수라장</small><strong>챔피언 선택 완료</strong></div><div class="unused-pool">${finalPool.map(c=>`<div class="unused">${c.icon}</div>`).join("")}</div></div>
<div class="final-main"><div class="final-team"><div class="side-title">우리 팀 · 선택한 챔피언</div>${party.map((c,i)=>`<div class="player-row ${i===0?"you":""}"><div class="avatar">${teamPicks[i].icon}</div><div><strong>${c.nickname}</strong><small>${teamPicks[i].name}</small></div>${i===0?"<em>YOU</em>":""}</div>`).join("")}</div>
<div class="final-center"><div class="final-label">YOUR CHAMPION</div><div class="hero-champ"><div class="hero-art">${chosenChamp.icon}</div><h2>${chosenChamp.name}</h2><p>${chosenChamp.title}</p>
<div class="champ-chat"><div class="champ-chat-head">파티 채팅 · 게임 시작 전</div><div class="champ-chat-body">
<div class="champ-chat-msg mine"><b>${me.name}</b><span class="champ-chat-bubble">이걸로 간다</span></div>
<div class="champ-chat-msg"><b>${party[1].name}</b><span class="champ-chat-bubble">ㄱ</span></div>
<div class="champ-chat-msg"><b>${party[2].name}</b><span class="champ-chat-bubble">좋다</span></div>
</div></div></div></div>
<div class="final-enemy"><div class="enemy-list"><div class="side-title">상대 팀 · 챔피언 비공개</div>${[1,2,3,4,5].map(i=>`<div class="enemy-row"><div class="enemy-hidden">?</div><strong>적${i}</strong></div>`).join("")}</div></div></div></div>`;
}
if(mode==="party"){
body=`<div class="ready"><div class="mark">✓</div><div><div class="eyebrow">PARTY READY</div><h2>파티가 구성되었습니다.</h2><p>5명이 게임에 참가합니다.</p></div></div>
<div class="party">${party.map((c,i)=>`<div class="pm"><span class="pn">0${i+1}</span><div><strong>${c.nickname}</strong><small>${c.name}</small></div>${i===0?"<em>YOU</em>":""}</div>`).join("")}</div>
${button("게임 대기열로 →",false,"goQueue()")}`;
}
if(mode==="queue"){
body=`<div class="queue-shell">
<div class="queue-top"><div class="lolmark">◈</div><div class="navitem">전략적 팀 전투</div><div class="navitem">소환사의 협곡</div><div class="navitem">무작위 총력전</div><div class="navitem dim">연습 모드</div></div>
<div class="queue-map"><div class="map-kicker">GAME MODE</div><h2>무작위 총력전 · 아수라장</h2><p>5명의 파티가 게임을 준비했습니다.</p></div>
<div class="queue-slots">${party.map((c,i)=>`<div class="qslot ${i===0?"me":""}"><div class="role">${i===0?"PARTY LEADER":"PARTY MEMBER"}</div><div class="ring"></div><div class="silhouette">◉</div><div class="qname">${c.nickname}</div><div class="qreal">${c.name}</div>${i===0?'<div class="you">YOU</div>':""}</div>`).join("")}</div>
<div class="queue-bottom"><div class="queue-status">${searching?`게임 찾는 중 · ${String(Math.floor(queueSeconds/60)).padStart(2,"0")}:${String(queueSeconds%60).padStart(2,"0")}`:"준비 완료 · 5인 파티"}</div>
${searching?`<button class="findbtn searching">게임 찾는 중...</button><button class="cancelbtn" onclick="stopQueue()">취소</button>`:`<button class="findbtn" onclick="startQueue()">게임 찾기</button>`}</div>
</div>
${found?`<div class="matchfound"><div class="mf-inner"><div class="mf-icon"><span>⚔</span></div><div class="eyebrow">ARAM · CHAOS</div><h2>게임을 찾았습니다!</h2><p>무작위 총력전 · 아수라장</p><button class="accept" onclick="acceptMatch()">수락</button><button class="decline" onclick="stopQueue()">거절</button></div></div>`:""}`;
}
app.innerHTML=header(mode==="select"?"01 / CHARACTER":mode==="method"?"02 / CALL":"03 / PARTY")+`<main>${body}</main>`;
}
function goQueue(){mode="queue";searching=false;queueSeconds=0;render()}
function startQueue(){
  if(searching)return;
  searching=true;found=false;queueSeconds=0;render();
  clearInterval(queueTimer);
  queueTimer=setInterval(()=>{
    queueSeconds++;
    if(queueSeconds>=3){searching=false;found=true;clearInterval(queueTimer);}
    render();
  },1000);
}
function stopQueue(){
  searching=false;found=false;clearInterval(queueTimer);render();
}
const champions=[
{id:"janna",name:"잔나",title:"폭풍의 분노",icon:"🌪️"},{id:"kog",name:"코그모",title:"심연의 아귀",icon:"🟢"},
{id:"ksante",name:"크산테",title:"나주마의 긍지",icon:"🛡️"},{id:"thresh",name:"쓰레쉬",title:"지옥의 간수",icon:"⛓️"},
{id:"jinx",name:"징크스",title:"폭파 전문가",icon:"💥"},{id:"malph",name:"말파이트",title:"거석의 파편",icon:"🪨"},
{id:"lux",name:"럭스",title:"광명의 소녀",icon:"✨"},{id:"brand",name:"브랜드",title:"타오르는 복수",icon:"🔥"},
{id:"garen",name:"가렌",title:"데마시아의 힘",icon:"⚔️"},{id:"sona",name:"소나",title:"현의 명인",icon:"🎵"},
{id:"milio",name:"밀리오",title:"포근한 불꽃",icon:"🔥"},{id:"ashe",name:"애쉬",title:"서리 궁수",icon:"🏹"},
{id:"teemo",name:"티모",title:"날쌘 정찰병",icon:"🍄"},{id:"velkoz",name:"벨코즈",title:"공허의 눈",icon:"👁️"},
{id:"urgot",name:"우르곳",title:"살상 병기",icon:"⚙️"},{id:"naafiri",name:"나피리",title:"백야의 추적자",icon:"🐺"},
{id:"veigar",name:"베이가",title:"악의 작은 지배자",icon:"🪄"}
];
function acceptMatch(){
  found=false; searching=false; queueSeconds=0;
  const pool=shuffle(champions);
  champOptions=pool.slice(0,3);
  teamPicks=[null,null,null,null,null];
  chosenChamp=null; finalPool=[]; mode="champSelect"; render();
}
function pickChampion(id){
  const chosen=champOptions.find(c=>c.id===id);
  if(!chosen)return;
  chosenChamp=chosen; teamPicks[0]=chosen;
  const remaining=shuffle(champions.filter(c=>c.id!==chosen.id));
  for(let i=1;i<5;i++) teamPicks[i]=remaining[i-1];
  finalPool=remaining.slice(4,14);
  mode="finalChamp"; render();
}
function choose(id){me=chars.find(c=>c.id===id);render()}
function goMethod(){mode="method";render()}
function startGroup(){party=[me,...shuffle(chars.filter(c=>c.id!==me.id)).slice(0,4)];chatMembers=shuffle(party.slice(1));replies=0;mode="group";render();tickGroup()}
function tickGroup(){if(replies>=4)return;setTimeout(()=>{replies++;render();tickGroup()},900)}
function finishGroup(){mode="party";render()}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):selected.length<4?[...selected,id]:selected;render()}
function startPrivate(){party=[me,...chars.filter(c=>selected.includes(c.id))];privateTargets=party.slice(1);privateIndex=0;mode="private";render();setTimeout(()=>{privateIndex=1;render()},1100)}
function nextPrivate(){if(privateIndex<3){privateIndex++;render()}else{mode="party";render()}}
function reset(){clearInterval(queueTimer);mode="select";me=null;selected=[];party=[];chatMembers=[];replies=0;privateIndex=0;searching=false;queueSeconds=0;found=false;champOptions=[];teamPicks=[];chosenChamp=null;finalPool=[];render()}
render();
</script>
</body>
</html>
