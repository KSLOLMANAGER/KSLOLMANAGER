 DB.forEach((src,i)=>{if(VOLTA_LEAGUES[i]){VOLTA_LEAGUES[i].grade=src.grade;VOLTA_LEAGUES[i].name=src.name;VOLTA_LEAGUES[i].teams=src.teams.map(t=>({name:t.name,players:t.players.slice()}));}});

 const oldSeasonEnsure=voltaEnsureLeagueSeasonV102;
 function keyFor(idx){const l=VOLTA_LEAGUES[idx];return `v119:${voltaSave.seasonYear}:${idx}:${l.grade}:${l.name}`}

 function aiPairs(names,excluded,roundIndex){const left=names.filter(n=>n!==excluded),rot=left.length?roundIndex%left.length:0,arr=left.slice(rot).concat(left.slice(0,rot)),pairs=[];for(let i=0;i+1<arr.length;i+=2)pairs.push({home:arr[i],away:arr[i+1]});return pairs}

   return names.map((opp,i)=>{const homeUs=idx===0?true:i%2===0,v=roundVenue(idx,opp,homeUs),user=homeUs?{home:teamName,away:opp}:{home:opp,away:teamName},fixtures=[user,...aiPairs(names,opp,i)];return {date:addDays(base,i*gap),round:i+1,roundLabel:`${i+1} ROUND`,venue:v.venue,venueType:v.venueType,fixtures};});
 }
 function freshSeason(){
   const idx=Math.max(0,Math.min(VOLTA_LEAGUES.length-1,voltaSave.leagueIndex||0)),league=VOLTA_LEAGUES[idx],names=[voltaSave.teamName,...league.teams.map(t=>t.name)],table={};

   return {key:keyFor(idx),round:0,schedule:makeSchedule(voltaSave.teamName,league,idx,voltaSave.seasonYear),table,history:[],playerStats,completed:false,championRewarded:false};
 }

 function esc(x){return typeof voltaV117Esc==='function'?voltaV117Esc(x):String(x??'')}
 function assignedEntries(){return Object.entries(voltaSave?.squadSlots||{}).filter(([,n])=>!!n)}
 function normalizeSquad(){
   if(!voltaSave)return false;voltaSave.squadSlots=voltaSave.squadSlots||{};
   const priority=['G1','D2','D3','M2','M3','F2','D1','D4','M1','M4','F1','F3','F4'];
   const names=new Set(),keep=[];
   for(const id of priority){const n=voltaSave.squadSlots[id];if(n&&!names.has(n)&&keep.length<V120.MAX_STARTERS){names.add(n);keep.push([id,n])}}
   for(const [id,n] of Object.entries(voltaSave.squadSlots)){if(n&&!names.has(n)&&keep.length<V120.MAX_STARTERS){names.add(n);keep.push([id,n])}}
   const old=JSON.stringify(voltaSave.squadSlots),next={};keep.forEach(([id,n])=>next[id]=n);voltaSave.squadSlots=next;
   return old!==JSON.stringify(next);
 }
 const homeLineupBase=voltaHomeLineup;
 voltaHomeLineup=function(){
   if(voltaSave?.v118ManualSquad){
     voltaEnsureRosterProfiles();voltaEnsureV102Save();normalizeSquad();
     const order=['G1','D2','D3','M2','M3','F2','D1','D4','M1','M4','F1','F3','F4'],out=[],seen=new Set();
     for(const id of order){const name=voltaSave.squadSlots?.[id];if(!name||seen.has(name))continue;const p=voltaSave.roster.find(x=>x.name===name);if(p){seen.add(name);out.push({...p,position:voltaSlotLine(id),slotId:id});if(out.length>=V120.MAX_STARTERS)break}}
     return out;
   }
   return homeLineupBase();
 };

 const assignBase=voltaAssignSquadSlot;
 voltaAssignSquadSlot=function(slotId){
   voltaEnsureV102Save();const selected=voltaSquadSelected;if(!selected)return;
   normalizeSquad();const slots=voltaSave.squadSlots||{},oldSlot=voltaSlotForPlayer(selected),occupant=slots[slotId];
   const count=new Set(Object.values(slots).filter(Boolean)).size;
   if(!oldSlot&&!occupant&&count>=V120.MAX_STARTERS){
     voltaSquadSelected=null;voltaV117Toast('주전은 최대 6명까지만 배치할 수 있습니다. 기존 주전과 교체하거나 한 명을 빼주세요.');render();return;
   }
   return assignBase(slotId);
 };

 /* Rest is a Wednesday training choice, not a free healing button. */
 voltaRestSquad=function(){
   voltaEnsureRosterProfiles();
   if(!voltaTrainingAvailableToday()){alert('전원 휴식도 주간 훈련과 동일하게 매주 수요일에 한 번만 선택할 수 있습니다.');return}
   const heal=Math.round(30*voltaManagerMods().recovery);
   for(const p of voltaSave.roster)p.condition=voltaClamp((Number(p.condition)||0)+heal,0,100);
   voltaSave.lastTrainingDate=voltaSave.currentDate;
   voltaNotify('training','주간 전원 휴식',`이번 주 수요일 훈련 대신 전원 휴식을 선택했습니다. 체력 +${heal}`,'info');
   voltaAdvanceDays(1);voltaPersist();mode='volta-club';render();
 };

 /* Fixed visual exposure: no automatic normal/highlight brightness switching. */
 voltaPresentationMode='steady';
 voltaPresentationState=function(){return 'steady'};
 voltaSetPresentationMode=function(){voltaPresentationMode='steady'};

 /* Preserve stats of a sent-off player for the live match board. */
 const sendOffBase=voltaV115SendOff;
 voltaV115SendOff=function(side,p,reason){
   const snap=p?{name:p.name,position:p.position,condition:p.condition||0,matchGoals:p.matchGoals||0,matchAssists:p.matchAssists||0,yellowCards:p.yellowCards||0}:null;
   sendOffBase(side,p,reason);
   const a=voltaMatchState?.sentOff?.[side];if(snap&&a?.length)Object.assign(a[a.length-1],snap,{redCards:1});
 };

 function historyFor(round){if(!round)return null;return [...(voltaSave?.season?.history||[])].reverse().find(h=>h.date===round.date&&(h.home===voltaSave.teamName||h.away===voltaSave.teamName))||null}
 function oppFor(round){const f=round?.fixtures?.find(x=>x.home===voltaSave.teamName||x.away===voltaSave.teamName);return !f?'-':(f.home===voltaSave.teamName?f.away:f.home)}
 function resultFor(h){if(!h)return {txt:'예정',cls:''};const a=h.home===voltaSave.teamName?h.hg:h.ag,b=h.home===voltaSave.teamName?h.ag:h.hg;return {txt:`${a}:${b} ${a>b?'승':a<b?'패':'무'}`,cls:a>b?'win':a<b?'loss':'draw'}}
 function scheduleHtml(){
   const s=voltaSave?.season||{schedule:[],round:0};
   return `<section class="v120-schedule-card"><div class="v120-schedule-title"><h3>시즌 일정</h3><span>${esc(voltaLeague().name)} · ${s.round}/${s.schedule.length} 경기 완료</span></div><div class="v120-schedule-head"><span>R</span><span>날짜</span><span>장소</span><span>상대</span><span>결과</span></div>${s.schedule.map((r,i)=>{const h=historyFor(r),res=resultFor(h),tag=r.venueType==='원정'?'원정':r.venueType==='홈'?'홈':'교내';return `<div class="v120-schedule-row ${i<s.round?'done':''} ${i===s.round?'current':''}"><b class="round">${i+1}R</b><span>${esc(voltaDateLabel(r.date))}</span><span class="where"><i class="tag ${tag==='원정'?'away':''}">${tag}</i>${esc(r.venue||'곡선중')}</span><span class="opp">${esc(oppFor(r))}</span><span class="result ${res.cls}">${res.txt}</span></div>`}).join('')}</section>`;
 }

 function hudPlayerRow(p,sent=false){
   const y=p.yellowCards||0,r=sent?1:(p.sentOff?1:0),cond=Math.max(0,Math.round(p.condition||0));
   return `<div class="v120-hud-row ${y?'warn':''} ${r?'sentoff':''}"><span class="pos">${esc(p.position||'-')}</span><span class="name">${esc(p.name)}</span><span class="num">⚽ ${p.matchGoals||0}</span><span class="num">A ${p.matchAssists||0}</span><span class="fit"><b>${cond}%</b><i><u style="width:${voltaClamp(cond,0,100)}%"></u></i></span><span class="yc">${y?'🟨'+y:'-'}</span><span class="rc">${r?'🟥':'-'}</span></div>`;
 }
 function teamRows(side){
   const s=voltaMatchState;if(!s)return'';const live=(s.teams?.[side]?.players||[]).map(p=>hudPlayerRow(p,false));const reds=(s.sentOff?.[side]||[]).map(p=>hudPlayerRow(p,true));return [...live,...reds].join('')||'<div class="v120-hud-empty">선수 정보 없음</div>';
 }
 function matchHudHtml(){
   const s=voltaMatchState;if(!s)return'';return `<div id="v120MatchHud" class="v120-match-hud"><div class="v120-hud-title"><span>선수 경기 기록</span><span>골 · 도움 · 체력 · 카드</span></div><div class="v120-hud-teams"><section class="v120-hud-team"><h4>${esc(s.homeName)}</h4><div class="v120-hud-colhead"><span>POS</span><span>선수</span><span>G</span><span>A</span><span>체력</span><span>경고</span><span>퇴장</span></div><div data-v120-team="home">${teamRows('home')}</div></section><section class="v120-hud-team"><h4>${esc(s.awayName)}</h4><div class="v120-hud-colhead"><span>POS</span><span>선수</span><span>G</span><span>A</span><span>체력</span><span>경고</span><span>퇴장</span></div><div data-v120-team="away">${teamRows('away')}</div></section></div></div>`;
 }
 function ensureMatchHud(){
   if(mode!=='volta-match'||!voltaMatchState)return;const center=document.querySelector('.volta-live-center');if(!center)return;let hud=document.getElementById('v120MatchHud');if(!hud){center.insertAdjacentHTML('beforeend',matchHudHtml());hud=document.getElementById('v120MatchHud')}for(const side of ['home','away']){const el=hud?.querySelector(`[data-v120-team="${side}"]`);if(el)el.innerHTML=teamRows(side)}
 }

 /* Yellow-carded player names turn yellow on the pitch; reds are already removed by engine. */
 const drawBase=voltaDrawMatchCanvas;
 voltaDrawMatchCanvas=function(now=typeof voltaV113Now==='function'?voltaV113Now():performance.now()){
   drawBase(now);const s=voltaMatchState,cv=document.getElementById('voltaMatchCanvas');if(!s||!cv)return;const ctx=cv.getContext('2d');
   for(const side of ['home','away'])for(const p of (s.teams?.[side]?.players||[])){if(!(p.yellowCards>0))continue;const pt=s.board?.playerPos?.[side]?.[p.name];if(!pt)continue;const q=voltaCanvasPos(cv,pt.x,pt.y),r=p.position==='GK'?19:18;ctx.save();ctx.font='900 10px Segoe UI, Malgun Gothic, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineWidth=3;ctx.strokeStyle='rgba(0,0,0,.85)';ctx.fillStyle='#ffd84d';ctx.strokeText(p.name,q.x,q.y+r+13);ctx.fillText(p.name,q.x,q.y+r+13);ctx.restore()}
 };

 const syncBase=voltaSyncLiveDom;
 voltaSyncLiveDom=function(){const r=syncBase();try{ensureMatchHud()}catch(e){}return r};

 function enhance(){
   if(!voltaSave)return;
   if(normalizeSquad())try{voltaPersist()}catch(e){}
   if(mode==='volta-training'){
     const btn=document.querySelector('.volta-rest-all');if(btn){const ok=voltaTrainingAvailableToday();btn.disabled=!ok;btn.title=ok?'이번 주 수요일 훈련 대신 휴식':'휴식은 매주 수요일 1회만 선택할 수 있습니다.'}
   }
   if(mode==='volta-calendar'){
     const old=document.querySelector('.v119-schedule-card,.volta-season-schedule');if(old)old.outerHTML=scheduleHtml();
   }
   if(mode==='volta-match')ensureMatchHud();
 }
 const renderBase=render;
 render=function(){const r=renderBase();try{enhance()}catch(e){console.error('[V120 UI]',e)}return r};

 try{if(voltaSave){if(normalizeSquad())voltaPersist();render()}}catch(e){console.error('[V120 INIT]',e)}
})();
</script>

<style id="v121-style">

.v121-ht-layout{display:grid;grid-template-columns:minmax(520px,1.15fr) minmax(310px,.85fr);gap:18px;align-items:start;margin-top:14px}.v121-ht-pitch{position:relative;min-height:570px;border:2px solid #44647a;background:linear-gradient(180deg,#12334a,#0b2637);overflow:hidden}.v121-ht-pitch:before{content:'';position:absolute;inset:4%;border:1px solid #7a9aac}.v121-ht-pitch:after{content:'';position:absolute;left:4%;right:4%;top:50%;border-top:1px solid #7a9aac}.v121-ht-midcircle{position:absolute;left:50%;top:50%;width:110px;height:110px;transform:translate(-50%,-50%);border:1px solid #7a9aac;border-radius:50%}.v121-ht-line-label{position:absolute;left:13px;color:#8fb2c7;font-size:10px;font-weight:1000;letter-spacing:.14em}.v121-ht-line-label.fw{top:7%}.v121-ht-line-label.mf{top:34%}.v121-ht-line-label.df{top:61%}.v121-ht-line-label.gk{top:86%}.v121-ht-slot{position:absolute;transform:translate(-50%,-50%);width:108px;min-height:68px;border:1px dashed #57768a;background:#102532d9;color:#8ea7b6;display:grid;place-items:center;padding:5px;cursor:pointer}.v121-ht-slot.filled{border-style:solid;border-color:#48a6da;background:#102f42;color:#fff;cursor:grab;box-shadow:0 5px 14px #0007}.v121-ht-slot.dragover{outline:2px solid #f2c84b}.v121-ht-slot b{font-size:13px}.v121-ht-slot span{font-size:9px;color:#7f9bab}.v121-ht-slot.filled span{color:#79d994}.v121-ht-side h3{margin:8px 0;color:#f1cb54}.v121-ht-note{padding:10px 12px;border-left:3px solid #4598c8;background:#0d1a24;color:#a9bac5;font-size:11px;line-height:1.6}.v121-locked-player{opacity:.45;text-decoration:line-through}.v121-ht-subnote{margin:6px 0;color:#879da9;font-size:10px}.v121-ht-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.v121-ht-actions button{padding:11px 16px;font-weight:1000}
@media(max-width:1050px){.v121-ht-layout{grid-template-columns:1fr}.v121-ht-pitch{min-height:520px}.v121-sub-card{min-width:300px}}
</style>
<script id="v121-match-flow">
(function(){
 const V121={SUB_FX_MS:5000};
 function esc(x){return typeof voltaV117Esc==='function'?voltaV117Esc(x):String(x??'')}
 function now(){return typeof voltaV113Now==='function'?voltaV113Now():performance.now()}
 function ensureSubState(){const s=voltaMatchState;if(!s)return null;s.subbedOut=s.subbedOut||{home:[],away:[]};s.pendingSub=s.pendingSub||null;return s}
 function lockedSet(side){const s=ensureSubState();return new Set(s?.subbedOut?.[side]||[])}
 function eligibleBench(side){const s=ensureSubState(),team=s?.teams?.[side];if(!team)return[];const lock=lockedSet(side);return (team.bench||[]).filter(p=>!lock.has(p.name)&&!p.sentOff)}
 function addLocked(side,name){const s=ensureSubState();if(!s||!name)return;if(!s.subbedOut[side].includes(name))s.subbedOut[side].push(name)}
 function replaceLayoutName(oldName,newName){const s=voltaMatchState,lay=s?.halftime?.layout;if(!lay)return;for(const k of Object.keys(lay))if(lay[k]===oldName)lay[k]=newName}
 function subFx(outgoing,incoming,side){const s=voltaMatchState;if(!s)return;s.subFx={outName:outgoing.name,inName:incoming.name,side,startedAt:now(),until:now()+V121.SUB_FX_MS};s.highlight=`🔄 ${incoming.name} IN · ${outgoing.name} OUT`;try{voltaSetCaption(s.highlight,'half')}catch(e){}
 }
 function applySub(side,outName,inName,source='deadball'){
   const s=ensureSubState();if(!s||s.finished)return false;const team=s.teams?.[side];if(!team)return false;const bench=team.bench||[],oi=team.players.findIndex(p=>p.name===outName),bi=bench.findIndex(p=>p.name===inName);if(oi<0||bi<0)return false;
   const incoming=bench[bi],outgoing=team.players[oi],lock=lockedSet(side);
   if(lock.has(incoming.name)){alert(`${incoming.name} 선수는 이미 교체 아웃되어 이번 경기에는 다시 들어갈 수 없습니다.`);return false}
   if((incoming.condition||0)<20){alert('체력 20 미만 선수는 교체 투입할 수 없습니다.');return false}
   const oldPt=s.board?.playerPos?.[side]?.[outgoing.name];incoming.position=outgoing.position;incoming.tacticalSlot=outgoing.tacticalSlot||outgoing.slotId||incoming.tacticalSlot||null;incoming.slotId=outgoing.slotId||incoming.slotId||null;incoming.appeared=true;team.players[oi]=incoming;bench[bi]=outgoing;team.bench=bench;addLocked(side,outgoing.name);replaceLayoutName(outgoing.name,incoming.name);
   if(s.board?.playerPos?.[side]){if(oldPt)s.board.playerPos[side][incoming.name]={...oldPt,vx:0,vy:0,dirX:0,dirY:0};delete s.board.playerPos[side][outgoing.name]}
   if(s.aiStates?.[side]){delete s.aiStates[side][outgoing.name];try{voltaV113SetIntent(side,incoming,'HOLD',{reason:'substitution settle',minCommit:700,maxCommit:1000},true)}catch(e){}}
   try{team.metrics=voltaTeamMetrics(team.players,team.tactics,side===(s.userSide||'home')?voltaHeadCoach().name:'임도현',side===(s.userSide||'home')?voltaMoraleMult():1)}catch(e){}
   if(s.setPiece){try{voltaV115ApplyRestartShape(s.setPiece)}catch(e){} if(s.setPiece.type==='KICKOFF')snapKickoff(s.setPiece)}
   subFx(outgoing,incoming,side);voltaLog(`🔄 교체 승인: ${incoming.name} IN · ${outgoing.name} OUT`,'half');s.pendingSub=null;try{render()}catch(e){}return true;
 }
 function canApplyNow(){const s=voltaMatchState;return !!(s&&(s.setPiece||s.halftime?.active||s.tacticalTimeout?.active))}
 function tryPending(){const s=ensureSubState();if(!s?.pendingSub||!canApplyNow())return false;const p=s.pendingSub;return applySub(p.side,p.outName,p.inName,'pending')}
 function requestSub(outName,inName){const s=ensureSubState();if(!s||s.finished)return;const side=s.userSide||'home',team=s.teams[side];if(!team)return;const out=team.players.find(p=>p.name===outName),inc=(team.bench||[]).find(p=>p.name===inName);if(!out||!inc)return;if(lockedSet(side).has(inc.name)){alert(`${inc.name} 선수는 이미 교체되어 나간 선수라 재투입할 수 없습니다.`);return}if((inc.condition||0)<20){alert('체력 20 미만 선수는 교체 투입할 수 없습니다.');return}
   if(canApplyNow()){applySub(side,outName,inName,'deadball');return}
   s.pendingSub={side,outName,inName,requestedAt:now()};voltaLog(`⏳ 교체 요청: ${inc.name} IN · ${out.name} OUT — 다음 데드볼에 진행합니다.`,'half');try{voltaSetCaption(`⏳ 교체 대기 · ${inc.name} IN / ${out.name} OUT`,'half')}catch(e){}refreshSubUi();
 }
 voltaMakeSubstitution=function(){const s=voltaMatchState;if(!s||s.finished)return;const outName=document.getElementById('voltaSubOut')?.value,inName=document.getElementById('voltaSubIn')?.value;if(!outName||!inName)return;requestSub(outName,inName)};

 function refreshSubUi(){const s=ensureSubState();if(!s||mode!=='volta-match')return;const side=s.userSide||'home',team=s.teams[side],sel=document.getElementById('voltaSubIn'),out=document.getElementById('voltaSubOut');if(sel){const cur=sel.value,eligible=eligibleBench(side);sel.innerHTML=eligible.map(p=>`<option value="${esc(p.name)}">${esc(p.name)} · ❤️${Math.round(p.condition||0)}</option>`).join('');if(eligible.some(p=>p.name===cur))sel.value=cur;sel.disabled=!eligible.length}
   const btn=document.querySelector('.volta-sub-box button');if(btn){btn.textContent=s.pendingSub?'교체 대기 변경':'교체 요청';btn.disabled=!(out?.value&&sel?.value)}
   let n=document.querySelector('.v121-sub-pending');if(s.pendingSub){if(!n){n=document.createElement('div');n.className='v121-sub-pending';document.querySelector('.volta-sub-box')?.appendChild(n)}n.textContent=`다음 데드볼 교체 대기 · IN ${s.pendingSub.inName} / OUT ${s.pendingSub.outName}`}else if(n)n.remove();
 }

 function subFxHtml(){return `<div id="v121SubFx" class="v121-sub-fx"><div class="v121-sub-card"><small>SUBSTITUTION</small><div class="v121-sub-line in"><b>IN</b><strong data-v121-in></strong></div><div class="v121-sub-line out"><b>OUT</b><strong data-v121-out></strong></div><em>교체 선수 확인 · 경기 재개 준비</em></div></div>`}
 const pitchBase=voltaPitchHtml;
 voltaPitchHtml=function(){const h=pitchBase();return h.replace(/<\/div>\s*$/,subFxHtml()+'</div>')};
 function updateSubFx(){const s=voltaMatchState,el=document.getElementById('v121SubFx');if(!el||!s)return;const fx=s.subFx,on=!!(fx&&now()<fx.until);el.classList.toggle('on',on);if(on){const i=el.querySelector('[data-v121-in]'),o=el.querySelector('[data-v121-out]');if(i)i.textContent=fx.inName;if(o)o.textContent=fx.outName}else if(fx&&now()>=fx.until)s.subFx=null}

 const handleSetPieceBase=voltaV113HandleSetPiece;
 voltaV113HandleSetPiece=function(t){const s=voltaMatchState;if(s?.subFx&&t<s.subFx.until)return true;if(s?.pendingSub)tryPending();return handleSetPieceBase(t)};

 function snapKickoff(sp){const s=voltaMatchState;if(!s||!sp||sp.type!=='KICKOFF')return;for(const side of ['home','away']){s.board.playerPos[side]=s.board.playerPos[side]||{};for(const p of s.teams[side].players){const q=voltaV115RestartAnchor(side,p,'KICKOFF',side===sp.side?sp.kickerName:null,sp.spot,sp.side);s.board.playerPos[side][p.name]={...(s.board.playerPos[side][p.name]||{}),x:q.x,y:q.y,vx:0,vy:0,dirX:0,dirY:0}}}s.board.ball={x:50,y:50};s.board.ballTarget={x:50,y:50};try{voltaV115ApplyRestartShape(sp)}catch(e){}
 }
 const setPieceBase=voltaV115MakeSetPiece;
 voltaV115MakeSetPiece=function(type,side,kicker,spot,extra={}){const sp=setPieceBase(type,side,kicker,spot,extra);if(sp?.type==='KICKOFF')snapKickoff(sp);if(voltaMatchState?.pendingSub)tryPending();return sp};

 function slotOrderFor(pos){return pos==='FW'?['F2','F3','F1','F4']:pos==='MF'?['M2','M3','M1','M4']:pos==='DF'?['D2','D3','D1','D4']:['G1']}
 function initHtLayout(){const s=voltaMatchState;if(!s?.halftime?.active)return{};if(s.halftime.layout)return s.halftime.layout;const side=s.userSide||'home',players=s.teams[side].players,layout={};const used={FW:0,MF:0,DF:0,GK:0};for(const p of players){const pos=['GK','DF','MF','FW'].includes(p.position)?p.position:'MF',arr=slotOrderFor(pos),id=arr[Math.min(used[pos]++,arr.length-1)];if(id&&!layout[id])layout[id]=p.name;else{const free=VOLTA_SQUAD_SLOTS.map(x=>x.id).find(x=>!layout[x]);if(free)layout[free]=p.name}}s.halftime.layout=layout;return layout}
 function htDragStart(ev,name){const s=voltaMatchState;if(!s?.halftime?.active)return;s.halftime.dragName=name;try{ev.dataTransfer.setData('text/plain',name);ev.dataTransfer.effectAllowed='move'}catch(e){}}
 function htDragOver(ev){ev.preventDefault();ev.currentTarget?.classList.add('dragover')}
 function htDragLeave(ev){ev.currentTarget?.classList.remove('dragover')}
 function htDrop(ev,slotId){ev.preventDefault();ev.currentTarget?.classList.remove('dragover');const s=voltaMatchState;if(!s?.halftime?.active)return;const lay=initHtLayout(),name=s.halftime.dragName||(()=>{try{return ev.dataTransfer.getData('text/plain')}catch(e){return''}})();if(!name)return;const old=Object.keys(lay).find(k=>lay[k]===name),occupant=lay[slotId];if(old)delete lay[old];if(occupant&&old)lay[old]=occupant;else if(occupant&&!old){const free=VOLTA_SQUAD_SLOTS.map(x=>x.id).find(x=>!lay[x]&&x!==slotId);if(free)lay[free]=occupant;else return}lay[slotId]=name;s.halftime.dragName=null;render()}
 window.voltaV121HtDragStart=htDragStart;window.voltaV121HtDragOver=htDragOver;window.voltaV121HtDragLeave=htDragLeave;window.voltaV121HtDrop=htDrop;
 function htBoard(team){const lay=initHtLayout(),slotStyle={F1:[12,16],F2:[37,16],F3:[63,16],F4:[88,16],M1:[12,43],M2:[37,43],M3:[63,43],M4:[88,43],D1:[12,70],D2:[37,70],D3:[63,70],D4:[88,70],G1:[50,90]};return `<div class="v121-ht-pitch"><div class="v121-ht-midcircle"></div><span class="v121-ht-line-label fw">공격 · 4칸</span><span class="v121-ht-line-label mf">미드 · 4칸</span><span class="v121-ht-line-label df">수비 · 4칸</span><span class="v121-ht-line-label gk">GK</span>${VOLTA_SQUAD_SLOTS.map(sl=>{const xy=slotStyle[sl.id]||[sl.x,sl.y],name=lay[sl.id],p=team.players.find(x=>x.name===name);return `<div class="v121-ht-slot ${p?'filled':''}" style="left:${xy[0]}%;top:${xy[1]}%" ondragover="voltaV121HtDragOver(event)" ondragleave="voltaV121HtDragLeave(event)" ondrop="voltaV121HtDrop(event,'${sl.id}')" ${p?`draggable="true" ondragstart="voltaV121HtDragStart(event,'${esc(p.name)}')"`:''}><b>${p?esc(p.name):'+'}</b><span>${sl.line} · ${p?'❤️ '+Math.round(p.condition||0):sl.id}</span></div>`}).join('')}</div>`}
 function htSubHtml(team){const side=voltaMatchState.userSide||'home',bench=eligibleBench(side);if(!bench.length)return'<p class="v114-no-bench">재투입 가능한 후보 선수가 없습니다.</p>';return `<div class="v114-tac-sub"><select id="voltaHtSubOut">${team.players.map(p=>`<option value="${esc(p.name)}">OUT · ${esc(p.name)} · ❤️${Math.round(p.condition||0)}</option>`).join('')}</select><select id="voltaHtSubIn">${bench.map(p=>`<option value="${esc(p.name)}">IN · ${esc(p.name)} · ❤️${Math.round(p.condition||0)}</option>`).join('')}</select><button onclick="voltaV121HalftimeSub()">교체</button></div><div class="v121-ht-subnote">※ 한 번 교체 아웃된 선수는 이 경기에서 다시 투입할 수 없습니다.</div>`}
 window.voltaV121HalftimeSub=function(){const out=document.getElementById('voltaHtSubOut')?.value,inn=document.getElementById('voltaHtSubIn')?.value,s=voltaMatchState;if(!s||!out||!inn)return;applySub(s.userSide||'home',out,inn,'halftime')};
 function applyHtLayout(){const s=voltaMatchState;if(!s?.halftime?.active)return false;const side=s.userSide||'home',team=s.teams[side],lay=initHtLayout(),names=Object.values(lay).filter(Boolean);if(new Set(names).size!==team.players.length){alert('현재 출전 선수 전원을 전술판에 배치해 주세요.');return false}for(const p of team.players){const id=Object.keys(lay).find(k=>lay[k]===p.name);if(!id){alert(`${p.name} 선수가 전술판에 배치되지 않았습니다.`);return false}p.position=voltaSlotLine(id);p.tacticalSlot=id}return true}
 voltaApplyHalftimeTactics=function(redraw=true){const s=voltaMatchState;if(!s?.halftime?.active)return false;if(!applyHtLayout())return false;const side=s.userSide||'home',team=s.teams[side],t={mentality:document.getElementById('voltaHtMentality')?.value||team.tactics.mentality,pressing:document.getElementById('voltaHtPressing')?.value||team.tactics.pressing,passing:document.getElementById('voltaHtPassing')?.value||team.tactics.passing,focus:document.getElementById('voltaHtFocus')?.value||team.tactics.focus};team.tactics=t;voltaSave.tactics={...t};team.metrics=voltaTeamMetrics(team.players,t,voltaHeadCoach().name,voltaMoraleMult());s.aiStates={home:{},away:{}};try{voltaPersist()}catch(e){}voltaLog('🧠 하프타임 드래그 전술·포지션 지시가 적용되었습니다.','half');if(redraw)render();return true};
 voltaV113HalftimeHtml=function(){const s=voltaMatchState;if(!s?.halftime?.active)return'';const side=s.userSide||'home',team=s.teams[side],t=team.tactics||{},adv=voltaV113HalftimeAdvice(),homeP=voltaMatchPossessionPct('home'),awayP=voltaMatchPossessionPct('away');return `<div class="volta-halftime-overlay"><div class="volta-halftime-card v114-halftime"><div class="volta-halftime-kicker">HALF TIME · TACTICAL BREAK</div><h2>하프타임 전술 회의</h2><div class="volta-halftime-score">${esc(s.homeName)} <b>${s.score.home} : ${s.score.away}</b> ${esc(s.awayName)}</div><div class="volta-ht-stats"><div><span>점유율</span><b>${homeP}:${awayP}</b></div><div><span>슈팅</span><b>${s.stats.home.shots}:${s.stats.away.shots}</b></div><div><span>패스 성공</span><b>${voltaPassPct('home')}%:${voltaPassPct('away')}%</b></div><div><span>누적 파울</span><b>${s.fouls.home}:${s.fouls.away}</b></div></div><div class="volta-ht-advice"><b>수석코치 분석</b>${adv.map(x=>`<div>• ${x}</div>`).join('')}</div><div class="v121-ht-note">선수 카드를 직접 드래그해 공격 4칸 / 미드 4칸 / 수비 4칸 / GK 위치를 정하세요. 후반 킥오프 순간에는 이 배치 기준으로 즉시 자기 위치에 섭니다.</div><div class="v121-ht-layout">${htBoard(team)}<div class="v121-ht-side">${voltaV114TacticSelectors('voltaHt',t)}<h3>교체</h3>${htSubHtml(team)}</div></div><div class="v121-ht-actions"><button class="subtle" onclick="voltaApplyHalftimeTactics(true)">전술 저장</button><button onclick="voltaResumeSecondHalf()">후반전 시작 ▶</button></div></div></div>`};

 const tacticalSubOld=voltaV114TacticalSub;

 const redCheckBase=voltaV115CheckRedPenalty;
 voltaV115CheckRedPenalty=function(){const s=ensureSubState();if(!s)return;for(const side of ['home','away']){const pen=s.redPenalty?.[side];if(!pen||s.time<pen.until)continue;const team=s.teams[side],lock=lockedSet(side),bench=team.bench||[],idx=bench.findIndex(p=>(p.condition||0)>=20&&!lock.has(p.name)&&!p.sentOff);if(idx>=0&&team.players.length<VOLTA_V114.TEAM_SIZE){const p=bench.splice(idx,1)[0];p.position=pen.position==='GK'?'DF':pen.position;p.appeared=true;team.players.push(p);const b=voltaV113BasePoint(side,p,.1);s.board.playerPos[side][p.name]={x:b.x,y:b.y,vx:0,vy:0};voltaLog(`✅ 2분 퇴장 페널티 종료 — ${p.name} 투입, 다시 6명이 됩니다.`,'normal')}else voltaLog('⏱ 퇴장 페널티 2분이 지났지만 재투입 가능한 교체 선수가 없습니다.','normal');s.redPenalty[side]=null}}

  '첫 경기 전까지 더 열심히 하겠습니다.'
 ];

  '수준 이하라니… 그 정도로 저희가 마음에 안 드십니까?',
  '첫날부터 그런 말을 들으니 솔직히 기분은 좋지 않습니다.',

  '감독님 생각이 틀렸다는 걸 보여드리겠습니다.',

 ];
 function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
 voltaV118AnswerInterview=function(choice){
   if(!voltaSave?.foundingNews||voltaSave.foundingNews.answered)return;
   const teamDelta=choice===1?10:choice===3?-10:0,n=voltaSave.foundingNews;
   voltaSave.teamMorale=clamp((voltaSave.teamMorale==null?65:voltaSave.teamMorale)+teamDelta);
   n.answered=true;n.choice=choice;n.delta=teamDelta;n.stage='done';n.date=n.date||voltaSave.currentDate;
   const names=shuffle((voltaSave.roster||[]).map(p=>p.name)).slice(0,5);
   n.reactions=names.map((name,i)=>{
     let text='',delta=0;
     if(choice===1){text=V122_POSITIVE[i%V122_POSITIVE.length];delta=10}
     else if(choice===2){text=V122_NEUTRAL[i%V122_NEUTRAL.length];delta=0}
     else if(Math.random()<.48){text=V122_DETERMINED[i%V122_DETERMINED.length];delta=10}
     else{text=V122_HURT[i%V122_HURT.length];delta=-10}
     const st=rosterState(name);st.happiness=clamp((st.happiness??70)+delta);st.lastReaction=text;if(delta<0)st.complaint=text;
     return {name,text,delta};
   });
   voltaNotify('news','교내신문 인터뷰 완료',(choice===1?'선수단에 강한 신뢰를 보였습니다.':choice===2?'훈련으로 보완하겠다고 답했습니다.':'선수단 수준에 강한 불만을 드러냈습니다.')+` · 팀 사기 ${teamDelta>0?'+':''}${teamDelta}`,'info');
   voltaPersist();render();
 };

 /* 3-5. Onboarding, squad save, captain/vice captain reactions. */

 function squadSignature(){return squadEntries().sort((a,b)=>a[0].localeCompare(b[0])).map(([id,n])=>id+':'+n).join('|')}
 function validateSquad(show=true){
   const es=squadEntries(),names=new Set(es.map(x=>x[1]));
   if(es.length!==6||names.size!==6){if(show)alert('베스트 6은 정확히 6명을 모두 배치해야 저장할 수 있습니다.');return false}

   return true;
 }

 };
 function invalidateSquad(){if(!voltaSave)return;voltaSave.squadConfirmed=false}
 if(typeof voltaAssignSquadSlot==='function'){const b=voltaAssignSquadSlot;voltaAssignSquadSlot=function(){invalidateSquad();return b.apply(this,arguments)}}
 if(typeof voltaSquadDrop==='function'){const b=voltaSquadDrop;voltaSquadDrop=function(){invalidateSquad();return b.apply(this,arguments)}}
 const startMatchBase=voltaStartMatch;
 voltaStartMatch=function(){
   if(!validateSquad(true))return;
   if(!voltaSave.squadConfirmed||voltaSave.squadSignature!==squadSignature()){alert('스쿼드 탭에서 베스트 6을 저장한 뒤 경기를 시작해 주세요.');return}
   return startMatchBase.apply(this,arguments);
 };
 const createTeamBase=voltaCreateTeam;
 voltaCreateTeam=function(){
   const before=voltaSave;createTeamBase.apply(this,arguments);if(!voltaSave||voltaSave===before)return;
   voltaSave.version=122;voltaSave.captain=null;voltaSave.viceCaptain=null;voltaSave.squadConfirmed=false;voltaSave.squadSignature='';
   if(voltaSave.foundingNews&&!voltaSave.foundingNews.date)voltaSave.foundingNews.date=voltaSave.currentDate;
   voltaNotify('squad','베스트 6를 구성하십시오','스쿼드 탭으로 이동해 선발 6명을 배치하고, GK 1명을 포함한 뒤 「스쿼드 저장」을 눌러 주세요.','warn');
   voltaNotify('locker','주장단을 선임하십시오','라커룸에서 주장과 부주장을 직접 선임해 주세요. 선수에 따라 선임을 부담스러워할 수도 있습니다.','warn');
   voltaPersist();render();
 };
 function captainReaction(name,role){
   const st=rosterState(name),refuseChance=st.happiness<45?.32:st.happiness<60?.22:.13;
   if(Math.random()<refuseChance){const msg=role==='주장'?'주장의 무게가 아직은 너무 무겁습니다. 다른 선수를 부탁드리고 싶습니다.':'부주장 역할은 아직 자신이 없습니다. 조금 더 준비하고 싶습니다.';st.lastReaction=msg;st.happiness=clamp(st.happiness-3);voltaNotify('locker',`${name}, ${role} 선임 거절`,msg,'warn');return false}
   const lines=role==='주장'?['열심히 해보겠습니다. 팀을 잘 이끌겠습니다.','믿어주신 만큼 책임감을 갖고 뛰겠습니다.','선수들 앞에서 모범을 보이겠습니다.']:['주장을 잘 돕겠습니다.','팀 분위기를 위해 제가 할 수 있는 걸 하겠습니다.','맡겨주셔서 감사합니다. 열심히 해보겠습니다.'];
   const msg=lines[Math.floor(Math.random()*lines.length)];st.lastReaction=msg;st.happiness=clamp(st.happiness+3);voltaNotify('locker',`${name}, ${role} 선임 수락`,msg,'good');return true;
 }
 voltaSetCaptain=function(name){
   if(!voltaSave)return;if(!name){voltaSave.captain=null;voltaPersist();render();return}if(!voltaSave.roster.some(p=>p.name===name))return;
   if(!captainReaction(name,'주장')){voltaPersist();render();return}voltaSave.captain=name;if(voltaSave.viceCaptain===name)voltaSave.viceCaptain=null;voltaPersist();render();
 };
 voltaSetViceCaptain=function(name){
   if(!voltaSave)return;if(!name){voltaSave.viceCaptain=null;voltaPersist();render();return}if(!voltaSave.roster.some(p=>p.name===name)||voltaSave.captain===name)return;
   if(!captainReaction(name,'부주장')){voltaPersist();render();return}voltaSave.viceCaptain=name;voltaPersist();render();
 };

 /* 9. News collapses over time; newest first; bench-player manager meetings. */
 function maybePlayerMeeting(){
   if(!voltaSave?.roster?.length)return;
   const m=voltaSave.playerMeeting;
   if(m?.status==='pending')return;
   if(m?.status==='done'&&m.date===voltaSave.currentDate)return;
   if(m?.status==='done'&&m.date!==voltaSave.currentDate){voltaSave.playerMeetingHistory=voltaSave.playerMeetingHistory||[];voltaSave.playerMeetingHistory.unshift(m);voltaSave.playerMeeting=null}
   const start=voltaSave.foundingNews?.date||'2026-03-01',sinceStart=dateDays(start,voltaSave.currentDate),sinceLast=voltaSave.lastPlayerMeetingDate?dateDays(voltaSave.lastPlayerMeetingDate,voltaSave.currentDate):999;
   if(sinceStart<7||sinceLast<V122.MEETING_GAP_DAYS)return;
   const starters=new Set(Object.values(voltaSave.squadSlots||{}).filter(Boolean)),bench=(voltaSave.roster||[]).filter(p=>!starters.has(p.name));if(!bench.length)return;
   const force=!voltaSave.v122FirstMeetingTriggered&&sinceStart>=7;if(!force&&Math.random()>.09)return;
   const p=bench[Math.floor(Math.random()*bench.length)];voltaSave.v122FirstMeetingTriggered=true;voltaSave.lastPlayerMeetingDate=voltaSave.currentDate;voltaSave.playerMeeting={id:'pm'+Date.now(),date:voltaSave.currentDate,name:p.name,status:'pending',result:null};
   voltaNotify('news',`${p.name} 선수가 감독님 미팅을 원합니다.`,`${p.name}: “감독님, 저도 선발로 뛸 수 있습니다. 기회를 받고 싶습니다.”`,'warn');voltaPersist();
 }
 const dailyBase=voltaProcessDailySystems;
 voltaProcessDailySystems=function(){const r=dailyBase.apply(this,arguments);try{maybePlayerMeeting()}catch(e){console.error('[V122 MEETING]',e)}return r};
 window.voltaV122AnswerPlayerMeeting=function(choice){
   const m=voltaSave?.playerMeeting;if(!m||m.status!=='pending')return;const st=rosterState(m.name);let delta=0,text='';
   if(choice===1){delta=Math.random()<.8?10:5;text=delta>=10?'감사합니다, 감독님. 기회가 오면 꼭 보여드리겠습니다.':'말씀만이라도 감사합니다. 준비하고 있겠습니다.'}
   else if(choice===2){const r=Math.random();delta=r<.35?5:r<.8?0:-3;text=delta>0?'알겠습니다. 훈련에서 먼저 증명해보겠습니다.':delta<0?'결국 기다리라는 말씀이군요… 조금 아쉽습니다.':'알겠습니다. 계속 준비하겠습니다.'}
   else{if(Math.random()<.28){delta=6;text='부족하다는 말, 경기장에서 틀렸다는 걸 증명하겠습니다.'}else{delta=-10;text='제가 그렇게 부족합니까… 솔직히 많이 실망했습니다.'}}
   st.happiness=clamp((st.happiness??70)+delta);st.lastReaction=text;if(delta<0)st.complaint='출전 기회와 감독 평가에 불만이 있습니다.';m.status='done';m.choice=choice;m.delta=delta;m.result=text;
   voltaNotify('locker',`${m.name} 면담 결과`,`${text} · 만족도 ${delta>0?'+':''}${delta}`,(delta<0?'warn':delta>0?'good':'info'));voltaPersist();render();
 };

 }
 function paperHtml(n){const team=voltaSave.teamName,coach=voltaHeadCoach().name;return `<article class="v118-paper"><div class="v118-paper-head"><div class="v118-paper-logo">곡선일보</div><span>곡선중학교 교내신문 · ${esc(voltaDateLabelFull(n.date||'2026-03-01'))}</span></div><div class="v118-paper-body"><div class="kicker">스포츠 · 신생 동아리</div><h2>${esc(n.headline)}</h2><div class="lead">곡선중학교에 새로운 풋살동아리 ‘${esc(team)}’가 공식 창단했다. 지휘봉은 ${esc(coach)} 감독이 잡는다.</div><p>새 동아리는 교내 풋살 리그 참가를 준비하며 본격적인 활동을 시작한다. 창단 멤버들은 스쿼드 구성과 첫 훈련을 앞두고 있으며, 감독은 직접 전술과 선수단 운영을 맡을 예정이다.</p>${interviewBlock(n)}</div></article>`}

 if(typeof voltaV113MoveOne==='function'){
   const moveBase=voltaV113MoveOne;
   voltaV113MoveOne=function(side,p,pt,target,dt,speedEase){const ox=pt?.x,oy=pt?.y,r=moveBase.apply(this,arguments);if(p&&Number.isFinite(ox)&&Number.isFinite(oy)&&pt){const d=voltaV113DistM({x:ox,y:oy},pt);if(d<1.25)p._v122MoveM=(p._v122MoveM||0)+d*Math.max(1,Number(speedEase)||1)}return r};
