<body>
<div class="app" id="app"></div>
<script>
const chars=[
["siljeom","실점","박성진"],["3patourwan","쓰리빠뚜르완","정다운"],["molcho","몰초","김병욱"],
["joguk","조국","임도현"],["mundolmaeng","문돌맹","이동기"],["nguyen","Nguyen Ngoc Tu","이재빈"],
["dwaemesa","돼메사","조시원"],["galio","갈리오","김정운"],["dage","다케스탄 출신","황재윤"]
].map(x=>({id:x[0],nickname:x[1],name:x[2]}));
let mode="select", me=null, selected=[], party=[], chatMembers=[], replies=0, privateIndex=0, privateTargets=[], searching=false, queueSeconds=0, queueTimer=null, found=false, champOptions=[], teamPicks=[], chosenChamp=null, finalPool=[], enemyTeam=[], loadingSeconds=10, loadingTimer=null, loadingTransitionTimer=null, battleState=null, battleTimer=null, matchResult=null;

const app=document.getElementById("app");
const shuffle=a=>[...a].sort(()=>Math.random()-.5);
function header(step){return `<header class="top"><div><div class="eyebrow">AUGMENT ARENA</div><h1>증강체 칼바람 매니저</h1></div><div class="step">${step}</div></header>`}
function button(text,disabled=false,onclick=""){return `<button class="primary" ${disabled?"disabled":""} onclick="${onclick}">${text}</button>`}
function render(){
let body="";
if(mode==="select"){
 body=`<div class="section"><span>01</span><div><h2>캐릭터를 선택하세요</h2><p>선택한 캐릭터가 이번 게임의 당신입니다.</p></div></div>
 <div class="grid">${chars.map((c,i)=>`<button class="card ${me?.id===c.id?"sel":""}" onclick="choose('${c.id}')"><span class="num">0${i+1}</span><span class="nick">${c.nickname}</span><span class="real">${c.name}</span><span class="check">${me?.id===c.id?"✓":""}</span></button>`).join("")}</div>
 ${button(me?me.nickname+"으로 계속하기 →":"캐릭터를 먼저 선택하세요",!me,"goMethod()")}`;
}
if(mode==="method"){
body=`<div class="section"><span>02</span><div><h2>어떻게 호출할까요?</h2><p><b>${me.nickname}</b> · ${me.name}으로 플레이합니다.</p></div></div>
<div class="calls"><button class="call" onclick="startGroup()"><div class="n">01</div><div class="ico">↗</div><h3>단톡으로 호출하기</h3><p>게임 안의 단톡방에 “겜 ㄱ?”을 보내고<br>친구들이 한 명씩 대답합니다.</p></button>
<button class="call" onclick="mode='manual';render()"><div class="n">02</div><div class="ico">＋</div><h3>개인톡으로 호출하기</h3><p>같이 할 사람 4명을 직접 선택하고<br>개인톡으로 차례차례 호출합니다.</p></button></div>
<button class="back" onclick="mode='select';render()">← 캐릭터 다시 선택</button>`;
}
if(mode==="group"){
body=`<div class="phonewrap"><div class="phone"><div class="head"><button onclick="mode='method';render()">‹</button><div><strong>우리들의 단톡방</strong><small>9명</small></div><em>•••</em></div><div class="chat"><div class="date">오늘</div>
<div class="msg mine"><div class="who">${me.name}</div><div class="bubble">겜 ㄱ?</div></div>
${chatMembers.slice(0,replies).map((c,i)=>`<div class="msg"><div class="who">${c.name}</div><div class="bubble">${i===3?"ㄱㄱ":"ㄱ"}</div></div>`).join("")}
${replies<4?`<div class="typing"><i></i><i></i><i></i></div>`:`<div class="system">5명이 게임에 참가했습니다.</div>`}</div><div class="input"><span>메시지를 입력하세요</span><b>＋</b><b>➤</b></div></div>
${button(replies<4?"친구들이 대답하는 중...":"파티 확인 →",replies<4,"finishGroup()")}</div>`;
}
if(mode==="manual"){
body=`<div class="section"><span>03</span><div><h2>파티원을 선택하세요</h2><p>본인을 제외하고 <b>4명</b>을 선택하세요.</p></div><div class="counter">${selected.length} / 4</div></div>
<div class="members">${chars.filter(c=>c.id!==me.id).map(c=>`<button class="member ${selected.includes(c.id)?"sel":""}" onclick="toggle('${c.id}')"><span class="box">${selected.includes(c.id)?"✓":""}</span><span><b>${c.nickname}</b><small>${c.name}</small></span></button>`).join("")}</div>
${button("개인톡 보내기 →",selected.length!==4,"startPrivate()")}<button class="back" onclick="mode='method';render()">← 호출 방식</button>`;
}
if(mode==="private"){
const target=privateTargets[privateIndex];
body=`<div class="phonewrap"><div class="phone"><div class="head"><button>‹</button><div><strong>${target.nickname}</strong><small>${target.name}</small></div><em>•••</em></div><div class="chat"><div class="date">오늘</div>
<div class="msg mine"><div class="who">${me.name}</div><div class="bubble">겜 ㄱ?</div></div>
${privateIndex>0?`<div class="msg"><div class="who">${target.nickname}</div><div class="bubble">ㄱ</div></div>`:`<div class="typing"><i></i><i></i><i></i></div>`}
${privateIndex===3?`<div class="system">4명 모두에게서 답장이 왔습니다.</div>`:""}</div><div class="input"><span>메시지를 입력하세요</span><b>＋</b><b>➤</b></div></div>
${button(privateIndex===3?"파티 확인 →":privateIndex===0?"답장 기다리는 중...":"다음 친구 호출 →",privateIndex===0,"nextPrivate()")}</div>`;
}
if(mode==="champSelect"){
body=`<div class="champ-screen"><div class="champ-top"><div class="champ-timer">12</div><div class="title"><small>무작위 총력전 · 아수라장</small><strong>챔피언 선택</strong></div><div style="width:90px;text-align:right;color:#75878c;font-size:9px">내 차례</div></div>
<div class="unused-select-row">${champions.filter(c=>!champOptions.some(o=>o.id===c.id)).slice(0,10).map(c=>`<div class="unused-select-mini">${c.icon}</div>`).join("")}</div>
<div class="champ-body"><div class="team-side"><div class="side-title">우리 팀</div>${party.map((c,i)=>`<div class="player-row ${i===0?"you":""}"><div class="avatar">${teamPicks[i]?teamPicks[i].icon:"?"}</div><div><strong>${c.nickname}</strong><small>${teamPicks[i]?teamPicks[i].name:"선택 중..."}</small></div>${i===0?"<em>YOU</em>":""}</div>`).join("")}</div>
<div class="center-select"><div class="sub">YOUR TURN</div><h2>챔피언을 선택하세요</h2><p>무작위로 제시된 3명의 챔피언 중 하나를 선택합니다.</p><div class="champ-options">${champOptions.map(c=>`<button class="champ-card" onclick="pickChampion('${c.id}')"><div class="champ-art">${c.icon}</div><div class="cc-bottom"><strong>${c.name}</strong><small>${c.title}</small></div></button>`).join("")}</div></div>
<div class="enemy-side"><div class="side-title">상대 팀</div>${[1,2,3,4,5].map(i=>`<div class="player-row"><div class="avatar">?</div><div><strong>상대 ${i}</strong><small>선택 중...</small></div></div>`).join("")}</div></div></div>`;
}
if(mode==="finalChamp"){
const tip=`<div class="chat-line tip"><strong>[TIP]</strong> 팀원들의 챔피언을 바꿀 수 있습니다. 사람마다 맞는 챔피언과 챔피언의 유형이 있으므로 잘 선택하시기 바랍니다</div>`;
const special=[];
if(party.some(c=>c.id==="molcho")) special.push(`<div class="chat-line"><span class="chat-tag">[전체]</span><strong>몰초:</strong> 캐리해줄게</div>`);
if(party.some(c=>c.id==="dwaemesa")) special.push(`<div class="chat-line"><span class="chat-tag">[전체]</span><strong>돼메사:</strong> 원딜 ㅈㅂㅈㅂㅈㅂㅈㅂ</div>`);

function acceptMatch(){
  found=false; searching=false; queueSeconds=0;
  const pool=shuffle(champions);
  champOptions=pool.slice(0,3);
  teamPicks=[null,null,null,null,null];
  chosenChamp=null; finalPool=[]; enemyTeam=[]; mode="champSelect"; render();
}
function pickChampion(id){
  const chosen=champOptions.find(c=>c.id===id);
  if(!chosen)return;
  chosenChamp=chosen; teamPicks[0]=chosen;
  const remaining=shuffle(champions.filter(c=>c.id!==chosen.id));
  for(let i=1;i<5;i++) teamPicks[i]=remaining[i-1];
  finalPool=remaining.slice(4,14);
  mode="finalChamp"; render();
}
function startGame(){
  if(!chosenChamp)return;
  clearInterval(loadingTimer); clearTimeout(loadingTransitionTimer); clearInterval(battleTimer);
  const protectedIds=new Set(teamPicks.map(c=>c.id).concat(finalPool.map(c=>c.id)));
  const enemyPool=shuffle(champions.filter(c=>!protectedIds.has(c.id)));
  const enemyNames=shuffle(["원종나기","똥카게","회주잖아","발전병","Inkubus","Eternal Alomi","축구고트메시","한국기","돼지궁뎅이","아벌"]).slice(0,5);
  enemyTeam=enemyNames.map((nick,i)=>({nick,champ:enemyPool[i]}));
  // 로딩 카운트다운과 실제 화면 전환 타이머를 분리한다.
  // 기존에는 마지막 interval 콜백 안에서 startBattle()까지 처리해 일부 브라우저/Pages 환경에서
  // 1초 화면이 남는 경우가 있었다. 전환은 독립 setTimeout으로 보장한다.
  loadingSeconds=10; mode="loading"; render();
  clearInterval(loadingTimer); clearTimeout(loadingTransitionTimer);
  const loadingStartedAt=Date.now();
  loadingTimer=setInterval(()=>{
    const elapsed=Math.floor((Date.now()-loadingStartedAt)/1000);
    loadingSeconds=Math.max(0,10-elapsed);
    if(mode!=="loading"){clearInterval(loadingTimer);return;}
    // 전체 로딩 DOM을 재생성하지 않는다. 이미지가 매번 다시 로드되며 깜빡이는 현상 방지.
    const count=document.querySelector('.loading-count');
    if(count) count.textContent=String(loadingSeconds);
    const bar=document.querySelector('.loading-bar > div');
    if(bar) bar.style.width=(((10-loadingSeconds)/10)*100)+'%';
  },250);
  loadingTransitionTimer=setTimeout(()=>{
    clearInterval(loadingTimer); loadingTimer=null; loadingSeconds=0;
    if(mode==="loading") startBattle();
  },10000);
}

function setBattleSpeed(v){if(battleState){battleState.speed=v;render()}}
function living(arr){return arr.filter(u=>u.alive)}
function nearestEnemy(u){const es=battleState.units.filter(e=>e.alive&&e.team!==u.team);return es.reduce((best,e)=>!best||Math.hypot(e.x-u.x,e.y-u.y)<Math.hypot(best.x-u.x,best.y-u.y)?e:best,null)}
function nearestStructure(u){const ss=battleState.structures.filter(s=>s.alive&&s.team!==u.team);return ss.reduce((best,e)=>!best||Math.abs(e.x-u.x)<Math.abs(best.x-u.x)?e:best,null)}
function addFx(x,y,text,team){const bs=battleState;bs.fx.push({id:++bs.fxSeq,x,y,text,team,ttl:.65})}
function moveOrganic(u,target,dt){
 const dx=target.x-u.x, dy=target.y-u.y, dist=Math.max(.001,Math.hypot(dx,dy));
 const desiredX=dx/dist, desiredY=dy/dist;
 const sway=Math.sin(bsTime()*1.7+u.phase)*.18;
 u.x+=desiredX*u.speed*dt; u.y+=desiredY*u.speed*dt + sway*dt;
 // soft lane bounds and light separation so units don't march in a single file
 const same=battleState.units.filter(v=>v.alive&&v!==u&&v.team===u.team&&Math.abs(v.x-u.x)<2.8&&Math.abs(v.y-u.y)<5).slice(0,3);
 for(const v of same){const sy=u.y-v.y; if(Math.abs(sy)<2.4)u.y+=(sy>=0?1:-1)*.55*dt}
 u.y=Math.max(34,Math.min(66,u.y));
}
function bsTime(){return battleState?battleState.time:0}
function respawnSeconds(u){return Math.max(1,(u.level||1)*2+4)}
function killLog(attacker,target){
 const bs=battleState, at=attacker.team==='team'?'blue-name':'red-name', tt=target.team==='team'?'blue-name':'red-name';
 if(attacker.kind==='champ'){
   if(attacker.team==='team')bs.teamKills++; else if(attacker.team==='enemy')bs.enemyKills++;
   attacker.kills=(attacker.kills||0)+1; attacker.gold+=300;
 }
 target.deaths=(target.deaths||0)+1;
 const allies=bs.units.filter(u=>u.kind==='champ'&&u.team===attacker.team&&u!==attacker&&u.alive&&Math.hypot(u.x-target.x,u.y-target.y)<14); allies.forEach(u=>u.assists=(u.assists||0)+1);
 bs.log.push(`[${formatBattleTime(bs.time)}] <span class="${at}">${attacker.nick||attacker.name||'포탑'}</span> → <span class="${tt}">${target.nick}</span> 처치`);
}
function dealDamage(attacker,target,dmg){if(!target.alive)return;if(attacker.kind==='champ')attacker.damageDealt=(attacker.damageDealt||0)+dmg*12;if(target.kind==='champ')target.damageTaken=(target.damageTaken||0)+dmg*12;target.hp-=dmg;if(target.hp<=0){target.hp=0;target.alive=false;if(target.kind==='champ'){target.respawn=respawnSeconds(target);addFx(target.x,target.y,'KO',attacker.team);killLog(attacker,target)}}else if(Math.random()<.035&&attacker.kind==='champ'){addFx(target.x,target.y,`-${Math.max(1,Math.round(dmg*12))}`,attacker.team)}}
function damageStructure(st,dmg,attacker){
 const tempo=battleState.time>15*60?2.4:battleState.time>10*60?1.55:1;
 st.hp-=dmg*tempo;
 if(st.hp<=0){st.hp=0;st.alive=false;if(st.type==='inhib'){if(st.team==='team')battleState.superEnemy=true;else battleState.superTeam=true}}
}
function waveIntervalAt(t){
 if(t>=25*60)return 15;
 if(t>=15*60)return 20;
 return 25;
}
function spawnWave(){
 const bs=battleState;bs.waveCount++;
 const cannon=(bs.waveCount%2===1); // 첫 웨이브부터 한 웨이브 건너 대포
 for(let i=0;i<6;i++){
   bs.units.push(createMinion('team',(cannon||bs.superTeam)&&i===0));
   bs.units.push(createMinion('enemy',(cannon||bs.superEnemy)&&i===0));
 }

}
function updateRelics(dt){const bs=battleState;for(const r of bs.relics){if(r.cooldown>0){r.cooldown-=dt;continue}const nearby=bs.units.filter(u=>u.alive&&Math.abs(u.x-r.x)<2.4&&u.kind==='champ');if(nearby.length){const u=nearby.sort((a,b)=>a.hp/b.maxHp-b.hp/b.maxHp)[0];if(u.hp<u.maxHp*.92){u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.08);r.cooldown=35}}}}
function updateStructures(dt){const bs=battleState;for(const st of bs.structures){if(!st.alive||st.type==='inhib'||st.type==='nexus')continue;const attackers=bs.units.filter(u=>u.alive&&u.team!==st.team&&Math.abs(u.x-st.x)<6);if(!attackers.length)continue;
 // 롤처럼 포탑은 사거리 안의 적 미니언을 우선 공격하고, 미니언이 없을 때만 챔피언을 공격한다.
 const minions=attackers.filter(u=>u.kind==='minion');
 const target=minions[0]||attackers.find(u=>u.kind==='champ');
 if(!target)continue;
 dealDamage({kind:'structure',nick:st.name,team:st.team},target,(target.kind==='minion'?13:6.2)*dt);
 }}
function updateUnits(dt){const bs=battleState;const all=bs.units;for(const u of all){
 if(!u.alive){if(u.kind==='champ'&&u.respawn>0){u.respawn-=dt;if(u.respawn<=0){u.alive=true;u.hp=u.maxHp*.72;u.x=u.team==='team'?8:92;u.y=50+u.laneBias;u.gold=Math.max(u.gold,1400);u.phase=Math.random()*6.28}}continue}
 u.gold+=6*dt;u.xp+=12*dt;u.level=Math.min(18,3+Math.floor(u.xp/100));u.attackCd=Math.max(0,(u.attackCd||0)-dt);
 const enemyChamps=bs.units.filter(e=>e.alive&&e.kind==='champ'&&e.team!==u.team);
 const enemyMinions=bs.units.filter(e=>e.alive&&e.kind==='minion'&&e.team!==u.team);
 const targetChamp=enemyChamps.reduce((best,e)=>!best||Math.hypot(e.x-u.x,e.y-u.y)<Math.hypot(best.x-u.x,best.y-u.y)?e:best,null);
 const champDist=targetChamp?Math.hypot(targetChamp.x-u.x,targetChamp.y-u.y):999;
 const st=nearestStructure(u);
 const alliedMinions=bs.units.filter(m=>m.alive&&m.kind==='minion'&&m.team===u.team&&(!st||Math.abs(m.x-st.x)<8));
 if(u.kind==='champ'){
   // 교전 빈도를 낮춘다: 가까워도 항상 싸우지 않고, 팀 라인 간격을 유지하며 전진/후퇴한다.
   const engage=targetChamp && champDist<9.2 && (u.hp/u.maxHp>.32) && (Math.sin(bs.time*.22+u.phase)>.05);
   if(engage){
     if(champDist<=u.range && u.attackCd<=0){dealDamage(u,targetChamp,u.atk*(.48+Math.random()*.28));u.attackCd=2.25+Math.random()*1.15;}
     else moveOrganic(u,{x:targetChamp.x,y:targetChamp.y+u.laneBias*.32},dt*.72);
   }else if(st){
     const enemyTower=st.type==='tower';
     // 적 포탑 앞에 아군 미니언이 없으면 챔피언은 뒤로 빠진다.
     if(enemyTower && Math.abs(u.x-st.x)<9 && alliedMinions.length===0){
       const retreatX=u.team==='team'?st.x-11:st.x+11;
       moveOrganic(u,{x:retreatX,y:50+u.laneBias},dt*.85);
     }else{
       const targetX=st.x+(u.team==='team'?-4.2:4.2);
       const targetY=50+u.laneBias;
       if(Math.abs(u.x-targetX)<3.5 && alliedMinions.length>0 && u.attackCd<=0){damageStructure(st,u.atk*.38,u);u.attackCd=1.45+Math.random()*.5}
       else moveOrganic(u,{x:targetX,y:targetY},dt*.62);
     }
   }
 }else{
   // 미니언은 화면에 렌더링하지 않지만 실제 엔진에서는 계속 전진/교전/포탑 공격한다.
   const mt=enemyMinions.reduce((best,e)=>!best||Math.abs(e.x-u.x)<Math.abs(best.x-u.x)?e:best,null);
   const md=mt?Math.hypot(mt.x-u.x,mt.y-u.y):999;
   if(mt&&md<=u.range&&u.attackCd<=0){dealDamage(u,mt,u.atk);u.attackCd=1.15}
   else if(st&&Math.abs(u.x-st.x)<3.4){if(u.attackCd<=0){damageStructure(st,u.atk*.24,u);u.attackCd=1.2}}
   else if(st)moveOrganic(u,{x:st.x+(u.team==='team'?-1.6:1.6),y:50+u.laneBias*.2},dt);
 }
 // 챔피언은 서로 겹치지 않도록 더 넓은 횡간격을 유지한다.
 if(u.kind==='champ'){
   for(const v of bs.units){if(v===u||!v.alive||v.kind!=='champ'||v.team!==u.team)continue;const dx=u.x-v.x,dy=u.y-v.y,d=Math.hypot(dx,dy);if(d<4.4&&d>.01){u.x+=dx/d*.38*dt;u.y+=dy/d*.9*dt}}
 }
 u.y=Math.max(30,Math.min(70,u.y));
}}
function applyOvercharge(){const bs=battleState;if(bs.time>=40*60){for(const st of bs.structures.filter(s=>s.alive&&s.type==='tower')){st.hp-=1.2;if(st.hp<=0){st.hp=0;st.alive=false}}}}
function checkEnd(){const bs=battleState;const tn=bs.structures.find(s=>s.id==='tn1'),en=bs.structures.find(s=>s.id==='en1');if(!tn.alive||!en.alive){const winner=!en.alive?'team':'enemy';bs.status=winner==='team'?'우리 팀 승리':'적 팀 승리';matchResult={winner,time:bs.time,teamKills:bs.teamKills,enemyKills:bs.enemyKills,team:bs.team.map(u=>({...u})),enemy:bs.enemy.map(u=>({...u}))};mode='battleEnd';render();return true}return false}
function battleFrame(ts){if(mode!=='battle'||!battleState)return;
 const bs=battleState;let raw=Math.min(.05,(ts-bs.lastTs)/1000);bs.lastTs=ts;let dt=Math.min(.8,raw*bs.speed);bs.time+=dt;
 while(bs.time>=bs.nextWaveAt){spawnWave();bs.nextWaveAt+=waveIntervalAt(bs.nextWaveAt)}
 updateUnits(dt);updateStructures(dt);updateRelics(dt);applyOvercharge();
 // 화면에 보이지 않는 사망 미니언은 즉시 정리해 메모리/연산량을 억제
 if(bs.units.length>70)bs.units=bs.units.filter(u=>u.kind==='champ'||u.alive);
 for(const f of bs.fx)f.ttl-=dt;bs.fx=bs.fx.filter(f=>f.ttl>0);
 if(checkEnd()){render();return}
 // DOM 갱신은 20fps로 제한하고 엔진 물리는 RAF로 계속 계산
 if(ts-bs.lastUiSync>=66){bs.lastUiSync=ts;syncBattleDom()}
 window.__battleRAF=requestAnimationFrame(battleFrame)
}
function screenPos(x,y){
 const centerY=78-x*.56; // blue bottom-left -> red top-right
 const lateral=((y||50)-50)*.58;
 return {left:Math.max(3,Math.min(97,x)),top:Math.max(8,Math.min(91,centerY+lateral))};
}
function syncStaticBattlePositions(){
 if(!battleState)return;
 for(const st of battleState.structures){const el=document.querySelector(`[data-structure="${st.id}"]`);if(el){const p=screenPos(st.x,st.y||50);el.style.left=p.left+'%';el.style.top=p.top+'%'}}
 const rs=[...document.querySelectorAll('.b2-relic')];battleState.relics.forEach((r,i)=>{if(rs[i]){const p=screenPos(r.x,50);rs[i].style.left=p.left+'%';rs[i].style.top=p.top+'%'}})
}
function syncBattleDom(){const bs=battleState;const clock=document.querySelector('.b2-clock');if(clock)clock.textContent=formatBattleTime(bs.time);const right=document.querySelector('.b2-right');if(right)right.innerHTML=`<span>${bs.status}</span>`;
 for(const u of bs.team.concat(bs.enemy)){const el=document.querySelector(`[data-unit="${u.id}"]`);if(!el)continue;const p=screenPos(u.x,u.y);el.style.left=p.left+'%';el.style.top=p.top+'%';el.classList.toggle('dead',!u.alive);const hp=el.querySelector('.t-hp em');if(hp)hp.style.width=Math.max(0,u.hp/u.maxHp*100)+'%'}
 for(const st of bs.structures){const el=document.querySelector(`[data-structure="${st.id}"]`);if(el){el.classList.toggle('dead',!st.alive);const n=el.querySelector('.sname');if(n)n.textContent=`${st.name} · ${Math.max(0,Math.round(st.hp))}%`}}
 for(const r of bs.relics){const els=[...document.querySelectorAll('.b2-relic')];const idx=bs.relics.indexOf(r);if(els[idx])els[idx].classList.toggle('cool',r.cooldown>0)}
 if(bs.log.length>120)bs.log.splice(0,bs.log.length-120);const log=document.querySelector('.b2-log');if(log){const atBottom=log.scrollTop+log.clientHeight>=log.scrollHeight-8;log.innerHTML=bs.log.slice(-6).map(x=>`<div>${x}</div>`).join('');if(atBottom)log.scrollTop=log.scrollHeight}
 const fxWrap=document.querySelector('.b2-stage');if(fxWrap){document.querySelectorAll('[data-fx]').forEach(el=>el.remove());for(const f of bs.fx){const d=document.createElement('div');d.className='b2-fx '+(f.team==='enemy'?'red':'blue');d.dataset.fx=f.id;const p=screenPos(f.x,f.y);d.style.left=p.left+'%';d.style.top=p.top+'%';d.textContent=f.text;fxWrap.appendChild(d)}}}
function choose(id){me=chars.find(c=>c.id===id);render()}
function goMethod(){mode="method";render()}
function startGroup(){party=[me,...shuffle(chars.filter(c=>c.id!==me.id)).slice(0,4)];chatMembers=shuffle(party.slice(1));replies=0;mode="group";render();tickGroup()}
function tickGroup(){if(replies>=4)return;setTimeout(()=>{replies++;render();tickGroup()},900)}
function finishGroup(){mode="party";render()}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):selected.length<4?[...selected,id]:selected;render()}
function startPrivate(){party=[me,...chars.filter(c=>selected.includes(c.id))];privateTargets=party.slice(1);privateIndex=0;mode="private";render();setTimeout(()=>{privateIndex=1;render()},1100)}
function nextPrivate(){if(privateIndex<3){privateIndex++;render()}else{mode="party";render()}}
let dragSource=null;
function dragStart(e,type,index){dragSource={type,index}; if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",`${type}:${index}`)}}
function allowDrop(e){e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect="move"}
function dragEnter(e){e.preventDefault();e.currentTarget.classList.add("drag-over")}
function dragLeave(e){e.currentTarget.classList.remove("drag-over")}
function dragEnd(e){document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));dragSource=null}
function dropSwap(e,targetType,targetIndex){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove("drag-over");
  if(!dragSource)return;
  const a=dragSource;
  if(a.type===targetType && a.index===targetIndex){dragSource=null;return;}
  if(a.type==="team" && targetType==="team"){
    const t=teamPicks[a.index];teamPicks[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="pool"){
    const t=finalPool[a.index];finalPool[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="team" && targetType==="pool"){
    const t=teamPicks[a.index];teamPicks[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="team"){
    const t=finalPool[a.index];finalPool[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }
  chosenChamp=teamPicks[0];
  dragSource=null;render();
}
function openResults(){mode='results';render()}
function playAgain(){battleState=null;matchResult=null;teamPicks=[];chosenChamp=null;finalPool=[];enemyTeam=[];goQueue()}
function reselectTeam(){battleState=null;matchResult=null;selected=[];party=[];mode='method';render()}
function reset(){clearInterval(queueTimer);clearInterval(loadingTimer);clearTimeout(loadingTransitionTimer);clearInterval(battleTimer);cancelAnimationFrame(window.__battleRAF);dragSource=null;mode="select";me=null;selected=[];party=[];chatMembers=[];replies=0;privateIndex=0;searching=false;queueSeconds=0;found=false;champOptions=[];teamPicks=[];chosenChamp=null;finalPool=[];render()}
render();
</script>
