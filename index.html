function spawnWave(){const bs=battleState;for(let i=0;i<5;i++){bs.units.push(createMinion('team',bs.superTeam&&i===0));bs.units.push(createMinion('enemy',bs.superEnemy&&i===0));}bs.log.push(`${Math.floor(bs.time)}초 · 미니언 웨이브가 생성되었습니다.`)}
function updateRelics(dt){const bs=battleState;for(const r of bs.relics){if(r.cooldown>0){r.cooldown-=dt;continue}const nearby=bs.units.filter(u=>u.alive&&Math.abs(u.x-r.x)<2.2);if(nearby.length){const u=nearby.sort((a,b)=>a.hp/b.maxHp-b.hp/b.maxHp)[0];if(u.hp<u.maxHp*.9){u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.08);r.cooldown=45;bs.log.push(`${u.nick||'미니언'}이(가) 유물을 차지해 8% 회복했습니다.`);setTimeout(()=>{},0);}}}}
function updateStructures(dt){const bs=battleState;for(const st of bs.structures){if(!st.alive)continue;const attackers=bs.units.filter(u=>u.alive&&u.team!==st.team&&Math.abs(u.x-st.x)<6);if(!attackers.length)continue;const target=attackers.find(u=>u.kind==='champ')||attackers[0];target.hp-=14*dt;if(target.hp<=0){target.hp=0;target.alive=false;target.respawn=10;bs.log.push(`${st.name}이(가) ${target.nick||'미니언'}을(를) 처치했습니다.`)}}}
function updateUnits(dt){const bs=battleState;const all=[...bs.team,...bs.enemy];for(const u of all){if(!u.alive){if(u.kind==='champ'&&u.respawn>0){u.respawn-=dt;if(u.respawn<=0){u.alive=true;u.hp=u.maxHp*.55;u.x=u.team==='team'?9:91;u.y=50;u.atBase=true;bs.log.push(`${u.nick}이(가) 부활했습니다.`)} }continue}
  u.gold+=6*dt;u.xp+=12*dt;u.level=Math.min(18,3+Math.floor(u.xp/100));u.atBase=(u.team==='team'?u.x<9:u.x>91);
  const target=nearestEnemy(u);if(target){const dist=Math.abs(target.x-u.x);if(dist<=u.range){target.hp-=u.atk*dt;if(target.hp<=0){target.hp=0;target.alive=false;if(target.kind==='champ'){target.respawn=12;bs.log.push(`${u.nick}이(가) ${target.nick}을(를) 쓰러뜨렸습니다.`)}}}else moveToward(u,target,dt)}else{const st=nearestStructure(u);if(st){const dist=Math.abs(st.x-u.x);if(dist<4){damageStructure(st,u.atk*dt)}else moveToward(u,st,dt)}}
 }
}
function applyOvercharge(){const bs=battleState;if(bs.time>=35*60&&bs.time<35*60+.5)bs.log.push('35:00 · 모든 포탑에 과충전 약화가 적용됩니다.');if(bs.time>=40*60){for(const st of bs.structures.filter(s=>s.alive&&s.type==='tower')){st.hp-=1.2;if(st.hp<=0){st.hp=0;st.alive=false}}}}
function checkEnd(){const bs=battleState;const tn=bs.structures.find(s=>s.id==='tn1'),en=bs.structures.find(s=>s.id==='en1');if(!tn.alive||!en.alive){bs.status=!en.alive?'우리 팀 승리':'적 팀 승리';return true}return false}
function battleFrame(ts){if(mode!=='battle'||!battleState)return;const bs=battleState;let dt=Math.min(.05,(ts-bs.lastTs)/1000)*bs.speed;bs.lastTs=ts;bs.time+=dt;bs.spawnClock+=dt;
 if(bs.spawnClock>=30){bs.spawnClock-=30;spawnWave();render();bs.lastTs=ts;return} updateUnits(dt);updateStructures(dt);updateRelics(dt);applyOvercharge();
 if(Math.floor(bs.time)%10===0 && Math.floor(bs.time)!==bs.lastLogTime){bs.lastLogTime=Math.floor(bs.time);bs.log.push(`${formatBattleTime(bs.time)} · 전투 진행 · 모든 챔피언 자동 경험치 + 골드`)}
 if(checkEnd()){render();return} syncBattleDom(); window.__battleRAF=requestAnimationFrame(battleFrame)}
function syncBattleDom(){const bs=battleState;const clock=document.querySelector('.b2-clock');if(clock)clock.textContent=formatBattleTime(bs.time);const status=document.querySelector('.b2-right');if(status)status.innerHTML=`${bs.status}<br><span>3레벨 · 시작 골드 1,400 · 초당 +6G · 자동 경험치</span>`;for(const u of bs.units){const el=document.querySelector(`[data-unit="${u.id}"]`);if(!el)continue;el.style.left=Math.max(1,Math.min(99,u.x))+'%';el.style.top=(u.y||50)+'%';el.classList.toggle('dead',!u.alive);const hp=el.querySelector('.t-hp em');if(hp)hp.style.width=Math.max(0,u.hp/u.maxHp*100)+'%'}for(const st of bs.structures){const el=[...document.querySelectorAll('.b2-structure')].find(x=>x.style.left===st.x+'%');if(el){el.classList.toggle('dead',!st.alive);const n=el.querySelector('.sname');if(n)n.textContent=`${st.name} · ${Math.max(0,Math.round(st.hp))}%`}}for(const r of bs.relics){const el=[...document.querySelectorAll('.b2-relic')].find(x=>x.style.left===r.x+'%');if(el)el.classList.toggle('cool',r.cooldown>0)}}
function choose(id){me=chars.find(c=>c.id===id);render()}
function goMethod(){mode="method";render()}
function startGroup(){party=[me,...shuffle(chars.filter(c=>c.id!==me.id)).slice(0,4)];chatMembers=shuffle(party.slice(1));replies=0;mode="group";render();tickGroup()}
function tickGroup(){if(replies>=4)return;setTimeout(()=>{replies++;render();tickGroup()},900)}
function finishGroup(){mode="party";render()}
function toggle(id){selected=selected.includes(id)?selected.filter(x=>x!==id):selected.length<4?[...selected,id]:selected;render()}
function startPrivate(){party=[me,...chars.filter(c=>selected.includes(c.id))];privateTargets=party.slice(1);privateIndex=0;mode="private";render();setTimeout(()=>{privateIndex=1;render()},1100)}
function nextPrivate(){if(privateIndex<3){privateIndex++;render()}else{mode="party";render()}}
let dragSource=null;
function dragStart(e,type,index){dragSource={type,index}; if(e.dataTransfer){e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",`${type}:${index}`)}}
function allowDrop(e){e.preventDefault(); if(e.dataTransfer)e.dataTransfer.dropEffect="move"}
function dragEnter(e){e.preventDefault();e.currentTarget.classList.add("drag-over")}
function dragLeave(e){e.currentTarget.classList.remove("drag-over")}
function dragEnd(e){document.querySelectorAll(".drag-over").forEach(el=>el.classList.remove("drag-over"));dragSource=null}
function dropSwap(e,targetType,targetIndex){e.preventDefault();e.stopPropagation();e.currentTarget.classList.remove("drag-over");
  if(!dragSource)return;
  const a=dragSource;
  if(a.type===targetType && a.index===targetIndex){dragSource=null;return;}
  if(a.type==="team" && targetType==="team"){
    const t=teamPicks[a.index];teamPicks[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="pool"){
    const t=finalPool[a.index];finalPool[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="team" && targetType==="pool"){
    const t=teamPicks[a.index];teamPicks[a.index]=finalPool[targetIndex];finalPool[targetIndex]=t;
  }else if(a.type==="pool" && targetType==="team"){
    const t=finalPool[a.index];finalPool[a.index]=teamPicks[targetIndex];teamPicks[targetIndex]=t;
  }
  chosenChamp=teamPicks[0];
  dragSource=null;render();
}
function reset(){clearInterval(queueTimer);clearInterval(loadingTimer);clearInterval(battleTimer);cancelAnimationFrame(window.__battleRAF);dragSource=null;mode="select";me=null;selected=[];party=[];chatMembers=[];replies=0;privateIndex=0;searching=false;queueSeconds=0;found=false;champOptions=[];teamPicks=[];chosenChamp=null;finalPool=[];render()}
render();
</script>
