function syncLiveBattleHud(){
  const bs=battleState;
  if(mode!=='battle'||!bs)return;

  // 상단 킬 수 + 전투 현황.
  // 이 함수들은 전역 스코프에 있어야 하며, UI 동기화 오류가 전투 엔진을 멈추지 않게 분리한다.
  try{syncBattleScoreboard();}catch(err){console.error('[battle-ui-score]',err);}

  // LIVE MATCH LOG
  const log=document.querySelector('.b2-log');
  if(log){
    const version=bs.logVersion||0;
    if(Number(log.dataset.version||-1)!==version){
      log.innerHTML=(bs.log||[]).slice(-40).map(x=>`<div>${x}</div>`).join('');
      log.dataset.version=String(version);
      log.scrollTop=log.scrollHeight;
    }
  }

  // 전체 채팅
  const chat=document.querySelector('.match-all-chat-body');
  if(chat){
    const count=(bs.chat||[]).length;
    if(Number(chat.dataset.count||-1)!==count){
      chat.innerHTML=(bs.chat||[]).slice(-30).map(x=>`<div>${x}</div>`).join('');
      chat.dataset.count=String(count);
      chat.scrollTop=chat.scrollHeight;
    }
  }

  const clock=document.querySelector('.b2-clock');
  if(clock)clock.textContent=formatBattleTime(bs.time||0);
}

function scheduleBattleFrame(){
  if(mode!=="battle"||!battleState||battleRafPending)return;
  battleRafPending=true;
  window.__battleRAF=requestAnimationFrame((ts)=>{battleRafPending=false;battleFrame(ts)});
}
function armBattleWatchdog(){
  clearInterval(battleWatchdogTimer);
  battleWatchdogTimer=setInterval(()=>{
    const bs=battleState;if(mode!=="battle"||!bs||!bs.engineStarted)return;
    const now=performance.now();
    if(bs.paused){

      try{cancelAnimationFrame(window.__battleRAF)}catch(e){}

    }
  },700);
}

// 챔피언별 템트리가 필요해지면 이 맵에 id별 6개 빌드만 덮어쓰면 된다.
const CHAMPION_ITEM_BUILDS={};

function itemArchetype(champ){
 const roles=champ?.roles||[];
 const profile=champDamageProfile(champ);
 if(roles.includes('Marksman'))return 'marksman';
 if(roles.includes('Assassin')&&profile==='ad')return 'assassin';
 // AP 암살자는 보주 + 마법사 전설템
 if(roles.includes('Assassin')&&profile==='ap')return 'mage';
 // 순수 서포터는 서폿, 마법사 겸 서폿은 마법사 우선
 if(roles.includes('Mage'))return 'mage';
 if(roles.includes('Support')&&!roles.includes('Tank'))return 'support';
 if(roles.includes('Tank')&&!roles.includes('Fighter'))return 'tank';
 if(roles.includes('Fighter'))return 'fighter';
 if(roles.includes('Tank'))return 'tank';
 if(roles.includes('Support'))return 'support';
 return 'fighter';
}
function recommendedItemBuild(champ){
 const own=CHAMPION_ITEM_BUILDS[champ?.id];
 return (own&&own.length?own:ROLE_ITEM_BUILDS[itemArchetype(champ)]||ROLE_ITEM_BUILDS.fighter).slice(0,6);
}
function initUnitItems(u){
 if(!u||u.kind!=='champ')return;
 const archetype=itemArchetype(u.champ);
 const start={...START_ITEMS[archetype]};
 u.itemArchetype=archetype;
 u.inventory=[start];
 u.itemBuild=recommendedItemBuild(u.champ);
 u.itemBuildIndex=0;
 // 시작 골드 1400G에서 시작 아이템 950G 자동 구매
 u.gold=Math.max(0,(u.gold||0)-start.cost);
}
function autoBuyItems(u){
 if(!u||u.kind!=='champ'||!Array.isArray(u.inventory))return;
 const build=u.itemBuild||[];
 if(u.itemBuildIndex>=build.length)return;
 const name=build[u.itemBuildIndex];
 const item=LEGENDARY_ITEMS[name];
 if(!item){u.itemBuildIndex++;return;}

 if(u.inventory.length<6){
   if(u.gold>=item.cost){
     u.gold-=item.cost;
     u.inventory.push({...item,kind:'legendary'});
     u.itemBuildIndex++;
   }
   return;
 }

 // 수호자 시작템 + 전설 5개 상태에서 마지막 6번째 전설템을 살 수 있으면 시작템 자동 판매.
 const startIndex=u.inventory.findIndex(x=>x?.kind==='start');
 if(startIndex>=0){
   const start=u.inventory[startIndex];
   if(u.gold+(start.sell||0)>=item.cost){
     u.gold+=(start.sell||0);
     u.inventory.splice(startIndex,1);
     u.gold-=item.cost;
     u.inventory.push({...item,kind:'legendary'});
     u.itemBuildIndex++;
   }
 }
}
function itemPerformanceMultiplier(u){
 if(!u||u.kind!=='champ'||!Array.isArray(u.inventory))return 1;
 const legendary=u.inventory.filter(x=>x?.kind==='legendary').length;
 const hasStart=u.inventory.some(x=>x?.kind==='start');
 // 시간 자체가 아니라 실제 구매 완료된 아이템 수에 따라 전투력이 성장한다.
 const perLegendary=(u.itemArchetype==='tank'||u.itemArchetype==='support')?.045:.055;
 return (hasStart?1.03:1)*(1+legendary*perLegendary);
}

function scoreboardPairHtml(a,e){

     <span class="score-kda" data-score-kda="${e.id}">${e.kills||0}/${e.deaths||0}/${e.assists||0}</span>
     ${scoreItemsHtml(e,true)}
   </div>
 </div>`;
}
function battleScoreboardHtml(bs){
 const rows=[0,1,2,3,4].map(i=>scoreboardPairHtml(bs.team[i],bs.enemy[i])).join('');
 return `<div class="battle-scoreboard" id="battleScoreboard"><div class="battle-scoreboard-head"><span>전투 현황</span><button class="score-close" onclick="toggleBattleScoreboard(false)">×</button></div><div class="scoreboard-body">${rows}</div></div><button class="mobile-score-toggle" onclick="toggleBattleScoreboard()">현황</button>`;
}
function toggleBattleScoreboard(force){
 const p=document.getElementById('battleScoreboard');if(!p)return;
 const open=typeof force==='boolean'?force:!p.classList.contains('open');
 p.classList.toggle('open',open);
}
function syncBattleScoreboard(){
 const bs=battleState;if(!bs)return;

 // 상단 팀 킬 스코어는 별도 render 없이도 즉시 갱신한다.
 const teamKillsEl=document.querySelector('[data-team-kills]');
 const enemyKillsEl=document.querySelector('[data-enemy-kills]');
 if(teamKillsEl)teamKillsEl.textContent=String(bs.teamKills||0);
 if(enemyKillsEl)enemyKillsEl.textContent=String(bs.enemyKills||0);

 // 전투 현황 K/D/A + CS를 battleState의 실제 값으로 매번 다시 덮어쓴다.
 for(const u of bs.team.concat(bs.enemy)){
   document.querySelectorAll(`[data-score-kda="${u.id}"]`).forEach(k=>{
     k.textContent=`${u.kills||0}/${u.deaths||0}/${u.assists||0}`;
   });
   document.querySelectorAll(`[data-score-cs="${u.id}"]`).forEach(cs=>{
     cs.textContent=String(u.cs||0);
   });
 }

 // 아이템 슬롯은 골드에 따라 실시간 갱신한다.
 const pairs=document.querySelectorAll('.score-pair');
 pairs.forEach((pair,i)=>{
   const units=[bs.team[i],bs.enemy[i]];
   pair.querySelectorAll('.score-items').forEach((wrap,j)=>{
     const u=units[j];if(!u)return;
     const cnt=battleItemCount(u);
     wrap.querySelectorAll('.score-item').forEach((el,n)=>{
       const item=u?.inventory?.[n];
       el.classList.toggle('filled',n<cnt);
       el.title=item?`${item.name} · ${Number(item.cost||0).toLocaleString()}G`:'';
       if(item){
         el.innerHTML=`<img src="${battleItemImagePath(item)}" alt="${item.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'"><span class="score-item-fallback" style="display:none">${battleItemSymbol(u,n)}</span>`;
       }else{
         el.innerHTML='';
       }
     });
   });
 });
}

 const gk=pos.find(p=>p.position==='GK')||pos.reduce((a,b)=>b.stats.keeper>a.stats.keeper?b:a,pos[0]);
 const eff=(p,v)=>v*voltaConditionMult(p)*moraleMult;
 const avg=(arr,fn)=>arr.reduce((s,x)=>s+fn(x),0)/Math.max(1,arr.length);
 let attack=avg(field,p=>eff(p,p.stats.shooting*.35+p.stats.speed*.20+p.stats.passing*.15+p.hidden.dribbling*.15+p.hidden.finishing*.15));
 let defense=avg(field,p=>eff(p,p.stats.physical*.30+p.stats.speed*.20+p.hidden.judgement*.20+p.hidden.workrate*.15+p.hidden.concentration*.15));
 let build=avg(field,p=>eff(p,p.stats.passing*.45+p.hidden.judgement*.25+p.stats.speed*.15+p.stats.physical*.15));
 let keeper=eff(gk,gk.stats.keeper*.70+gk.hidden.concentration*.20+gk.hidden.judgement*.10);
 let organization=avg(pos,p=>eff(p,p.hidden.judgement*.35+p.hidden.workrate*.30+p.hidden.concentration*.35));
 const tm=voltaTacticMods(tactics||{mentality:'balanced',pressing:'normal',passing:'balanced',focus:'center'});
 const cm=VOLTA_HEAD_COACH_STYLES[coachName]||VOLTA_COACH_STYLES[coachName]||VOLTA_HEAD_COACH_STYLES['임도현'];
 attack*=tm.attack*cm.attack;defense*=tm.defense*cm.defense;build*=tm.build*cm.build;organization*=cm.press;
 return {attack,defense,build,keeper,organization,press:tm.press*cm.press,risk:tm.risk,positions:pos};
}

  [{home:teamName,away:o[0]},{home:o[1],away:o[2]}],
  [{home:teamName,away:o[1]},{home:o[2],away:o[0]}],
  [{home:teamName,away:o[2]},{home:o[0],away:o[1]}],
  [{home:o[0],away:teamName},{home:o[2],away:o[1]}],

  [{home:o[2],away:teamName},{home:o[1],away:o[0]}]

function voltaEnsureLeagueSeason(){

function voltaRecordTableResult(home,away,hg,ag){

 const H=t[home],A=t[away];H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;

function voltaOpponentStrength(teamName){
 const team=voltaLeague().teams.find(t=>t.name===teamName);
 if(!team)return 55;
 const ps=voltaOpponentPlayers(team,voltaLeague().grade);
 return ps.reduce((s,p)=>s+(p.stats.shooting+p.stats.speed+p.stats.passing+p.stats.physical+p.stats.keeper*.35)/4.35,0)/Math.max(1,ps.length);
}
function voltaSimulateAIMatch(home,away){
 const hs=voltaOpponentStrength(home),as=voltaOpponentStrength(away);

   let x=.7+(forS-againstS)/28+Math.random()*1.5;
   if(Math.random()<.22)x+=1;
   return voltaClamp(Math.floor(x),0,6);
 };
 return [goals(hs,as),goals(as,hs)];
}
function voltaFinalizeLeagueRound(playerHome,playerAway,hg,ag){

   const [a,b]=voltaSimulateAIMatch(f.home,f.away);
   voltaRecordTableResult(f.home,f.away,a,b);
   season.history.push({week:voltaSave.week,home:f.home,away:f.away,hg:a,ag:b});
 }
 season.history.push({week:voltaSave.week,home:playerHome,away:playerAway,hg,ag});

function voltaFatigueTick(side,dt){

 for(const p of team.players){
   const phys=voltaClamp(p.stats.physical,30,99);
   const role=p.position==='GK'?.38:p.position==='DF'?.82:p.position==='FW'?1.04:1;
   const enduranceMult=1-((phys-30)/69)*.45;
   const drain=(dt/1200)*12.5*press*role*enduranceMult;
   p.condition=voltaClamp((p.condition||70)-drain,0,100);

function voltaPitchPlayerCoords(side,players){

 const mirror=x=>side==='home'?x:100-x,used={GK:0,DF:0,MF:0,FW:0};
 return players.map((p,i)=>{
   const pos=VOLTA_POSITIONS.includes(p.position)?p.position:'MF';
   const arr=slots[pos]||slots.MF,k=used[pos]++,xy=arr[Math.min(k,arr.length-1)];
   let x=mirror(xy[0]),y=xy[1];
   const push=voltaMatchState?.board?.possession===side?(side==='home'?5:-5):0;
   x=voltaClamp(x+push,4,96);

 });
}

function voltaMoveBall(side,stage='build'){

 const base=side==='home'?(stage==='shot'?78:stage==='chance'?66:50):(stage==='shot'?22:stage==='chance'?34:50);

function voltaAttackSequence(side){

 const passer=voltaPickWeighted(atk.players.filter(p=>p.position!=='GK'),p=>p.stats.passing+p.hidden.judgement);

 voltaMatchStat(side,'passes');
 if(passScore<55){voltaLog(`${passer.name}의 패스가 끊깁니다.`,'turnover');s.momentum[side]=voltaClamp(s.momentum[side]-2,-100,100);voltaMoveBall(other,'build');return}
 voltaMatchStat(side,'passesCompleted');voltaMoveBall(side,'chance');
 const useDribble=Math.random()<.38;let chance=atk.metrics.attack*.52+atk.metrics.build*.20+atk.metrics.organization*.12+s.momentum[side]*.08+(Math.random()*24-12);

   if(duel>0){chance+=8;voltaLog(`${dribbler.name}이(가) ${defender.name}을(를) 제치고 전진합니다!`,'attack')}
   else{voltaLog(`${defender.name}이(가) ${dribbler.name}의 돌파를 막아냅니다.`,'turnover');voltaMoveBall(other,'build');return}
 }

function voltaMonthCalendarHtml(year,month){
 const first=new Date(year,month-1,1),days=new Date(year,month,0).getDate(),start=first.getDay();
 const current=voltaSave?.currentDate||`${year}-01-01`;
 const matchMap={};
 for(const r of voltaSave?.season?.schedule||[])matchMap[r.date]=r;
 const cells=[];
 for(let i=0;i<start;i++)cells.push('<div class="cal-day blank"></div>');
 for(let day=1;day<=days;day++){
   const key=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
   const past=voltaDateCmp(key,current)<0,currentDay=key===current,round=matchMap[key];
   const myFixture=round?.fixtures?.find(f=>f.home===voltaSave.teamName||f.away===voltaSave.teamName);
   const opp=myFixture?(myFixture.home===voltaSave.teamName?myFixture.away:myFixture.home):'';
   const wed=new Date(key+'T12:00:00').getDay()===3;
   cells.push(`<div class="cal-day ${past?'past':''} ${currentDay?'today':''} ${round?'match':''} ${wed?'training-day':''}"><b>${day}</b>${round?`<span>⚽ ${opp}</span>`:wed?`<span>🏋 주간 훈련</span>`:''}</div>`);
 }
 return `<section class="volta-month"><h3>${month}월</h3><div class="cal-week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="cal-grid">${cells.join('')}</div></section>`;
}


let voltaAdvanceBusy=false,voltaTrainingBusy=false;
const VOLTA_TRAIN_XP=[25,35,45,60,75];

function voltaIsWednesday(key=voltaSave?.currentDate){
 const d=new Date((key||'2026-01-01')+'T12:00:00');return d.getDay()===3;
}
function voltaTrainingAvailableToday(){
 return !!voltaSave&&voltaIsWednesday()&&voltaSave.lastTrainingDate!==voltaSave.currentDate;
}
function voltaTrainingXpNeed(stat){
 stat=Number(stat)||1;
 return stat<=50?80:stat<=65?110:stat<=75?150:stat<=85?210:stat<=90?300:stat<=95?420:600;
}
function voltaNextWednesday(afterKey){
 const d=new Date((afterKey||voltaSave.currentDate)+'T12:00:00');
 do{d.setDate(d.getDate()+1)}while(d.getDay()!==3);
 return voltaDateKey(d);
}
function voltaNextStopDate(){
 const cur=voltaSave.currentDate,c=[];
 const w=voltaNextWednesday(cur);if(w)c.push(w);
 const match=voltaNextMatchDate();if(match&&voltaDateCmp(match,cur)>0)c.push(match);
 for(const b of Object.values(voltaSave.facilityBuilds||{}))if(b?.finishDate&&voltaDateCmp(b.finishDate,cur)>0)c.push(b.finishDate);
 return c.sort()[0]||null;
}

function voltaAdvanceToNextEvent(){
 if(voltaAdvanceBusy)return;
 const target=voltaNextStopDate();
 if(!target){alert('진행할 다음 일정이 없습니다.');return}
 voltaAdvanceBusy=true;voltaShowAdvanceOverlay();
 const a=new Date(voltaSave.currentDate+'T12:00:00'),b=new Date(target+'T12:00:00');
 const total=Math.max(1,Math.round((b-a)/86400000));let done=0;
 const timer=setInterval(()=>{
   if(voltaDateCmp(voltaSave.currentDate,target)>=0){
     clearInterval(timer);voltaAdvanceBusy=false;voltaPersist();
     document.getElementById('voltaAdvanceOverlay')?.remove();render();return;
   }
   voltaAdvanceDays(1);done++;
   const dateEl=document.getElementById('voltaAdvanceDate'),bar=document.getElementById('voltaAdvanceBar');
   if(dateEl)dateEl.textContent=voltaDateLabelFull(voltaSave.currentDate);
   if(bar)bar.style.width=`${Math.min(100,done/total*100)}%`;
 },120);
}

function voltaApplyTrainingXp(key,index){
 const xpGain=VOLTA_TRAIN_XP[index]||25,results=[];
 for(const p of voltaSave.roster){
   p.trainingXP=p.trainingXP||{physical:0,shooting:0,speed:0,passing:0,keeper:0};
   p.condition=voltaClamp((Number(p.condition)||0)-15,0,100);
   p.trainingXP[key]=(Number(p.trainingXP[key])||0)+xpGain;
   let ups=0,guard=0;
   while(p.stats[key]<99&&p.trainingXP[key]>=voltaTrainingXpNeed(p.stats[key])&&guard++<5){
     const need=voltaTrainingXpNeed(p.stats[key]);
     p.trainingXP[key]-=need;p.stats[key]++;ups++;
   }
   p.hidden=voltaDerivedStats(p);
   results.push({name:p.name,ups,xp:p.trainingXP[key],need:voltaTrainingXpNeed(p.stats[key]),stat:p.stats[key]});
 }
 return results;
}
function voltaTrainSquad(key,index){
 voltaEnsureRosterProfiles();
 if(!voltaTrainingAvailableToday()){alert('팀 훈련은 매주 수요일에 한 번만 진행할 수 있습니다.');return}
 if(voltaTrainingBusy)return;
 const tr=VOLTA_TRAINING[key]?.[index];if(!tr)return;
 if(!voltaTrainingUnlocked(key,index)){alert('현재 피지컬 코치 등급으로는 이 훈련 단계가 아직 해금되지 않았습니다.');return}
 const exhausted=voltaSave.roster.filter(p=>(Number(p.condition)||0)<20);
 if(exhausted.length){alert(`체력이 부족한 선수가 있습니다: ${exhausted.map(p=>p.name).join(', ')}\n휴식 후 다시 훈련해 주세요.`);return}
 voltaTrainingBusy=true;
 const label=(VOLTA_TRAINING_LABELS[key]||key).replace(/^.. /,'');
 document.body.insertAdjacentHTML('beforeend',`<div id="voltaTrainingOverlay" class="volta-training-overlay"><div class="training-run"><small>WEDNESDAY TEAM TRAINING</small><h2>${label} 훈련 중입니다...</h2><p>${tr.name} · 선수단 전원</p><div class="training-progress"><i id="voltaTrainingProgress"></i></div><b id="voltaTrainingPct">0%</b></div></div>`);
 let pct=0;
 const timer=setInterval(()=>{
   pct=Math.min(100,pct+4+Math.random()*5);
   const bar=document.getElementById('voltaTrainingProgress'),txt=document.getElementById('voltaTrainingPct');
   if(bar)bar.style.width=`${pct}%`;if(txt)txt.textContent=`${Math.floor(pct)}%`;
   if(pct>=100){
     clearInterval(timer);
     const results=voltaApplyTrainingXp(key,index),raised=results.filter(x=>x.ups>0);
     const panel=document.querySelector('#voltaTrainingOverlay .training-run');
     if(panel)panel.innerHTML=`<small>TRAINING COMPLETE</small><h2>${label} 훈련 완료</h2><p>${raised.length?raised.map(x=>`${x.name} ${label} +${x.ups}`).join(' · '):'훈련 경험치가 누적되었습니다.'}</p><div class="training-result-list">${results.map(x=>`<div><b>${x.name}</b><span>${label} ${x.stat}</span><i><u style="width:${Math.min(100,x.xp/x.need*100)}%"></u></i><em>${Math.round(x.xp)} / ${x.need} XP</em></div>`).join('')}</div>`;
     voltaSave.lastTrainingDate=voltaSave.currentDate;
     voltaNotify('training','주간 훈련 완료',`${label} 훈련을 완료했습니다.${raised.length?' 능력치가 상승한 선수가 있습니다.':' 경험치가 누적되었습니다.'}`,'good');
     voltaPersist();
     setTimeout(()=>{
       document.getElementById('voltaTrainingOverlay')?.remove();voltaTrainingBusy=false;
       voltaAdvanceDays(1);voltaPersist();mode='volta-club';render();
     },1100);
   }
 },70);
}

function voltaMakeLeagueScheduleV102(teamName,opponents,year){
 const o=opponents.map(x=>x.name);if(o.length<3)return[];
 const dates=[];
 let d=new Date(year,2,28); // 3월 28일 토요일
 for(let i=0;i<7;i++){dates.push(new Date(d));d.setDate(d.getDate()+14)}
 d=new Date(year,8,5); // 9월 5일 토요일, 후반기
 for(let i=0;i<8;i++){dates.push(new Date(d));d.setDate(d.getDate()+14)}
 const rounds=[];
 for(let i=0;i<15;i++){
   const oppIndex=i%3,opp=o[oppIndex],rest=o.filter((_,j)=>j!==oppIndex);
   const homeUs=Math.floor(i/3)%2===0;
   const userFixture=homeUs?{home:teamName,away:opp}:{home:opp,away:teamName};
   const aiFixture=i%2===0?{home:rest[0],away:rest[1]}:{home:rest[1],away:rest[0]};
   rounds.push({date:voltaDateKey(dates[i]),fixtures:[userFixture,aiFixture]});
 }
 return rounds;
}
function voltaEnsureLeagueSeasonV102(){
 if(!voltaSave)return;const league=voltaLeague(),key=`v110:${voltaSave.seasonYear}:${league.grade}:${league.name}`;
 if(voltaSave.season&&Array.isArray(voltaSave.season.schedule)&&voltaSave.season.table&&String(voltaSave.season.key||'').includes(`:${voltaSave.seasonYear}:${league.grade}:${league.name}`)){
   const fresh=voltaMakeLeagueScheduleV102(voltaSave.teamName,league.teams,voltaSave.seasonYear);
   voltaSave.season.schedule=fresh;
   voltaSave.season.round=Math.min(voltaSave.season.round||0,fresh.length);
   voltaSave.season.completed=voltaSave.season.round>=fresh.length;
   voltaSave.season.key=key;
   return;
 }
 const names=[voltaSave.teamName,...league.teams.map(t=>t.name)],table={};names.forEach(n=>table[n]={name:n,p:0,w:0,d:0,l:0,gf:0,ga:0,pts:0});
 const playerStats={};
 for(const p of voltaSave.roster)playerStats[p.name]={name:p.name,team:voltaSave.teamName,goals:0,assists:0,apps:0};
 for(const tm of league.teams)for(const n of tm.players)playerStats[n]={name:n,team:tm.name,goals:0,assists:0,apps:0};
 voltaSave.season={key,round:0,schedule:voltaMakeLeagueScheduleV102(voltaSave.teamName,league.teams,voltaSave.seasonYear),table,history:[],playerStats,completed:false,championRewarded:false};voltaSave.week=1;
}
function voltaEnsureLeagueSeason(){voltaEnsureLeagueSeasonV102()}
function voltaCurrentRound(){voltaEnsureLeagueSeasonV102();return voltaSave.season.schedule[voltaSave.season.round]||null}
function voltaCurrentFixture(){const r=voltaCurrentRound();if(!r)return null;return r.fixtures.find(f=>f.home===voltaSave.teamName||f.away===voltaSave.teamName)||null}
function voltaNextOpponent(){const f=voltaCurrentFixture();if(!f)return null;const n=f.home===voltaSave.teamName?f.away:f.home;return voltaLeague().teams.find(t=>t.name===n)||null}
function voltaNextMatchDate(){return voltaCurrentRound()?.date||null}
function voltaLeagueTableRows(){voltaEnsureLeagueSeasonV102();return Object.values(voltaSave.season.table).sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.name.localeCompare(b.name))}
function voltaAddPlayerSeasonStat(name,team,key,amount=1){voltaEnsureLeagueSeasonV102();const ps=voltaSave.season.playerStats||(voltaSave.season.playerStats={});if(!ps[name])ps[name]={name,team,goals:0,assists:0,apps:0};ps[name][key]=(ps[name][key]||0)+amount}
function voltaPlayerLeaders(key,limit=5){voltaEnsureLeagueSeasonV102();return Object.values(voltaSave.season.playerStats||{}).sort((a,b)=>(b[key]||0)-(a[key]||0)||a.name.localeCompare(b.name)).slice(0,limit)}
function voltaRecordTableResult(home,away,hg,ag){const t=voltaSave.season.table;if(!t[home]||!t[away])return;const H=t[home],A=t[away];H.p++;A.p++;H.gf+=hg;H.ga+=ag;A.gf+=ag;A.ga+=hg;if(hg>ag){H.w++;A.l++;H.pts+=3}else if(hg<ag){A.w++;H.l++;A.pts+=3}else{H.d++;A.d++;H.pts++;A.pts++}}
function voltaDistributeAIGoals(teamName,count){const team=voltaLeague().teams.find(t=>t.name===teamName);if(!team)return;for(let i=0;i<count;i++){const scorer=team.players[Math.floor(Math.random()*team.players.length)];voltaAddPlayerSeasonStat(scorer,teamName,'goals');if(Math.random()<.72){let assist=team.players[Math.floor(Math.random()*team.players.length)];if(assist===scorer)assist=team.players.find(x=>x!==scorer)||assist;voltaAddPlayerSeasonStat(assist,teamName,'assists')}}team.players.forEach(n=>voltaAddPlayerSeasonStat(n,teamName,'apps'))}
function voltaFinalizeLeagueRound(playerHome,playerAway,hg,ag){
 const season=voltaSave.season,round=voltaCurrentRound();if(!round)return;voltaRecordTableResult(playerHome,playerAway,hg,ag);
 for(const f of round.fixtures){if((f.home===playerHome&&f.away===playerAway)||(f.home===playerAway&&f.away===playerHome))continue;const [a,b]=voltaSimulateAIMatch(f.home,f.away);voltaRecordTableResult(f.home,f.away,a,b);voltaDistributeAIGoals(f.home,a);voltaDistributeAIGoals(f.away,b);season.history.push({date:round.date,home:f.home,away:f.away,hg:a,ag:b})}
 season.history.push({date:round.date,home:playerHome,away:playerAway,hg,ag});season.round++;voltaSave.week=season.round+1;season.completed=season.round>=season.schedule.length;
 if(season.completed&&!season.championRewarded){const top=voltaLeagueTableRows()[0];if(top?.name===voltaSave.teamName){const sp=voltaCurrentSponsor();voltaSave.money+=50+(sp?.titleBonus||0);voltaSave.championships=voltaSave.championships||[];voltaSave.championships.push(voltaLeague().name);if(sp)voltaNotify('sponsor','리그 우승 수당',`${sp.name} 우승 수당 +${sp.titleBonus}원`,'good')}season.championRewarded=true}
}

function voltaEvaluatePlayerReactions(force=false){
 voltaEnsureV102Save();
 const starters=new Set(Object.values(voltaSave.squadSlots||{}).filter(Boolean));
 for(const p of voltaSave.roster){
   const st=voltaPlayerState(p.name);
   let complaint='',delta=0;
   if((p.condition||0)<28){complaint='체력이 너무 떨어져 휴식을 원하고 있습니다.';delta=-4}
   else if(!starters.has(p.name)&&Math.random()<(force?.55:.12)){complaint='최근 출전 기회가 부족하다고 느끼고 있습니다.';delta=-3}
   else if((voltaSave.teamMorale||65)<40&&Math.random()<(force?.45:.10)){complaint='팀 분위기가 좋지 않아 걱정하고 있습니다.';delta=-2}
   else if(force||Math.random()<.16){complaint='';delta=1}
   st.happiness=voltaClamp((Number(st.happiness)||70)+delta,0,100);
   if(complaint&&complaint!==st.complaint){
     st.complaint=complaint;st.lastReaction=complaint;
     voltaNotify('locker',`${p.name}의 불만`,complaint,'warn');
   }else if(!complaint&&st.complaint&&force){

 // stadium / pitch frame

 ctx.beginPath();ctx.moveTo(W/2,30);ctx.lineTo(W/2,H-30);ctx.stroke();
 ctx.beginPath();ctx.arc(W/2,H/2,58,0,Math.PI*2);ctx.stroke();

 ctx.fillStyle=lg;ctx.fillRect(0,0,W,H);

 // players
 const drawSide=(side,fill,gkFill)=>{
   const team=s.teams[side];
   team.players.forEach((p,i)=>{
     const pt=s.board.playerPos?.[side]?.[p.name];if(!pt)return;
     const q=voltaCanvasPos(cv,pt.x,pt.y),r=p.position==='GK'?19:18;

     // FM/K리그 매니저식 이동 방향 화살표: 바둑알이 향하는 방향을 즉시 읽을 수 있게 한다.
     const dirX=Number(pt.dirX)||0,dirY=Number(pt.dirY)||0;

       const sx=q.x+dirX*(r+2),sy=q.y+dirY*(r+2),tipX=q.x+dirX*(r+18),tipY=q.y+dirY*(r+18);
       const px=-dirY,py=dirX;
       ctx.save();ctx.strokeStyle='rgba(242,247,249,.64)';ctx.fillStyle='rgba(242,247,249,.9)';ctx.lineWidth=1.5;
       ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(tipX,tipY);ctx.stroke();
       ctx.beginPath();ctx.moveTo(tipX,tipY);ctx.lineTo(tipX-dirX*6+px*3.5,tipY-dirY*6+py*3.5);ctx.lineTo(tipX-dirX*6-px*3.5,tipY-dirY*6-py*3.5);ctx.closePath();ctx.fill();ctx.restore();
     }

   });
 };
 drawSide('home','#2788dd','#d7aa2c');drawSide('away','#da4c57','#865ad1');

 // ball trail + ball

 ctx.fillStyle='#f7f7f3';ctx.beginPath();ctx.arc(bp.x,bp.y,6,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#20262a';ctx.lineWidth=2;ctx.stroke();ctx.restore();

 // 공의 다음 이동 경로를 하이라이트 순간에 짧은 가이드 라인으로 표시.

   const bt=voltaCanvasPos(cv,s.board.ballTarget.x,s.board.ballTarget.y);
   ctx.save();ctx.setLineDash([6,6]);ctx.strokeStyle='rgba(88,190,255,.68)';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.moveTo(bp.x,bp.y);ctx.lineTo(bt.x,bt.y);ctx.stroke();ctx.setLineDash([]);ctx.restore();
   const side=s.board.possession||'home',players=s.teams[side]?.players||[];let receiver=null,dist=1e9;
   for(const p of players){const pp=s.board.playerPos?.[side]?.[p.name];if(!pp)continue;const d=Math.hypot(pp.x-s.board.ballTarget.x,pp.y-s.board.ballTarget.y);if(d<dist){dist=d;receiver={p,pp}}}
   if(receiver){const rp=voltaCanvasPos(cv,receiver.pp.x,receiver.pp.y);ctx.save();ctx.strokeStyle='rgba(255,214,64,.76)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(rp.x,rp.y,19,0,Math.PI*2);ctx.stroke();ctx.restore()}
 }

 // event emphasis, visual only — engine result is unchanged.

     ctx.fillStyle=`rgba(227,179,65,${.08+.12*life})`;ctx.fillRect(42,30,W-84,H-60);

   }
 }

   ctx.fillStyle='rgba(3,8,11,.28)';ctx.fillRect(0,0,W,H);
 }
}

function voltaLockerMoodLabel(){const morale=Number(voltaSave?.teamMorale)||0;if(morale>=85)return '끈끈함';if(morale>=70)return '화기애애함';if(morale>=50)return '미지근함';if(morale>=30)return '어색함';return '불화'}

function goQueue(){mode="queue";searching=false;queueSeconds=0;render()}
function startQueue(){
  if(searching)return;
  searching=true;found=false;queueSeconds=0;render();
  clearInterval(queueTimer);
  queueTimer=setInterval(()=>{
    queueSeconds++;
    if(queueSeconds>=3){searching=false;found=true;clearInterval(queueTimer);}
    render();
  },1000);
}
function stopQueue(){
  searching=false;found=false;clearInterval(queueTimer);render();
}

function acceptMatch(){
  found=false; searching=false; queueSeconds=0;
  const pool=shuffle(champions);
  champOptions=pool.slice(0,3);
  teamPicks=[null,null,null,null,null];
  chosenChamp=null; finalPool=[]; enemyTeam=[]; mode="champSelect"; render();
}
function pickChampion(id){
  const chosen=champOptions.find(c=>c.id===id);
  if(!chosen)return;
  chosenChamp=chosen; teamPicks[0]=chosen;
  const used=new Set([chosen.id]);
  // 처음 제시된 3개 중 내가 고르지 않은 2개는 반드시 대기열로 보낸다.
  const unchosenOptions=champOptions.filter(c=>c.id!==chosen.id);
  unchosenOptions.forEach(c=>used.add(c.id));
  // 나머지 팀원 4명은 제시된 3개를 제외한 전체 챔피언에서 랜덤 배정한다.
  // 시그니처는 랜덤 풀 안에 실제로 등장했을 때만 기존 우선 요청 로직이 작동한다.
  const teammatePool=shuffle(champions.filter(c=>!used.has(c.id))).slice(0,4);
  for(let i=1;i<5;i++){teamPicks[i]=teammatePool[i-1];used.add(teamPicks[i].id)}
  // 대기열 10칸: 미선택 2개 + 중복 없는 랜덤 8개.
  const benchRandom=shuffle(champions.filter(c=>!used.has(c.id))).slice(0,8);
  finalPool=[...unchosenOptions,...benchRandom];
  signatureRequests=[];signatureRequest=null;signatureChatDone=new Set();signatureChatLog=[];molchoDealerChatDone=false;
  mode="finalChamp";
  signatureReceived(0);
  // 랜덤으로 자기 시그니처를 바로 받은 경우 전용 채팅은 1회만 출력.
  for(let i=1;i<party.length;i++)signatureReceived(i);
  maybeMolchoDealerPickChat();maybeSpecialPickChats();
  // 시그니처가 다른 팀원/대기창에 랜덤 등장한 경우에만 요청 팝업.
  queueSignatureRequests();
  render();
}
function signatureLocation(champId){
  const ti=teamPicks.findIndex(c=>c&&c.id===champId); if(ti>=0)return {type:"team",index:ti};
  const pi=finalPool.findIndex(c=>c&&c.id===champId); if(pi>=0)return {type:"pool",index:pi};
  return null;
}
function queueSignatureRequests(){
  signatureRequests=[];
  for(let i=1;i<party.length;i++){
    const member=party[i],sig=SIGNATURE_CHAMPS[member.id]; if(!sig||teamPicks[i]?.id===sig)continue;
    const loc=signatureLocation(sig),champ=champions.find(c=>c.id===sig); if(loc&&champ)signatureRequests.push({memberIndex:i,member,champ,source:loc});
  }
  signatureRequest=signatureRequests.shift()||null;
}
function signatureReceived(i){
  const member=party[i],sig=SIGNATURE_CHAMPS[member?.id];
  if(!member||!sig||teamPicks[i]?.id!==sig||signatureChatDone.has(member.id))return;
  signatureChatDone.add(member.id); signatureChatLog.push({name:member.nickname,msg:SIGNATURE_CHAT[member.id]});

    const jd=party.find(x=>x.id==="3patourwan");
    if(jd&&!signatureChatDone.has("samira-jd")){signatureChatDone.add("samira-jd");signatureChatLog.push({name:jd.nickname,msg:"믿고 있었다고 싸미라~"})}
  }
}

function answerSignatureRequest(yes){
  const r=signatureRequest;if(!r)return;
  if(yes){
    const loc=signatureLocation(r.champ.id);
    if(loc){
      const old=teamPicks[r.memberIndex];
      if(loc.type==="team"){teamPicks[r.memberIndex]=teamPicks[loc.index];teamPicks[loc.index]=old}
      else {teamPicks[r.memberIndex]=finalPool[loc.index];finalPool[loc.index]=old}
      chosenChamp=teamPicks[0];signatureReceived(r.memberIndex);maybeMolchoDealerPickChat();maybeSpecialPickChats();
    }
  }
  signatureRequest=signatureRequests.shift()||null;render();
}
function enemyCompositionScore(champs){
  if(!champs||champs.length!==5)return -999;
  const roles=champs.map(c=>c.roles||[]);
  const front=roles.filter(rs=>rs.includes('Tank')||rs.includes('Fighter')).length;
  const tanks=roles.filter(rs=>rs.includes('Tank')).length;
  const marksmen=roles.filter(rs=>rs.includes('Marksman')).length;
  const mages=roles.filter(rs=>rs.includes('Mage')).length;
  const supports=roles.filter(rs=>rs.includes('Support')).length;
  const assassins=roles.filter(rs=>rs.includes('Assassin')).length;
  const profiles=champs.map(champDamageProfile);
  const ad=profiles.filter(x=>x==='ad').length;
  const ap=profiles.filter(x=>x==='ap').length;
  const mixed=profiles.filter(x=>x==='mixed').length;
  let score=0;
  if(front>=2)score+=26; else if(front===1)score+=7; else score-=34;
  if(tanks>=1)score+=11;
  if(marksmen>=1)score+=17; else score-=13;
  if(mages>=1)score+=17; else score-=12;
  if(supports>=1)score+=15; else score-=8;
  if(marksmen>2)score-=10*(marksmen-2);
  if(mages>2)score-=7*(mages-2);
  if(assassins>2)score-=9*(assassins-2);
  if(front>3)score-=5*(front-3);
  if((ad>=1||mixed>=2)&&(ap>=1||mixed>=2))score+=16;
  if(ad>=4&&ap===0&&mixed===0)score-=25;
  if(ap>=4&&ad===0&&mixed===0)score-=25;
  if(front>=2&&marksmen>=1&&mages>=1&&supports>=1)score+=24;
  return score+Math.random()*5;
}
function buildBalancedEnemyTeam(pool){
  const source=pool.slice();
  if(source.length<=5)return source.slice(0,5);
  if(Math.random()>=.82)return shuffle(source).slice(0,5);
  let best=null,bestScore=-Infinity;
  for(let i=0;i<90;i++){
    const candidate=shuffle(source).slice(0,5);
    const score=enemyCompositionScore(candidate);
    if(score>bestScore){bestScore=score;best=candidate;}
  }
  return best||shuffle(source).slice(0,5);
}

 const bs=battleState;if(!st||!st.alive||!attacker||!isStructureTargetable(st,attacker.team))return;
 if(attacker.kind==='champ'&&Math.abs(attacker.x-st.x)>1.85)return;
 if(attacker.kind==='minion'&&Math.abs(attacker.x-st.x)>2.45)return;

 // 첫 미니언 웨이브가 나오기 전(01:00)에는 어떤 포탑도 피해를 받지 않는다.
 if(st.type==='tower'&&bs.time<60)return;

 const tempo=1.34;
 const nexusMod=st.type==='nexus'?.72:1;
 const perf=attacker.kind==='champ'?combatPerformanceMultiplier(attacker):1;

 // 1차 포탑(t1/e1)은 05:00 이전 강한 초반 방어력을 갖는다.
 // 챔피언이 미니언 없이 백도어하려는 경우에는 아예 피해가 들어가지 않는다.
 const isOuterTower=(st.id==='t1'||st.id==='e1');
 let earlyTowerMod=1;
 if(isOuterTower&&bs.time<300){
   if(attacker.kind==='champ'){
     const alliedMinionNearby=bs.units.some(u=>u.alive&&u.kind==='minion'&&u.team===attacker.team&&Math.abs(u.x-st.x)<8);
     if(!alliedMinionNearby)return;
   }
   earlyTowerMod=.20;
 }

 st.hp-=dmg*tempo*nexusMod*perf*earlyTowerMod;
 if(st.hp<=0){
  st.hp=0;st.alive=false;
  addBattleLog(`[${formatBattleTime(bs.time)}] ${st.team==='enemy'?'적':'우리'} ${st.name} 파괴`);
  if(st.type==='inhib'){if(st.team==='team')bs.superEnemy=true;else bs.superTeam=true}
  if(st.type==='nexus'&&!bs.endPending){
   // 넥서스 파괴는 RAF 상태와 무관하게 결과 화면으로 확실히 넘어가도록 별도 타이머로 마감한다.
   bs.endPending={winner:st.team==='enemy'?'team':'enemy',realAt:performance.now()+1100};
   bs.status='넥서스 파괴';
   bs.engineStarted=false;
   if(bs.endTimer)clearTimeout(bs.endTimer);
   bs.endTimer=setTimeout(()=>finalizeBattleEnd(bs),1100);
  }
 }
}
function waveIntervalAt(t){
 if(t>=35*60)return 10;
 if(t>=28*60)return 13;
 if(t>=20*60)return 17;
 if(t>=10*60)return 21;
 return 25;
}
function spawnWave(){
 const bs=battleState;bs.waveCount++;
 const cannon=(bs.time>=15*60)||(bs.waveCount%2===1); // 15분부터 매 웨이브 대포, 이전에는 격웨이브
 for(let i=0;i<6;i++){
   const type=i<3?'melee':'ranged';
   bs.units.push(createMinion('team',type));
   bs.units.push(createMinion('enemy',type));
 }
 if(cannon||bs.superTeam)bs.units.push(createMinion('team','cannon'));
 if(cannon||bs.superEnemy)bs.units.push(createMinion('enemy','cannon'));
 // 한타를 크게 이긴 팀은 다음 웨이브에 공성력이 붙어 실제 구조물 철거 기회를 얻는다.
 if((bs.pushMomentumUntil.team||0)>bs.time)bs.units.push(createMinion('team','cannon'));
 if((bs.pushMomentumUntil.enemy||0)>bs.time)bs.units.push(createMinion('enemy','cannon'));
 // 35분 이후에는 양쪽 모두 웨이브를 더 두껍게 해 초장기전을 방지한다.
 if(bs.time>=35*60){bs.units.push(createMinion('team','cannon'));bs.units.push(createMinion('enemy','cannon'));}

}
function updateRelics(dt){const bs=battleState;for(const r of bs.relics){if(r.cooldown>0){r.cooldown-=dt;continue}const nearby=bs.units.filter(u=>u.alive&&Math.abs(u.x-r.x)<2.4&&u.kind==='champ');if(nearby.length){const u=nearby.sort((a,b)=>a.hp/b.maxHp-b.hp/b.maxHp)[0];if(u.hp<u.maxHp*.92){u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.08);r.cooldown=35}}}}
function updateStructures(dt){const bs=battleState;for(const st of bs.structures){if(!st.alive||st.type==='inhib'||st.type==='nexus')continue;const attackers=bs.units.filter(u=>u.alive&&u.team!==st.team&&Math.abs(u.x-st.x)<6);if(!attackers.length)continue;
 // 롤처럼 포탑은 사거리 안의 적 미니언을 우선 공격하고, 미니언이 없을 때만 챔피언을 공격한다.
 const minions=attackers.filter(u=>u.kind==='minion');
 const target=minions[0]||attackers.find(u=>u.kind==='champ');
 if(!target)continue;
 dealDamage({kind:'structure',nick:st.name,team:st.team},target,(target.kind==='minion'?13:6.2)*dt);
 }}
function updateUnits(dt){const bs=battleState;syncNpcAugments();if(bs.paused)return;const all=bs.units;for(const u of all){
 if(!u.alive){if(u.kind==='champ'&&u.respawn>0){u.respawn-=dt;if(u.respawn<=0){u.alive=true;u.hp=u.maxHp*.72;u.x=u.team==='team'?8:92;u.y=50+u.laneBias;u.gold=Math.max(u.gold,1400);u.phase=Math.random()*6.28}}continue}
 u.gold+=6*dt;if(u.kind==='champ'){autoBuyItems(u);u.xp+=5*teamXpCatchup(u.team)*dt;}u.level=u.kind==='champ'?levelFromXp(u.xp):u.level;u.attackCd=Math.max(0,(u.attackCd||0)-dt);
 if(u===bs.team[0]&&!bs.augmentOpen&&!bs.jaebinEventOpen&&!bs.jaebinHealOpen&&!bs.jaebinBadAugmentOpen&&!bs.molchoPhoneOpen&&!bs.molchoDrunkOpen&&!bs.molchoAugmentScamOpen){for(const lv of [7,11,15]){if(u.level>=lv&&!bs.augmentDone[lv]){openAugment(lv);return}}}
 const enemyChamps=bs.units.filter(e=>e.alive&&e.kind==='champ'&&e.team!==u.team);
 const enemyMinions=bs.units.filter(e=>e.alive&&e.kind==='minion'&&e.team!==u.team);
 const targetChamp=enemyChamps.reduce((best,e)=>!best||Math.hypot(e.x-u.x,e.y-u.y)<Math.hypot(best.x-u.x,best.y-u.y)?e:best,null);
 const champDist=targetChamp?Math.hypot(targetChamp.x-u.x,targetChamp.y-u.y):999;
 const st=nearestStructure(u);
 const alliedMinions=bs.units.filter(m=>m.alive&&m.kind==='minion'&&m.team===u.team&&(!st||Math.abs(m.x-st.x)<8));
 if(u.kind==='champ'){
   // 교전 빈도를 낮춘다: 가까워도 항상 싸우지 않고, 팀 라인 간격을 유지하며 전진/후퇴한다.
   const engageRange=u.formation==='back'?14.5:10.8;
   const engage=targetChamp && champDist<engageRange && (u.hp/u.maxHp>.32) && (Math.sin(bs.time*.22+u.phase)>.05);
   if(engage){
     if(champDist<=u.range && u.attackCd<=0){dealDamage(u,targetChamp,u.atk*(.48+Math.random()*.28));u.attackCd=(2.25+Math.random()*1.15)*(u.attackRateMod||1);}
     else {
       // 전방군은 적에게 붙고, 후방군은 아군 전선 뒤에서 사거리를 유지한다.
       const dir=u.team==='team'?1:-1;
       const spacing=u.formation==='back'?u.range*.82:Math.max(1.4,u.range*.28);
       moveOrganic(u,{x:targetChamp.x-dir*spacing,y:targetChamp.y+u.laneBias*.32},dt*(u.formation==='back'?.58:.76));
     }
   }else if(st){
     const enemyTower=st.type==='tower';
     const deadOpp=bs.units.filter(v=>v.kind==='champ'&&v.team!==u.team&&!v.alive).length;
     const siegeMomentum=(bs.pushMomentumUntil[u.team]||0)>bs.time || deadOpp>=3;
     // 미니언이 잠깐 끊겨도 한타를 크게 이긴 팀은 포탑 앞을 완전히 포기하지 않는다.
     if(enemyTower && Math.abs(u.x-st.x)<9 && alliedMinions.length===0 && !siegeMomentum){
       const retreatX=u.team==='team'?st.x-7:st.x+7;
       moveOrganic(u,{x:retreatX,y:50+u.laneBias*.55},dt*.72);
     }else{
       // 구조물 공격은 챔피언 사거리와 무관하게 구조물 바로 앞까지 접근해야 가능하다.
       const structureAttackRange=1.85;
       const approachGap=1.35;
       const waitGap=4.2;
       const targetX=st.x+(u.team==='team'?-(alliedMinions.length||siegeMomentum?approachGap:waitGap):(alliedMinions.length||siegeMomentum?approachGap:waitGap));
       const targetY=50+u.laneBias*.10;
       const structureDist=Math.abs(u.x-st.x);
       if(structureDist<=structureAttackRange && u.attackCd<=0 && (alliedMinions.length>0||siegeMomentum)){
         // 미니언 없이 공성할 때는 백도어 보호처럼 피해량을 크게 낮춘다.
         const siegeDmg=alliedMinions.length>0?u.atk*.50:u.atk*.18;
         damageStructure(st,siegeDmg,u);u.attackCd=1.45+Math.random()*.5;
       }else moveOrganic(u,{x:targetX,y:targetY},dt*.68);
     }
   }
 }else{
   // 미니언은 화면에 렌더링하지 않지만 실제 엔진에서는 계속 전진/교전/포탑 공격한다.
   const mt=enemyMinions.reduce((best,e)=>!best||Math.abs(e.x-u.x)<Math.abs(best.x-u.x)?e:best,null);
   const md=mt?Math.hypot(mt.x-u.x,mt.y-u.y):999;
   if(mt&&md<=u.range&&u.attackCd<=0){dealDamage(u,mt,u.atk);u.attackCd=1.15}
   else if(st&&Math.abs(u.x-st.x)<2.45){if(u.attackCd<=0){damageStructure(st,u.atk*.33,u);u.attackCd=1.2}}
   else if(st)moveOrganic(u,{x:st.x+(u.team==='team'?-1.25:1.25),y:50+u.laneBias*.2},dt);
 }
 // 후방군은 살아있는 아군 전방군보다 과하게 앞으로 튀어나가지 않는다.
 if(u.kind==='champ'&&u.formation==='back'){
   const fronts=bs.units.filter(v=>v.alive&&v.kind==='champ'&&v.team===u.team&&v.formation==='front');
   if(fronts.length){
     const dir=u.team==='team'?1:-1;
     const frontX=dir===1?Math.max(...fronts.map(v=>v.x)):Math.min(...fronts.map(v=>v.x));
     if(dir===1)u.x=Math.min(u.x,frontX-3.2); else u.x=Math.max(u.x,frontX+3.2);
   }
 }
 // 챔피언은 서로 겹치지 않도록 더 넓은 횡간격을 유지한다.
 if(u.kind==='champ'){
   for(const v of bs.units){if(v===u||!v.alive||v.kind!=='champ'||v.team!==u.team)continue;const dx=u.x-v.x,dy=u.y-v.y,d=Math.hypot(dx,dy);if(d<4.4&&d>.01){u.x+=dx/d*.38*dt;u.y+=dy/d*.9*dt}}
 }
 u.y=Math.max(30,Math.min(70,u.y));
}}

function finalizeBattleEnd(expectedState=battleState){const bs=expectedState;if(!bs||battleState!==bs||mode!=='battle'||bs.endFinalized||!bs.endPending)return false;bs.endFinalized=true;if(bs.endTimer){clearTimeout(bs.endTimer);bs.endTimer=null;}bs.engineStarted=false;const winner=bs.endPending.winner;bs.status=winner==='team'?'우리 팀 승리':'적 팀 승리';if(winner==='team'){if(party.some(c=>c.id==='siljeom'))bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">실점:</span> 죽어 그냥 ㅋㅋ`);if(party.some(c=>c.id==='nguyen'))bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">Nguyen Ngoc Tu:</span> 나1가`);if(party.some(c=>c.id==='3patourwan'))for(let i=0;i<4;i++)bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">쓰리빠뚜르완:</span> ㅋ`);if(party.some(c=>c.id==='joguk'))bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">조국:</span> 븅`);if(party.some(c=>c.id==='molcho'))bs.chat.push(`<span class="all-tag">[팀원]</span> <span class="ally-chat">몰초:</span> 쉽네 쉬워`);}else{if(bs.jaebinChatAttempted){const jaebinUnit=bs.team.find(u=>u.realName==='이재빈'||u.nick==='Nguyen Ngoc Tu');const champName=jaebinUnit?.champ?.name||'그 챔피언';const taunts=['이기고 자라 ㅋㅋㅋㅋㅋㅋㅋㅋㅋ',`${champName} 너는 진짜 접어라 ㅇㅇ`,'그 조합으로 쳐지네 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ','ez','븅신 ㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋㅋ'];bs.enemy.slice(0,5).forEach((u,i)=>bs.chat.push(`<span class="all-tag">[전체]</span> <span class="enemy-chat">${u.nick}:</span> ${taunts[i]}`));}}matchResult={winner,time:bs.time,teamKills:bs.teamKills,enemyKills:bs.enemyKills,team:bs.team.map(u=>({...u})),enemy:bs.enemy.map(u=>({...u})),chat:[...(bs.chat||[])]};stopBattleUiSync();mode='battleEnd';render();return true}
function checkEnd(){const bs=battleState;if(!bs||!bs.endPending)return false;if(performance.now()>=bs.endPending.realAt)return finalizeBattleEnd(bs);return false}
function battleFrame(ts){
 if(mode!=='battle'||!battleState||!battleState.engineStarted)return;
 const bs=battleState;bs.lastEngineHeartbeat=performance.now();
 try{
   if(bs.paused){bs.lastTs=ts;scheduleBattleFrame();return;}
   if(bs.endPending){bs.lastTs=ts;syncBattleDom();if(checkEnd())return;scheduleBattleFrame();return;}
   let raw=Math.min(.05,(ts-bs.lastTs)/1000);bs.lastTs=ts;let dt=Math.min(.8,raw*bs.speed);bs.time+=dt;
   if(!bs.devForcedEventDone&&!bs.augmentOpen){if(triggerDeveloperForcedEvent()){scheduleBattleFrame();return;}}
   if(!bs.akaliChatDone&&party.some(c=>c.id==='nguyen')&&bs.enemy.some(u=>u.champ?.id==='akali')&&bs.time>=bs.akaliChatAt){bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">Nguyen Ngoc Tu:</span> 아칼리 사기 챔피언 하면 재미있음?`);bs.akaliChatDone=true;}
   if(bs.galioMessiMatch&&bs.galioMessiChatStage===0&&bs.time>=1){bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">갈리오:</span> 무슨 고트가 메시임?`);bs.galioMessiChatStage=1;}
   if(bs.galioMessiMatch&&bs.galioMessiChatStage===1&&bs.time>=4){bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">갈리오:</span> 우리 날두횽이 고트지;`);bs.galioMessiChatStage=2;}
   if(bs.jogukMilteokMatch&&bs.jogukMilteokChatStage===0&&bs.time>=1){bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">조국:</span> ? 밀떡?`);bs.jogukMilteokChatStage=1;}
   if(bs.jogukMilteokMatch&&bs.jogukMilteokChatStage===1&&bs.time>=4){bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">조국:</span> 개쳐맞을래?`);bs.jogukMilteokChatStage=2;}
   if(bs.siljeomEliseActive&&bs.time>=bs.siljeomSpiderNext){
     bs.siljeomSpiderCount++;
     bs.chat.push(`<span class="all-tag">[전체]</span> <span class="ally-chat">실점:</span> 스파이더맨~ 스파이더맨`);
     if(party.some(c=>c.id==='3patourwan')){
       if(bs.siljeomSpiderCount===1)bs.chat.push(`<span class="all-tag">[팀]</span> <span class="ally-chat">쓰리빠뚜르완:</span> 아 ㅈㄴ 시끄럽네`);
       else if(bs.siljeomSpiderCount===2)bs.chat.push(`<span class="all-tag">[팀]</span> <span class="ally-chat">쓰리빠뚜르완:</span> 스파이더맨~ 스파이더맨`);
     }
     bs.siljeomSpiderNext+=300;
   }
   if(bs.jaebinRandomEventEnabled&&!bs.jaebinRandomEventDone&&!anyCharacterPopupOpen(bs)&&party.some(c=>c.id==='nguyen')&&bs.time>=bs.jaebinRandomEventAt){if(triggerJaebinRandomEvent()){scheduleBattleFrame();return;}}
   if(bs.molchoRandomEventEnabled&&!bs.molchoRandomEventDone&&!anyCharacterPopupOpen(bs)&&party.some(c=>c.id==='molcho')&&bs.time>=bs.molchoRandomEventAt){triggerMolchoRandomEvent();scheduleBattleFrame();return;}
   if(bs.galioSleepEnabled&&!bs.galioSleepDone&&!anyCharacterPopupOpen(bs)&&bs.time>=bs.galioSleepAt){if(triggerGalioSleepEvent()){scheduleBattleFrame();return;}}
   if(bs.siljeomPenaltyEnabled&&!bs.siljeomPenaltyDone&&!anyCharacterPopupOpen(bs)&&bs.time>=bs.siljeomPenaltyAt){if(triggerSiljeomPenaltyEvent()){scheduleBattleFrame();return;}}
   if(bs.munchulEnabled&&!bs.munchulDone&&!anyCharacterPopupOpen(bs)&&bs.time>=bs.munchulAt){if(triggerMunchulEvent()){scheduleBattleFrame();return;}}
   while(bs.time>=bs.nextWaveAt){spawnWave();bs.nextWaveAt+=waveIntervalAt(bs.nextWaveAt)}
   updateUnits(dt);updateStructures(dt);updateRelics(dt);applyOvercharge(dt);
   if(bs.units.length>70)bs.units=bs.units.filter(u=>u.kind==='champ'||u.alive);
   for(const f of bs.fx)f.ttl-=dt;bs.fx=bs.fx.filter(f=>f.ttl>0);
   if(checkEnd()){render();return}
   if(ts-bs.lastUiSync>=66){bs.lastUiSync=ts;syncBattleDom()}
 }catch(err){
   console.error('[battle-engine]',err);
   bs.status='경기 진행 중';
   bs.lastTs=ts;
 }
 scheduleBattleFrame();
}

function screenPos(x,y){
 const centerY=78-x*.56; // blue bottom-left -> red top-right
 const lateral=((y||50)-50)*.58;
 return {left:Math.max(3,Math.min(97,x)),top:Math.max(8,Math.min(91,centerY+lateral))};
}
function syncStaticBattlePositions(){
 if(!battleState)return;
 for(const st of battleState.structures){const el=document.querySelector(`[data-structure="${st.id}"]`);if(el){const p=screenPos(st.x,st.y||50);el.style.left=p.left+'%';el.style.top=p.top+'%'}}
 const rs=[...document.querySelectorAll('.b2-relic')];battleState.relics.forEach((r,i)=>{if(rs[i]){const p=screenPos(r.x,50);rs[i].style.left=p.left+'%';rs[i].style.top=p.top+'%'}})
}

 for(const u of bs.team.concat(bs.enemy)){const el=document.querySelector(`[data-unit="${u.id}"]`);if(!el)continue;const p=screenPos(u.x,u.y);el.style.left=p.left+'%';el.style.top=p.top+'%';el.classList.toggle('dead',!u.alive);const hp=el.querySelector('.t-hp em');if(hp)hp.style.width=Math.max(0,u.hp/u.maxHp*100)+'%'}
 for(const u of bs.team.concat(bs.enemy)){const hud=document.querySelector(`[data-hud-unit="${u.id}"]`);if(!hud)continue;hud.classList.toggle('dead',!u.alive);const hp=hud.querySelector('.b2-hp i');if(hp)hp.style.width=Math.max(0,Math.min(100,u.hp/u.maxHp*100))+'%';const info=hud.querySelector('.unit-info small');if(info)info.textContent=`${u.champ.name} · Lv.${u.level}`;const gold=hud.querySelector('.b2-gold');if(gold)gold.textContent=Math.floor(u.gold).toLocaleString()+' G'}
 for(const st of bs.structures){const el=document.querySelector(`[data-structure="${st.id}"]`);if(el){el.classList.toggle('dead',!st.alive);const n=el.querySelector('.sname');if(n)n.textContent=`${st.name} · ${Math.max(0,Math.round(st.hp))}%`}}
 for(const r of bs.relics){const els=[...document.querySelectorAll('.b2-relic')];const idx=bs.relics.indexOf(r);if(els[idx])els[idx].classList.toggle('cool',r.cooldown>0)}
 if(bs.log.length>120)bs.log.splice(0,bs.log.length-120);
 const log=document.querySelector('.b2-log');
 if(log){
   const logVersion=bs.logVersion||0;
   if(Number(log.dataset.version||-1)!==logVersion){
     log.innerHTML=bs.log.slice(-40).map(x=>`<div>${x}</div>`).join('');
     log.dataset.version=String(logVersion);
     requestAnimationFrame(()=>{const l=document.querySelector('.b2-log');if(l)l.scrollTop=l.scrollHeight});
   }
 }
 const chat=document.querySelector('.match-all-chat-body');
 if(chat){
   const chatCount=(bs.chat||[]).length;
   if(Number(chat.dataset.count||-1)!==chatCount){
     chat.innerHTML=(bs.chat||[]).slice(-30).map(x=>`<div>${x}</div>`).join('');
     chat.dataset.count=String(chatCount);
     requestAnimationFrame(()=>{const c=document.querySelector('.match-all-chat-body');if(c)c.scrollTop=c.scrollHeight});
   }
 }
 syncBattleScoreboard();
 const fxWrap=document.querySelector('.b2-stage');if(fxWrap){document.querySelectorAll('[data-fx]').forEach(el=>el.remove());for(const f of bs.fx){const d=document.createElement('div');d.className='b2-fx '+(f.team==='enemy'?'red':'blue');d.dataset.fx=f.id;const p=screenPos(f.x,f.y);d.style.left=p.left+'%';d.style.top=p.top+'%';d.textContent=f.text;fxWrap.appendChild(d)}}}

function startDeveloperBattle(){
 const allyIds=[0,1,2,3,4].map(i=>document.getElementById('devAllyChar'+i)?.value).filter(Boolean);
 if(new Set(allyIds).size!==5){alert('우리 팀 캐릭터 5명은 서로 다르게 선택해 주세요.');return;}
 const allyChamps=[0,1,2,3,4].map(i=>champions.find(c=>c.id===document.getElementById('devAllyChamp'+i)?.value));
 const enemyChamps=[0,1,2,3,4].map(i=>champions.find(c=>c.id===document.getElementById('devEnemyChamp'+i)?.value));
 if(allyChamps.some(x=>!x)||enemyChamps.some(x=>!x)){alert('챔피언 선택을 확인해 주세요.');return;}

 party=allyIds.map(id=>chars.find(c=>c.id===id));
 me=party[0];
 teamPicks=allyChamps;
 chosenChamp=teamPicks[0];
 enemyTeam=enemyChamps.map((champ,i)=>({
   champ,
   nick:(document.getElementById('devEnemyNick'+i)?.value||`TEST-${i+1}`).trim()||`TEST-${i+1}`
 }));
 developerTestConfig={
   enabled:true,
   startTime:Number(document.getElementById('devStartTime')?.value||0),
   forcedEvent:document.getElementById('devForcedEvent')?.value||'',
   speed:Number(document.getElementById('devSpeed')?.value||1)
 };
 signatureRequests=[];signatureRequest=null;signatureChatDone=new Set();signatureChatLog=[];pickSpecialChatDone=new Set();molchoDealerChatDone=false;
 stopBattleUiSync();
 startBattle();
}

function applyDeveloperBattleConfig(bs){
 if(!developerTestConfig?.enabled||!bs)return;
 const t=Math.max(0,Number(developerTestConfig.startTime)||0);
 bs.time=t;
 bs.nextWaveAt=Math.max(60,60+Math.floor(Math.max(0,t-60)/30+1)*30);
 bs.speed=developerTestConfig.speed||1;
 bs.devForcedEvent=developerTestConfig.forcedEvent||'';
 bs.devForcedEventDone=!bs.devForcedEvent;

 // 랜덤 이벤트가 먼저 끼어드는 것을 방지하고, 선택한 강제 이벤트만 즉시 검증 가능하게 한다.
 if(bs.devForcedEvent){
   bs.jaebinRandomEventEnabled=false;
   bs.molchoRandomEventEnabled=false;
   bs.galioSleepEnabled=false;
   bs.siljeomPenaltyEnabled=false;
   bs.munchulEnabled=false;
 }
}

function triggerDeveloperForcedEvent(){
 const bs=battleState;if(!bs||!developerTestConfig?.enabled||bs.devForcedEventDone||bs.augmentOpen||anyCharacterPopupOpen(bs))return false;
 const ev=bs.devForcedEvent;
 let opened=false;

 if(ev==='jaebin-taunt'){
   bs.jaebinRandomEventType='taunt';bs.jaebinRandomEventDone=false;bs.jaebinEventOpen=true;opened=true;
 }else if(ev==='jaebin-heal'){
   bs.jaebinRandomEventType='healpack';bs.jaebinRandomEventDone=false;bs.jaebinHealOpen=true;opened=true;
 }else if(ev==='molcho-phone'){
   bs.molchoRandomEventType='phone';bs.molchoRandomEventDone=false;bs.molchoPhoneOpen=true;opened=true;
 }else if(ev==='molcho-drunk'){
   bs.molchoRandomEventType='drunk';bs.molchoRandomEventDone=false;bs.molchoDrunkOpen=true;opened=true;
 }else if(ev==='galio-sleep'){
   bs.galioSleepEnabled=true;bs.galioSleepDone=false;bs.galioSleepOpen=true;opened=true;
 }else if(ev==='siljeom-penalty'){
   bs.siljeomPenaltyEnabled=true;bs.siljeomPenaltyDone=false;bs.siljeomPenaltyResult=null;bs.siljeomPenaltyOpen=true;opened=true;
 }else if(ev==='munchul'){
   bs.munchulEnabled=true;bs.munchulDone=false;bs.munchulResult=null;bs.munchulScenario=(me?.id==='molcho'?'molcho':'dage');bs.munchulOpen=true;opened=true;
 }

 bs.devForcedEventDone=true;
 if(opened){
   bs.paused=true;bs.status='이벤트 일시정지';render();return true;
 }
 return false;
}

let championAugmentDb=AUGMENT_DB_FALLBACK;
async function loadChampionAugmentDb(){
 try{
  const res=await fetch('assets/data/augment-tiers.json?v=64',{cache:'no-store'});
  if(!res.ok)throw new Error('HTTP '+res.status);
  const data=await res.json();
  if(data&&data.champions)championAugmentDb=data;
 }catch(e){console.info('[augment-db] external DB unavailable; using inline fallback');}
}
loadChampionAugmentDb();
function augmentRankInfo(champId,augmentName){
 const row=championAugmentDb?.champions?.[champId];
 const list=row?.rankings||[];
 const idx=list.indexOf(augmentName);
 if(idx<0)return {grade:null,rank:null,patch:row?.patch||null};
 const rank=idx+1;
 const grade=rank<=5?'S':rank<=12?'A':rank<=22?'B':'C';
 return {grade,rank,patch:row?.patch||null};
}
function augmentGradeWeight(grade){return grade==='S'?10:grade==='A'?5.5:grade==='B'?2.5:grade==='C'?1:1.35}
function augmentGradePerformance(grade){return grade==='S'?1.5:grade==='A'?1.2:grade==='B'?.8:grade==='C'?.5:1}
function augmentPerformanceMultiplier(u){
 const picked=allOwnedAugments(u);
 if(!picked.length)return 1;
 const vals=picked.map(a=>augmentGradePerformance(a.opggGrade)).filter(v=>Number.isFinite(v));
 return vals.length?vals.reduce((a,b)=>a+b,0)/vals.length:1;
}
function weightedPickAugmentForChampion(u,choices){
 if(!choices?.length)return null;
 const id=u?.champ?.id;
 const weights=choices.map(a=>augmentGradeWeight(augmentRankInfo(id,a.name).grade));
 let total=weights.reduce((a,b)=>a+b,0),r=Math.random()*total;
 for(let i=0;i<choices.length;i++){r-=weights[i];if(r<=0)return choices[i]}
 return choices[choices.length-1];
}
function augmentRankBadgeHtml(champId,name){
 const info=augmentRankInfo(champId,name);
 return info.grade?`<div class="augment-rank-badge rank-${info.grade}" title="OP.GG 추천 ${info.rank}위 · ${info.patch||'패치 미상'}">OP.GG ${info.grade}</div>`:'';
}
function augmentDbStatusHtml(champId){
 const row=championAugmentDb?.champions?.[champId];
 const count=row?.rankings?.length||0;
 return count?`<div class="augment-db-note"><b>OP.GG 추천 DB</b> · ${row.patch||'-'} 패치 · 상위 ${count}개 반영 <span class="augment-db-source">(S 1~5 / A 6~12 / B 13~22 / C 23+)</span></div>`:`<div class="augment-db-note">OP.GG 추천 DB · 이 챔피언은 아직 데이터 입력 전</div>`;
}

function augmentDescription(name){return AUGMENT_DESCRIPTIONS[name]||'고유 효과를 지닌 증강체입니다. 챔피언과 조합에 따라 효율이 달라집니다.'}


function augmentEffectMeta(tier,name){
 const mult=tier==='silver'?1.035:tier==='gold'?1.065:1.10;
 const hp=tier==='silver'?1.045:tier==='gold'?1.08:1.13;
 const speed=tier==='silver'?1.018:tier==='gold'?1.032:1.05;
 let h=0;for(const ch of name)h=(h*31+ch.charCodeAt(0))>>>0;
 return {mult,hp,speed,kind:h%4};
}
function applyAugmentStatEffect(u,tier,name){
 const {mult,hp,speed,kind}=augmentEffectMeta(tier,name);
 if(kind===0)u.atk*=mult;
 else if(kind===1){u.maxHp*=hp;u.hp*=hp}
 else if(kind===2)u.speed*=speed;
 else{u.atk*=1+(mult-1)*.6;u.maxHp*=1+(hp-1)*.6;u.hp*=1+(hp-1)*.6}
}
function undoAugmentStatEffect(u,pick){
 if(!u||!pick)return;
 const tier=pick.tier||'silver',name=pick.name||'';
 const {mult,hp,speed,kind}=augmentEffectMeta(tier,name);
 if(kind===0)u.atk/=mult;
 else if(kind===1){u.maxHp/=hp;u.hp/=hp}
 else if(kind===2)u.speed/=speed;
 else{
   const am=1+(mult-1)*.6,hm=1+(hp-1)*.6;
   u.atk/=am;u.maxHp/=hm;u.hp/=hm;
 }
 u.hp=Math.min(u.hp,u.maxHp);
}
function augmentEffectFor(tier,name){
 return {name,desc:augmentDescription(name),icon:tier==='silver'?'◇':tier==='gold'?'✦':'◆',apply:u=>applyAugmentStatEffect(u,tier,name)};
}
const augmentTemplates={silver:augmentNames.silver.map(n=>augmentEffectFor('silver',n)),gold:augmentNames.gold.map(n=>augmentEffectFor('gold',n)),prismatic:augmentNames.prismatic.map(n=>augmentEffectFor('prismatic',n))};
function rollAugmentTier(){const r=Math.random()*100;return r<30?'silver':r<80?'gold':'prismatic'}

function ensureAugmentSeen(u){
 if(!u)return new Set();
 if(!(u.seenAugments instanceof Set))u.seenAugments=new Set(Array.isArray(u.seenAugments)?u.seenAugments:[]);
 return u.seenAugments;
}
function markAugmentSeen(u,name){
 if(u&&name)ensureAugmentSeen(u).add(name);
}
function availableAugmentPool(tier,u,extraExclude=[]){
 const seen=ensureAugmentSeen(u);
 const extra=new Set(extraExclude||[]);
 return (augmentTemplates[tier]||[]).filter(a=>!seen.has(a.name)&&!extra.has(a.name));
}
function makeAugmentChoices(tier=rollAugmentTier(),u=null){
 const pool=[...availableAugmentPool(tier,u)],picks=[];
 while(picks.length<3&&pool.length){
   const j=Math.floor(Math.random()*pool.length);
   const a={...pool.splice(j,1)[0],tier,rerolled:false,key:tier+'-'+Math.random()};
   picks.push(a);
   markAugmentSeen(u,a.name); // 화면에 한 번이라도 뜨는 즉시 이후 풀에서 제외
 }
 return picks;
}
function makePickedAugment(u,a,stage){
 const ri=augmentRankInfo(u?.champ?.id,a.name);
 return {name:a.name,tier:a.tier,desc:a.desc,stage,opggGrade:ri.grade,opggRank:ri.rank};
}
function allOwnedAugments(u){
 return [...(u?.augments||[]).filter(Boolean),...(u?.bonusAugments||[]).filter(Boolean)];
}
function syncPlayerAugmentList(u){
 const bs=battleState;
 if(bs&&u===bs.team?.[0])bs.augments=allOwnedAugments(u);
}
function randomUnseenAugment(tier,u,stage){
 let pool=availableAugmentPool(tier,u);
 // 정상 플레이에서는 풀 소진이 사실상 불가능하지만, 소진 시 같은 등급 전체에서 중복 소유만 피한다.
 if(!pool.length){
   const owned=new Set(allOwnedAugments(u).map(a=>a.name));
   pool=(augmentTemplates[tier]||[]).filter(a=>!owned.has(a.name));
 }
 if(!pool.length)return null;
 const base=pool[Math.floor(Math.random()*pool.length)];
 const a={...base,tier,rerolled:false,key:tier+'-'+Math.random()};
 markAugmentSeen(u,a.name);
 a.apply(u);
 return makePickedAugment(u,a,stage);
}
function addBonusAugment(u,tier,stage,depth=0){
 if(!u||depth>6)return null;
 u.bonusAugments=u.bonusAugments||[];
 const picked=randomUnseenAugment(tier,u,stage);
 if(!picked)return null;
 u.bonusAugments.push(picked);
 syncPlayerAugmentList(u);
 if(['전환: 골드','전환: 프리즘','전환: 혼돈','판도라의 상자'].includes(picked.name)){
   resolveSpecialAugment(u,picked,stage,depth+1);
 }
 return picked;
}
function transformAllOwnedToPrismatic(u){
 if(!u)return;
 u.augments=u.augments||[];
 u.bonusAugments=u.bonusAugments||[];

 const standard=u.augments.map((p,i)=>p?{pick:p,index:i}:null).filter(Boolean);
 const bonus=u.bonusAugments.map((p,i)=>p?{pick:p,index:i}:null).filter(Boolean);
 const old=[...standard,...bonus];

 // 기존 증강의 실제 스탯 효과를 먼저 제거한다.
 old.forEach(x=>undoAugmentStatEffect(u,x.pick));

 const usedNow=new Set();
 const makeReplacement=(oldPick)=>{
   let pool=availableAugmentPool('prismatic',u,[...usedNow]);
   if(!pool.length)pool=(augmentTemplates.prismatic||[]).filter(a=>!usedNow.has(a.name));
   if(!pool.length)return oldPick;
   const base=pool[Math.floor(Math.random()*pool.length)];
   usedNow.add(base.name);markAugmentSeen(u,base.name);
   const a={...base,tier:'prismatic',rerolled:false,key:'prismatic-'+Math.random()};
   a.apply(u);

<script id="v116-polish">
/* =============================================================
   V116 POLISH — match presentation / tactical drag / MF recovery
   - keep V113~V115 continuous movement during live play
   - restart-only snap is intentional: kickoff is a dead-ball reset
   ============================================================= */
const VOLTA_V116={VERSION:'V116-POLISH',KICKOFF_READY_MS:320};

/* ---------- Tactical timeout / halftime: four draggable position bands ---------- */
let voltaV116TacDragName=null;
function voltaV116JsName(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/[\r\n]+/g,' ')}
function voltaV116TacDragStart(ev,name){
  voltaV116TacDragName=name;
  try{ev.dataTransfer.setData('text/plain',name);ev.dataTransfer.effectAllowed='move'}catch(e){}
}
function voltaV116TacDragOver(ev){ev.preventDefault();try{ev.dataTransfer.dropEffect='move'}catch(e){}}
function voltaV116TacDrop(ev,line){
  ev.preventDefault();
  const s=voltaMatchState;if(!s)return;
  let name=voltaV116TacDragName||'';try{name=ev.dataTransfer.getData('text/plain')||name}catch(e){}
  const team=s.teams?.[s.userSide||'home'],p=team?.players?.find(x=>x.name===name);if(!p)return;
  const old=p.position;
  // Dropping a field player into GK swaps the current keeper into the dragged player's old line,
  // so there is never an awkward two-GK intermediate state.
  if(line==='GK'&&old!=='GK'){
    const gk=team.players.find(x=>x.position==='GK'&&x.name!==p.name);
    if(gk)gk.position=old==='GK'?'DF':old;
  }
  p.position=line;
  voltaV116TacDragName=null;
  s.aiStates={home:{},away:{}};
  render();
}
function voltaV116TacDragEnd(){voltaV116TacDragName=null}
function voltaV116RoleBandHtml(team,line,label){
  const ps=(team.players||[]).filter(p=>p.position===line);
  return `<div class="v116-pos-zone ${line}" ondragover="voltaV116TacDragOver(event)" ondrop="voltaV116TacDrop(event,'${line}')">
    <div class="v116-pos-title"><b>${label}</b><span>${ps.length}명</span></div>
    <div class="v116-pos-players">${ps.map(p=>`<div class="v116-pos-player ${line}" draggable="true" ondragstart="voltaV116TacDragStart(event,'${voltaV116JsName(p.name)}')" ondragend="voltaV116TacDragEnd()"><b>${voltaV114SafeHtml(p.name)}</b><span>❤️ ${Math.round(p.condition||0)}</span></div>`).join('')||'<em>여기로 드래그</em>'}</div>
  </div>`;
}
voltaV114MiniBoardHtml=function(team,prefix='voltaTo'){
  return `<div class="v116-tac-board">
    ${voltaV116RoleBandHtml(team,'FW','공격')}
    ${voltaV116RoleBandHtml(team,'MF','미드필더')}
    ${voltaV116RoleBandHtml(team,'DF','수비')}
    ${voltaV116RoleBandHtml(team,'GK','골키퍼')}
    <small>선수 카드를 원하는 포지션 칸으로 드래그하세요. GK는 1명만 유지됩니다.</small>
  </div>`;
};
// Keep the existing apply/save pipeline, but make its select backing fields invisible.
voltaV114PositionEditorHtml=function(prefix,team){
  return `<div class="v116-hidden-role-editor">${team.players.map((p,i)=>`<select id="${prefix}Pos${i}"><option value="${p.position}" selected>${p.position}</option></select>`).join('')}</div>`;
};

/* ---------- MF defensive responsibility ---------- */
const voltaV116IntentTargetBase=voltaV113IntentTarget;
voltaV113IntentTarget=function(side,p,ai,base){
  let out=voltaV116IntentTargetBase(side,p,ai,base);
  const s=voltaMatchState,r=voltaV113RoleInfo(side,p),defStates=['TRACK','MARK','MID_BLOCK','COVER','BACKCOURT'];
  if(r.role==='ALA'&&defStates.includes(ai?.state)){
    const q=ai?.targetName?s?.board?.playerPos?.[voltaOpponentSide(side)]?.[ai.targetName]:null;
    if(q){
      const dir=voltaV113SideDir(side),qAdv=voltaV113Forward(side,q.x);
      // ALA/MF must be able to recover into the defensive third and stay goal-side of an attacker.
      const wantedAdv=voltaClamp(qAdv-2.0,18,64);
      out.x=voltaV115AdvX(side,wantedAdv);
      out.y=voltaClamp(q.y*.72+base.y*.28,10,90);
    }else{
      out.x=voltaV115ClampAdv(side,out.x,20,62);
    }
  }
  return out;
};

const voltaV116AssignAIBase=voltaAssignAIStates;
voltaAssignAIStates=function(side,carrierName,force=false){
  voltaV116AssignAIBase(side,carrierName,force);
  const s=voltaMatchState;if(!s||!s.teams?.[side]||!s.teams?.[voltaOpponentSide(side)])return;
  if(s.keeperHold&&voltaV113Now()<s.keeperHold.until)return;
  const defSide=voltaOpponentSide(side),ball=s.board?.ball||{x:50,y:50};
  const mids=s.teams[defSide].players.filter(p=>p.position==='MF');
  if(!mids.length)return;
  const threats=s.teams[side].players.filter(p=>p.position!=='GK').slice().sort((a,b)=>{
    const ap=s.board.playerPos?.[side]?.[a.name],bp=s.board.playerPos?.[side]?.[b.name];
    return voltaV113Forward(side,bp?.x||50)-voltaV113Forward(side,ap?.x||50);
  });
  const forwards=threats.filter(p=>p.position==='FW');
  const ballInDefHalf=voltaV113Forward(defSide,ball.x)<58;
  mids.forEach((mf,i)=>{
    const cur=s.aiStates?.[defSide]?.[mf.name];
    // Keep one legitimate presser. Other midfielders recover and pick up the most dangerous forward runner.
    if(cur?.state==='PRESS'&&i===0)return;
    const lane=voltaV113RoleInfo(defSide,mf).lane||0;
    let target=forwards.find(f=>{
      const fr=voltaV113RoleInfo(side,f);return Math.sign(fr.lane||lane||1)===Math.sign(lane||1);
    })||forwards[i%Math.max(1,forwards.length)]||threats[i%Math.max(1,threats.length)];
    if(target&&ballInDefHalf){
      voltaV113SetIntent(defSide,mf,'TRACK',{targetName:target.name,reason:'midfielder defensive recovery / mark attacker',minCommit:900,maxCommit:1500},true);
    }else if(target&&cur?.state!=='PRESS'){
      voltaV113SetIntent(defSide,mf,'TRACK',{targetName:target.name,reason:'midfield compactness',minCommit:760,maxCommit:1250},force);
    }
  });
};

/* ---------- Kickoff only: snap both teams to restart shape ---------- */
function voltaV116SnapKickoff(sp){
  const s=voltaMatchState;if(!s||!sp||sp.type!=='KICKOFF')return;
  for(const side of ['home','away']){
    for(const p of s.teams[side].players){
      const q=voltaV115RestartAnchor(side,p,'KICKOFF',side===sp.side?sp.kickerName:null,sp.spot,sp.side);
      if(!s.board.playerPos[side])s.board.playerPos[side]={};
      const pt=s.board.playerPos[side][p.name]||{};
      s.board.playerPos[side][p.name]={...pt,x:q.x,y:q.y,vx:0,vy:0,dirX:0,dirY:0,state:p.name===sp.kickerName&&side===sp.side?'KICKER':'KICK_SUPPORT'};
      const ai=s.aiStates?.[side]?.[p.name];if(ai){ai.targetX=q.x;ai.targetY=q.y}
    }
  }
  s.board.ball={x:50,y:50};s.board.ballTarget={x:50,y:50};
}
const voltaV116StartKickoffBase=voltaV113StartKickoff;
voltaV113StartKickoff=function(side,label='킥오프'){
  const sp=voltaV116StartKickoffBase(side,label),s=voltaMatchState,now=voltaV113Now();
  if(sp?.type==='KICKOFF'){
    voltaV116SnapKickoff(sp);
    const goalWait=s?.goalFx&&now<s.goalFx.until ? Math.max(0,s.goalFx.until-now) : 0;
    sp.readyAt=now+Math.max(VOLTA_V116.KICKOFF_READY_MS,goalWait);
    sp.forceAt=sp.readyAt+700;
    if(!goalWait)voltaSetCaption(`${label} — 각자 위치에서 바로 재개합니다.`,'normal');
  }
  return sp;
};

// Stamp engine version for diagnostics without changing simulation physics.
const voltaV116EngineInitBase=voltaV113EngineInit;
voltaV113EngineInit=function(){voltaV116EngineInitBase();if(voltaMatchState?.engine)voltaMatchState.engine.version=VOLTA_V116.VERSION};
</script>
<style id="v116-polish-style">

<script id="v113-volta-continuous-engine">
/*
 V113 — Continuous Futsal Match Engine
 -------------------------------------
 원칙
 1) 화면용 씬이 선수를 이동시키지 않는다. 선수는 항상 velocity/acceleration 엔진 하나만 탄다.
 2) PASS/DRIBBLE/SHOT은 '행동 결과'이고 좌표 연출의 원인이 아니다.
 3) 공 없는 네 명도 매 순간 의도(intent)를 갖고 로테이션/지원/침투/압박/커버를 한다.
 4) GK는 5번째 빌드업 플레이어다.
 5) 터치라인 아웃은 풋살 KICK-IN으로 실제 재배치 후 재개한다.
 6) 전반 종료는 자동으로 후반으로 넘어가지 않는다. 감독이 전술을 확인하고 직접 시작한다.
 7) 순간이동/패스 방향/GK 관여를 telemetry로 계측한다.
*/
const VOLTA_V113={
 TICK_MS:100,
 SIM_SEC_PER_TICK:.82,
 PITCH_M_X:.40,       // x 1% = 0.40m (40m 코트)
 PITCH_M_Y:.25,       // y 1% = 0.25m (25m 코트)
 PLAYER_MIN_DIST_M:1.35,
 TELEPORT_M:1.65,
 THINK_MIN:520,
 THINK_MAX:980
};

function voltaV113Now(){return (typeof performance!=='undefined'&&performance.now)?performance.now():Date.now()}
function voltaV113SideDir(side){return side==='home'?1:-1}
function voltaV113Forward(side,x){return side==='home'?x:100-x}
function voltaV113DistM(a,b){if(!a||!b)return 99;return Math.hypot((a.x-b.x)*VOLTA_V113.PITCH_M_X,(a.y-b.y)*VOLTA_V113.PITCH_M_Y)}
function voltaV113PointSegDistM(p,a,b){
 const ax=a.x*VOLTA_V113.PITCH_M_X,ay=a.y*VOLTA_V113.PITCH_M_Y,bx=b.x*VOLTA_V113.PITCH_M_X,by=b.y*VOLTA_V113.PITCH_M_Y,px=p.x*VOLTA_V113.PITCH_M_X,py=p.y*VOLTA_V113.PITCH_M_Y;
 const vx=bx-ax,vy=by-ay,den=vx*vx+vy*vy||1;let t=((px-ax)*vx+(py-ay)*vy)/den;t=voltaClamp(t,0,1);
 return Math.hypot(px-(ax+vx*t),py-(ay+vy*t));
}
function voltaV113EnsureTelemetry(){
 const s=voltaMatchState;if(!s)return null;
 if(!s.telemetry)s.telemetry={
  passes:{home:{forward:0,lateral:0,back:0},away:{forward:0,lateral:0,back:0}},
  gkTouches:{home:0,away:0},kickIns:{home:0,away:0},goalClearances:{home:0,away:0},rotations:{home:0,away:0},
  intentChanges:{home:0,away:0},teleports:0,maxJumpM:0,actions:{pass:0,dribble:0,shot:0},possChanges:0
 };
 return s.telemetry;
}
function voltaEngineReport(){
 const s=voltaMatchState;if(!s)return null;
 const t=voltaV113EnsureTelemetry();
 const report={score:{...s.score},time:s.time,telemetry:JSON.parse(JSON.stringify(t||{})),memory:JSON.parse(JSON.stringify(s.teamMemory||{}))};
 try{console.log('[VOLTA V113 ENGINE REPORT]',report)}catch(e){}
 return report;
}
function voltaV113EngineInit(){
 const s=voltaMatchState;if(!s)return;
 const now=voltaV113Now();
 s.engine={version:'V113-CONTINUOUS',nextDecisionAt:now+650,pendingHalftime:false,firstKickoff:null,lastPossession:s.board?.possession||null};
 s.teamMemory={home:{recycle:0,sameLane:0,lastLane:0,lastTargets:[],lastCarrier:null},away:{recycle:0,sameLane:0,lastLane:0,lastTargets:[],lastCarrier:null}};
 s.phaseBlend={home:0,away:0};
 s.playAction=null;s.setPiece=null;s.halftime={active:false,entered:false};
 voltaV113EnsureTelemetry();
 if(s.stats){for(const side of ['home','away']){s.stats[side].kickIns=0;s.stats[side].gkTouches=0}}
}

function voltaV113RoleInfo(side,p){
 const s=voltaMatchState,team=s?.teams?.[side];if(!team)return {role:p.position||'MF',lane:0};
 const same=team.players.filter(x=>x.position===p.position),idx=Math.max(0,same.findIndex(x=>x.name===p.name));
 if(p.position==='GK')return {role:'GK',lane:0};
 if(p.position==='DF')return {role:'FIXO',lane:0};
 if(p.position==='FW')return {role:'PIVO',lane:0};
 const lane=same.length<=1?0:(idx%2===0?-1:1);
 return {role:'ALA',lane};
}
function voltaV113BasePoint(side,p,attackK=.5){
 const dir=voltaV113SideDir(side),r=voltaV113RoleInfo(side,p);let xd,xa,y;
 if(r.role==='GK'){xd=7.5;xa=14;y=50}
 else if(r.role==='FIXO'){xd=22;xa=34;y=50}
 else if(r.role==='PIVO'){xd=47;xa=69;y=50}
 else {xd=36;xa=54;y=r.lane<0?31:r.lane>0?69:50}
 let x=xd+(xa-xd)*voltaClamp(attackK,0,1);if(side==='away')x=100-x;
 return {x:voltaClamp(x,4,96),y};
}
function voltaPitchPlayerCoords(side,players){
 const s=voltaMatchState,attacking=s?.board?.possession===side,k=attacking?.62:.28;
 return (players||[]).map(p=>{const q=voltaV113BasePoint(side,p,k);return {p,x:q.x,y:q.y}});
}

function voltaV113SetIntent(side,p,state,opt={},force=false){
 const s=voltaMatchState;if(!s)return null;s.aiStates=s.aiStates||{home:{},away:{}};
 const now=voltaV113Now(),old=s.aiStates[side][p.name];
 if(old&&!force&&old.commitUntil>now&&old.state!==state)return old;
 const changed=!old||old.state!==state||old.targetName!==(opt.targetName||null);
 const min=Number(opt.minCommit)||520,max=Number(opt.maxCommit)||1150;
 const ai={state,targetName:opt.targetName||null,targetX:Number.isFinite(opt.targetX)?opt.targetX:null,targetY:Number.isFinite(opt.targetY)?opt.targetY:null,
  receiveTarget:opt.receiveTarget||null,reason:opt.reason||'',commitUntil:now+min+Math.random()*Math.max(0,max-min),role:voltaV113RoleInfo(side,p).role};
 s.aiStates[side][p.name]=ai;
 if(changed){const t=voltaV113EnsureTelemetry();if(t){t.intentChanges[side]++;if(state==='ROTATE')t.rotations[side]++}}
 return ai;
}
function voltaV113NearestPlayer(side,point,filterFn=null){
 const s=voltaMatchState,team=s?.teams?.[side];if(!team)return null;let best=null,bd=1e9;
 for(const p of team.players){if(filterFn&&!filterFn(p))continue;const pt=s.board?.playerPos?.[side]?.[p.name];if(!pt)continue;const d=voltaV113DistM(pt,point);if(d<bd){bd=d;best=p}}
 return best;
}
function voltaV113PressureAt(side,point){
 const s=voltaMatchState,opp=voltaOpponentSide(side);let best=99;
 for(const p of s.teams[opp].players){if(p.position==='GK')continue;const pt=s.board.playerPos?.[opp]?.[p.name];if(!pt)continue;best=Math.min(best,voltaV113DistM(pt,point))}
 return voltaClamp(1-best/6.0,0,1);
}
function voltaV113LanePressure(side,a,b){
 const s=voltaMatchState,opp=voltaOpponentSide(side);let risk=0;
 for(const p of s.teams[opp].players){if(p.position==='GK')continue;const pt=s.board.playerPos?.[opp]?.[p.name];if(!pt)continue;const d=voltaV113PointSegDistM(pt,a,b);if(d<3.6)risk+=voltaClamp((3.6-d)/3.6,0,1)}
 return voltaClamp(risk/1.8,0,1);
}
function voltaV113LikelyInterceptor(side,a,b){
 const s=voltaMatchState,opp=voltaOpponentSide(side);let best=null,bd=99;
 for(const p of s.teams[opp].players){if(p.position==='GK')continue;const pt=s.board.playerPos?.[opp]?.[p.name];if(!pt)continue;const d=voltaV113PointSegDistM(pt,a,b);if(d<bd){bd=d;best=p}}
 return best;
}

function voltaAssignAIStates(side,carrierName,force=false){
 const s=voltaMatchState;if(!s||!s.teams?.[side])return;
 const other=voltaOpponentSide(side),atk=s.teams[side].players,def=s.teams[other].players,ball=s.board?.ball||{x:50,y:50};
 const carrier=atk.find(p=>p.name===carrierName)||atk.find(p=>p.name===s.ballState?.ownerName)||null;
 const cpt=carrier?s.board.playerPos?.[side]?.[carrier.name]:ball;
 const field=atk.filter(p=>p.position!=='GK'),alas=field.filter(p=>voltaV113RoleInfo(side,p).role==='ALA'),fixo=field.find(p=>voltaV113RoleInfo(side,p).role==='FIXO'),pivo=field.find(p=>voltaV113RoleInfo(side,p).role==='PIVO'),gk=atk.find(p=>p.position==='GK');
 const wideCarrier=cpt&&Math.abs(cpt.y-50)>18;
 for(const p of atk){
  if(carrier&&p.name===carrier.name){voltaV113SetIntent(side,p,p.position==='GK'?'GK_CARRY':'CARRY',{reason:'ball carrier',minCommit:420,maxCommit:720},true);continue}
  const r=voltaV113RoleInfo(side,p);
  if(r.role==='GK'){voltaV113SetIntent(side,p,'GK_SUPPORT',{reason:'5th build-up option',minCommit:800,maxCommit:1450},force);continue}
  if(r.role==='FIXO'){
   const st=carrier?.position==='GK'?'SHOW':'FIXO_SUPPORT';voltaV113SetIntent(side,p,st,{reason:'rear safety / circulation',minCommit:720,maxCommit:1350},force);continue;
  }
  if(r.role==='PIVO'){
   const st=(carrier&&voltaV113Forward(side,cpt.x)>65)?'PIVO_PIN':'PIVO_SHOW';voltaV113SetIntent(side,p,st,{reason:'pivot reference',minCommit:800,maxCommit:1450},force);continue;
  }
  if(r.role==='ALA'){
   const otherAla=alas.find(x=>x.name!==p.name),mem=s.teamMemory?.[side]||{};let st='SUPPORT';
   if(carrier&&carrier.name===otherAla?.name){
    const cAdv=voltaV113Forward(side,cpt?.x||50);
    // 동료 ALA가 공을 잡으면 무조건 직선 침투하지 않는다. 중·후방에서는 교차 로테이션,
    // 마지막 1/3에서는 세컨드 포스트/뒷공간 RUN으로 역할을 나눈다.
    st=(cAdv<64&&((mem.sameLane||0)>=1||Math.random()<.52))?'ROTATE':'RUN';
   }
   else if(wideCarrier&&cpt&&((cpt.y<50&&r.lane>0)||(cpt.y>50&&r.lane<0)))st='FAR_POST';
   else if(carrier&&carrier.position==='GK')st='WIDE_SHOW';
   else if(carrier&&voltaV113RoleInfo(side,carrier).role==='FIXO'){
    // FIXO 전개에서는 한쪽 ALA가 발밑 지원, 반대쪽이 전진해서 다이아몬드를 회전시킨다.
    const goLane=(mem.lastLane||-1)>0?-1:1;st=(r.lane===goLane)?'RUN':'SUPPORT';
   }
   voltaV113SetIntent(side,p,st,{reason:'futsal rotation',minCommit:780,maxCommit:1480},force);
  }
 }
 // defending team: nearest presses, second covers, the rest mark/track.
 const fieldDef=def.filter(p=>p.position!=='GK').map(p=>({p,pt:s.board.playerPos?.[other]?.[p.name]})).filter(x=>x.pt).sort((a,b)=>voltaV113DistM(a.pt,ball)-voltaV113DistM(b.pt,ball));
 const attackThreats=atk.filter(p=>p.position!=='GK').slice().sort((a,b)=>{
  const ap=s.board.playerPos?.[side]?.[a.name],bp=s.board.playerPos?.[side]?.[b.name];return voltaV113Forward(side,bp?.x||50)-voltaV113Forward(side,ap?.x||50);
 });

function voltaAutoPositions(players){

voltaV113SeparateTeam=function(side){

function voltaV117ApplyRosterMigration(){if(!voltaSave||voltaSave.v117RosterMigrated)return false;const roster=voltaSave.roster||[],legacyCount=roster.filter(p=>VOLTA_V117.LEGACY_NAMES.has(p.name)).length;if(legacyCount<3){voltaSave.v117RosterMigrated=true;return false}const coach=voltaHeadCoach()?.name||voltaSave.character?.name||'임도현',raw=voltaV117CharacterRoster(coach),profiles=raw.map(p=>({...p,...voltaProfile(p.name,voltaLeague()?.grade||'G',false),hero:false,trainingXP:{physical:0,shooting:0,speed:0,passing:0,keeper:0}})),init=voltaV117InitialSlots(profiles);voltaSave.roster=profiles;voltaSave.squadSlots=init.slots;voltaSave.positions=init.positions;voltaSave.captain=profiles[0]?.name||null;voltaSave.viceCaptain=profiles[1]?.name||null;voltaSave.playerState={};for(const p of profiles)voltaSave.playerState[p.name]={happiness:70,complaint:'',lastReaction:'특별한 불만이 없습니다.'};voltaSave.v117RosterMigrated=true;try{voltaNotify('squad','선수단 개편','선택한 감독을 제외한 8명의 캐릭터가 선수단에 합류했습니다. 스쿼드 화면에서 출전 선수와 포지션을 직접 배치할 수 있습니다.','info')}catch(e){}try{voltaPersist()}catch(e){}return true}

function voltaV117HireCoach(id){const c=VOLTA_V117_COACH_MARKET.find(x=>x.id===id);if(!c||!voltaSave)return;const cost=VOLTA_V117_GRADE_COST[c.grade]||0;if((voltaSave.money||0)<cost){voltaV117Toast(`보유 재화가 부족합니다. 필요 ₩ ${cost}`);return}if(!confirm(`${c.name} ${c.grade}등급 감독과 ₩ ${cost}에 계약할까요?`))return;voltaSave.money-=cost;voltaSave.headCoach={...c};voltaSave.character=voltaSave.headCoach;voltaPersist();voltaV117Toast(`${c.name} 감독과 계약했습니다.`);render()}

function voltaV117SetupHeadHtml(){const t=voltaDraft.tactics||{mentality:'balanced',pressing:'normal',passing:'balanced',focus:'center'};return `<div class="v117-setup"><div class="v117-setup-head"><div><small>VOLTA MANAGER · NEW CAREER</small><h2>감독 캐릭터 선택</h2></div><div class="v117-step">01 / 04</div></div><div class="v117-card-grid">${VOLTA_HEAD_COACHES.map((c,i)=>`<button class="v117-choice ${i===voltaDraft.characterIndex?'selected':''}" onclick="voltaDraft.characterIndex=${i};render()"><span class="mark">${voltaV117Esc(c.name.slice(-1))}</span><em>${i===voltaDraft.characterIndex?'SELECTED':''}</em><h3>${voltaV117Esc(c.name)}</h3><p></p></button>`).join('')}</div><div class="v117-tactic-block"><h3>내 전술 성향</h3><div class="v117-tactic-grid"><label>공격 성향<select id="v117Mentality"><option value="defensive" ${t.mentality==='defensive'?'selected':''}>수비적</option><option value="balanced" ${t.mentality==='balanced'?'selected':''}>균형</option><option value="attacking" ${t.mentality==='attacking'?'selected':''}>공격적</option></select></label><label>압박<select id="v117Pressing"><option value="low" ${t.pressing==='low'?'selected':''}>낮음</option><option value="normal" ${t.pressing==='normal'?'selected':''}>보통</option><option value="high" ${t.pressing==='high'?'selected':''}>높음</option></select></label><label>패스 스타일<select id="v117Passing"><option value="short" ${t.passing==='short'?'selected':''}>짧은 패스</option><option value="balanced" ${t.passing==='balanced'?'selected':''}>균형</option><option value="fast" ${t.passing==='fast'?'selected':''}>빠른 전개</option></select></label><label>공격 집중<select id="v117Focus"><option value="center" ${t.focus==='center'?'selected':''}>중앙</option><option value="wide" ${t.focus==='wide'?'selected':''}>측면</option><option value="pivo" ${t.focus==='pivo'?'selected':''}>피보 중심</option></select></label></div></div><div class="v117-setup-actions"><button onclick="mode='volta';render()">← 이전</button><button class="next" onclick="voltaV117PickHead(voltaDraft.ch function voltaV117TransferHtml(){const currentCoach=voltaHeadCoach()?.name,currentManager=voltaSave?.manager?.name;let content='';if(voltaTransferTab==='player')content=`<div class="v117-market-empty"><b>선수 데이터 준비 중</b><span>선수 이적시장 슬롯은 만들어 두었습니다. 추후 선수 데이터를 입력하면 이 영역에 카드가 표시됩니다.</span></div>`;else{const arr=voltaTransferTab==='coach'?VOLTA_V117_COACH_MARKET:VOLTA_V117_MANAGER_MARKET;content=`<div class="v117-market-grid">${arr.map(c=>{const current=(voltaTransferTab==='coach'?currentCoach:currentManager)===c.name,cost=VOLTA_V117_GRADE_COST[c.grade];return `<article class="v117-market-card ${current?'current':''}"><div class="top"><span>${voltaTransferTab==='coach'?'HEAD COACH':'TEAM MANAGER'}</span><b class="grade">${c.grade}</b></div><h3>${voltaV117Esc(c.name)}</h3><p>${voltaTransferTab==='coach'?(VOLTA_V117_STYLE_LABEL[c.style]||'균형 운영'):`${c.grade}등급 컨디션 · 운영 관리`}</p><button ${current?'disabled':''} onclick="${voltaTransferTab==='coach'?`voltaV117HireCoach('${c.id}')`:`voltaV117HireManager('${c.id}')`}">${current?'현재 계약 중':`₩ ${cost} · 계약하기`}</button></article>`}).join('')}</div>`}return `<div class="volta-subpage"><div class="volta-subhead"><div><small>TRANSFER MARKET</small><h2>이적시장</h2><p>선수 영입과 스태프 계약을 한 곳에서 관리합니다.</p></div><div><b>보유 ₩ ${Number(voltaSave?.money||0).toLocaleString()}</b></div></div><div class="v117-transfer-tabs"><button class="${voltaTransferTab==='player'?'active':''}" onclick="voltaV117SetTransferTab('player')">선수</button><button class="${voltaTransferTab==='coach'?'active':''}" onclick="voltaV117SetTransferTab('coach')">감독</button><button class="${voltaTransferTab==='manager'?'active':''}" onclick="voltaV117SetTransferTab('manager')">매니저</button></div>${content}</div>`}

render=function(){const r=voltaV117RenderBase();try{voltaV117EnhanceUI()}catch(e){console.error('[V117 UI]',e)}return r};
